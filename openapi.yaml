    post:
      summary: Register data source
      description: |
        Idempotently register one addressable data source for an integration. Requires tenant owner or admin role. When backend lookup is needed, only a successful null result permits manual registration with the existing kind validation. Backend failure or an invalid descriptor returns 500/503 before creating the data source or publishing events. Backend metadata is checked against payload_shape before merging; invalid keys, excessive depth, key count, value length or total size produce DEPENDENCY_CONTRACT_VIOLATION (500). Client metadata retains VALIDATION_ERROR/INTEGRATION_PAYLOAD_TOO_LARGE (422). Known getDataSource credential rejections (FORGEJO_TOKEN_INVALID/401, FORGEJO_TOKEN_SCOPE_INSUFFICIENT/422) produce BACKEND_CREDENTIALS_REJECTED (422). FORGEJO_BACKEND_API_ERROR/401/403/404/422 produces BACKEND_RESOURCE_REJECTED (422), including when the repository does not exist. Unknown code/status combinations and BACKEND_CAPABILITY_NOT_SUPPORTED/422 produce DEPENDENCY_CONTRACT_VIOLATION (500). All rejections stop registration without side effects. Only a successfully returned null confirms absence; exceptions never permit manual registration. Forgejo lookup requires a repository object with full_name in owner/repo format, at most 512 characters: exactly two nonempty segments containing ASCII letters, digits, underscores, hyphens or dots; dot and dot-dot segments are forbidden. Missing or extra segments and excessive length are invalid. An HTTP 200 with HTML, an empty body, a JSON scalar/null, a list or an invalid repository object produces DEPENDENCY_CONTRACT_VIOLATION (500), without a data source, outbox entry or linked event. Dependency error details contain only source and operation. The existing condition for looking up an incomplete client payload is unchanged.
