        - $ref: '#/components/schemas/TaskUnknownActivity'
    TaskTimelineScope:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
                - task
          required:
            - type
        - type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
                - agents
            agent_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/AgentId'
          required:
            - type
            - agent_ids
      description: Server-owned conversation branch membership, independent of actor and executor. Task lifecycle and unlinked events are task-scoped. Comments inherit the union of triggered iteration owners (or their execution agents when owner is null). Other linked events inherit the iteration owner; ownerless execution and publication events use the private activity agent snapshot, while iteration-level events include all execution agents even for unknown kinds with an author or payload agent snapshot. An ownerless publication without a definite result agent is task-scoped, including mixed-agent file sets from a broadcast iteration; it never inherits all executors. A proven shared iteration owner still takes precedence. A snapshot alone does not imply an execution link. Immutable write-time envelope facts survive parent iteration/execution/agent deletion, so fixed task/agent classification remains stable. Only comment and broadcast memberships are live. There is no pending scope. Removed executors have no UI tab.
    TaskActivityResponseData:
      allOf:
        - $ref: '#/components/schemas/TaskActivityBaseData'
        - type: object
          properties:
            id: {}
            seq:
              type: integer
              minimum: 1
              nullable: false
            iteration_id: {}
            execution_id: {}
            actor_type: {}
            actor_id: {}
            kind: {}
            body: {}
            payload: {}
            created_at: {}
            timeline_scope:
              $ref: '#/components/schemas/TaskTimelineScope'
          required:
            - timeline_scope
          additionalProperties: false
          oneOf:
            - properties:
                kind:
                  enum:
                    - user_comment
                    - agent_message
                body:
                  type: string
            - properties:
                kind:
                  not:
                    enum:
                      - user_comment
                      - agent_message
    TaskActivityListResponseData:
      type: array
      items:
        $ref: '#/components/schemas/TaskActivityResponseData'
    TaskProjectActivityResponseData:
      allOf:
        - $ref: '#/components/schemas/TaskActivityBaseData'
        - type: object
          properties:
            id: {}
            seq:
              type: integer
              minimum: 1
              nullable: false
              description: 'Per-task publication sequence of the item''s own task, identical to the value in that task''s feed and WS. Not a project-wide order: project order is the private project_seq carried only inside cursors.'
            iteration_id: {}
            execution_id: {}
            actor_type: {}
            actor_id: {}
            kind: {}
            body: {}
            payload: {}
            created_at: {}
            task_id:
              $ref: '#/components/schemas/TaskId'
          required:
            - task_id
          additionalProperties: false
          oneOf:
            - properties:
                kind:
                  enum:
                    - agent_message
                body:
                  type: string
            - properties:
                kind:
                  not:
                    enum:
                      - agent_message
                body:
                  type: string
                  nullable: true
                  enum:
                    - null
          allOf:
            - oneOf:
                - properties:
                    actor_type:
                      enum:
                        - user
                        - agent
                - properties:
                    actor_type:
                      enum:
                        - system
                        - runner
                    actor_id:
                      type: string
                      nullable: true
                      enum:
                        - null
      description: Project feed omits timeline_scope, keeps task_id, forces body=null except agent_message, and actor_id=null for system/runner. Kinds are selected by configured significant/success/error lists; schema coverage does not imply every kind appears with default filters.
    TaskProjectActivityListResponseData:
      type: array
      items:
        $ref: '#/components/schemas/TaskProjectActivityResponseData'
    TaskActivityPayload:
      type: object
      description: Kind-specific payload restrictions are applied to the whole activity by TaskActivityBaseData.oneOf. Empty payloads are JSON objects for every kind, including unknown kinds, in these two feeds and the common WS DTO.
    TaskExecutorAssignedActivityPayload:
      type: object
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
      required:
        - agent_id
      additionalProperties: false
    TaskExecutionQueuedActivityPayload:
      type: object
      required:
        - agent_id
      description: Content of execution_queued activities from current enqueue and runner-retry paths. Envelope iteration_id and execution_id are guaranteed on every enqueue/retry path. agent_id identifies the executor; routing uses timeline_scope, not this hint. This is distinct from task_execution.queued domain event data.
      properties:
        agent_id:
          $ref: '#/components/schemas/AgentId'
        attempt:
          type: integer
          minimum: 0
          description: Present on runner failure or orphan requeue; omitted on initial enqueue.
        retryable:
          type: boolean
          enum:
            - true
          description: Present on runner failure or orphan requeue; omitted on initial enqueue.
      additionalProperties: false
    TaskIterationCreatedActivityPayload:
      type: object
      required:
        - sequence
        - trigger_type
        - trigger_activity_id
      description: Content of iteration_created activities. The iteration row is authoritative for sequence, trigger_type, and trigger_activity_id. reason is optional human input. Accepted input snapshots expose the same encoded source IDs as iteration inputs; the audit payload stores numeric IDs and encodes them when returned.
      properties:
        sequence:
          type: integer
          minimum: 1
        trigger_type:
          $ref: '#/components/schemas/TaskIterationTrigger'
        trigger_activity_id:
          nullable: true
          type: string
          pattern: ^act_[a-zA-Z0-9]{6,}$
        reason:
          type: string
          description: Present only for nonempty user-supplied iteration reason.
        input_artifacts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskIterationInputArtifact'
          description: Present only when the accepted input snapshot is nonempty.
      additionalProperties: false
    TaskExecutionProgressPercent:
      description: The callback validates but does not cast this value. Public activity JSON preserves an integer in 0..100, null (also when omitted), or the accepted string verbatim. Strings may contain a decimal integer in 0..100 with an optional plus sign and surrounding spaces, tabs, CR, LF or vertical tabs; negative zero is also accepted. The empty string is accepted as an optional value and remains empty. FE must handle these forms before displaying a percentage; the public projection preserves the callback value.
      oneOf:
        - type: integer
          nullable: true
          minimum: 0
          maximum: 100
        - type: string
          pattern: ^(?:[ \t\r\n\v]*(?:\+?(?:0|[1-9][0-9]?|100)|-0)[ \t\r\n\v]*)?$
    TaskExecutionProgressActivityPayload:
      type: object
      properties:
        message:
          type: string
          nullable: true
          maxLength: 10000
        progress_percent:
          $ref: '#/components/schemas/TaskExecutionProgressPercent'
