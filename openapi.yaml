        - Tasks
      summary: List task executions
      operationId: taskExecutionsList
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/TaskPageQuery'
        - $ref: '#/components/parameters/TaskPerPageQuery'
        - name: ids[]
          in: query
          style: form
          explode: true
          description: Array only, e.g. ids[]=exe_...&ids[]=exe_...; CSV is unsupported. Ordinary filter combined with page/per_page and sort_order; total counts matching rows of this task only. Valid unknown IDs and IDs belonging to another task are silently skipped; duplicates are deduplicated. Invalid format or wrong entity returns 404 NOT_FOUND; over 100 elements or empty elements return 422 VALIDATION_ERROR. sort_order defaults to desc; ties use internal ID in the same direction.
          schema:
            type: array
            maxItems: 100
            items:
