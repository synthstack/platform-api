          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - disabled
              - error
        - name: search
          in: query
          required: false
          description: Case-insensitive match against display name.
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - display_name
              - name
              - created_at
              - status
            default: created_at
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: Integration list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        $ref: '#/components/schemas/IntegrationListResponseData'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Tenant context required or forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: BACKEND_PORT_UNAVAILABLE (configuration/missing method), DEPENDENCY_CONFIGURATION_ERROR (invalid backend error mirror), DEPENDENCY_CONTRACT_VIOLATION, or DEPENDENCY_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: DEPENDENCY_UNAVAILABLE — a required backend call is temporarily unavailable. The operation does not fall back to defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Integrations
    post:
      summary: Create integration
      description: Register a new external source integration and store encrypted credentials. Requires tenant owner or admin role.
      operationId: integrationCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCreateRequestBody'
      responses:
        '201':
          description: Integration created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/IntegrationResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Tenant context required, or caller is not tenant owner/admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Unknown backend type, payload limit, unknown field, invalid config, quota, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationWriteErrorResponse'
        '500':
          description: BACKEND_PORT_UNAVAILABLE (configuration/missing method), DEPENDENCY_CONFIGURATION_ERROR (backend configuration or tenant quota port/method resolution), DEPENDENCY_CONTRACT_VIOLATION, or DEPENDENCY_FAILED; CREDENTIALS_KEY_NOT_CONFIGURED or CREDENTIALS_VAULT_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: DEPENDENCY_UNAVAILABLE — a required backend or tenant quota call is temporarily unavailable, including uninitialized quota state. Tenant quota errors identify source tenant and operation quotaService.reserveIntegrationSlot. No integration, credential, counter or event change is committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Integrations
  /integrations/backend-types:
    get:
      summary: List integration backend types
      description: List all configured backend types and their validated capabilities. A failed backend entry remains in the catalog with availability=unavailable and the other entries are returned normally. Contracts are null when the implementation cannot be resolved, or an object with all six fields false for an implementation without shared interfaces. Every present known operational flag must be boolean; invalid flags make that entry unavailable. Missing optional flags are allowed. Successfully validated capabilities are reused only within the request and cleared on request reset or a failed backend operation. Listing does not perform live connectivity tests and structural contracts do not imply credentials or permissions.
      operationId: integrationBackendTypeList
      responses:
        '200':
          description: Complete backend type list, including unavailable entries with safe capability descriptors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/BackendTypeListResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Tenant context required or forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Request-level configuration or internal failure preventing catalog enumeration; failures of individual backends are represented in the 200 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Request-level dependency unavailable, preventing catalog enumeration; an unavailable individual backend does not fail the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Integrations
