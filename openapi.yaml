  /auth/me:
    get:
      summary: Get current user
      description: Get current user profile with live tenant flags. Tenant is null when the access token has no tenant. A tenant referenced by the token must exist.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthCurrentUserResponseData'
        '401':
          description: Unauthorized - missing or malformed Authorization header (UNAUTHORIZED) or invalid/expired token (INVALID_TOKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: idEncode port failure during access token verification or tenant port failure while fetching live flags (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED). Tenant dependency details contain only source tenant and operation tenantService.getById.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: idEncode token claim processing or tenant flag lookup is temporarily unavailable (DEPENDENCY_UNAVAILABLE). Tenant dependency details contain only source tenant and operation tenantService.getById.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: get_auth_me
    patch:
      summary: Update profile
      description: Update user profile information and return live tenant flags. Flags are fetched before the profile is written. A tenant referenced by the token must exist; a missing tenant causes DEPENDENCY_CONTRACT_VIOLATION without changing the profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required:
                    - full_name
                - required:
                    - prefer_lang
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Jane Doe
                prefer_lang:
                  type: string
                  enum:
                    - en
                    - ru
                    - uk
                    - zh
                  description: Preferred locale used for email notifications.
                  example: uk
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthCurrentUserResponseData'
        '401':
          description: Unauthorized (UNAUTHORIZED or INVALID_TOKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: idEncode port failure during access token verification or tenant port failure while fetching live flags (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED). Tenant dependency details contain only source tenant and operation tenantService.getById. The profile is not changed, including updated_at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: idEncode token claim processing or tenant flag lookup is temporarily unavailable (DEPENDENCY_UNAVAILABLE). Tenant dependency details contain only source tenant and operation tenantService.getById. The profile is not changed, including updated_at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: patch_auth_me
  /auth/me/2fa:
    get:
      summary: Get current user's two-factor authentication status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current TOTP enrollment status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTwoFactorStatusResponseData'
                    required:
                      - data
        '401':
          description: Unauthorized (UNAUTHORIZED or INVALID_TOKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          $ref: '#/components/responses/AuthBearerDependencyFailure'
        '503':
          $ref: '#/components/responses/AuthBearerDependencyUnavailable'
      tags:
        - Auth
      operationId: get_auth_me_2fa
      description: Get current user's two-factor authentication status
  /auth/me/2fa/setup:
    post:
      summary: Start or restart TOTP enrollment
      description: Re-authenticates with the current password and returns the secret exactly once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Server validation allows at most 128 UTF-8 bytes.
              required:
                - password
      responses:
        '200':
          description: Pending TOTP secret created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTwoFactorSetupResponseData'
                    required:
                      - data
        '401':
          description: Unauthorized (UNAUTHORIZED or INVALID_TOKEN) or current password is invalid (INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: TOTP is already active (TWOFA_ALREADY_ENABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: TOTP configuration, secret generation or encryption failed (TWOFA_INTERNAL_ERROR); idEncode bearer verification failed (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          $ref: '#/components/responses/AuthBearerDependencyUnavailable'
      tags:
        - Auth
      operationId: post_auth_me_2fa_setup
  /auth/me/2fa/confirm:
    post:
      summary: Confirm and activate TOTP enrollment
      description: Revokes every refresh session, then issues a new JWT pair for the current device. Tenant membership is resolved outside the database transaction, before checking the account, pending credential and confirmation code under lock. A tenant or idEncode dependency failure preserves existing sessions and pending enrollment. Tenant errors expose only details[].source=tenant and details[].operation=tenantService.getByUserId; technical context and debug are omitted. idEncode errors expose only details[].source=idEncode and details[].operation=idEncodeService.encodeEntityIdStrict (or idEncodeService.decodeExternalId during bearer verification); technical context and debug are omitted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  $ref: '#/components/schemas/AuthTotpCode'
              required:
                - code
      responses:
        '200':
          description: TOTP enabled and replacement JWT pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTwoFactorConfirmResponseData'
                    required:
                      - data
        '401':
          description: TOTP code is invalid (TWOFA_CODE_INVALID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: TOTP is already active (TWOFA_ALREADY_ENABLED) or pending setup is missing/expired (TWOFA_SETUP_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: TOTP secret decryption or internal 2FA processing failed (TWOFA_INTERNAL_ERROR); Tenant or idEncode port configuration, response contract or invocation failed (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Tenant membership or idEncode token claim processing is temporarily unavailable (DEPENDENCY_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_me_2fa_confirm
  /auth/me/2fa/disable:
    post:
      summary: Disable TOTP using the current password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Server validation allows at most 128 UTF-8 bytes.
              required:
                - password
      responses:
        '200':
          description: Active TOTP is disabled or a pending setup is cancelled, without revoking sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
