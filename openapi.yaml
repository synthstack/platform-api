          type: array
          items:
            type: string
        timeout_ms:
          type: integer
          nullable: true
          default: 60000
        is_trusted:
          type: boolean
          default: false
        is_enabled:
          type: boolean
          default: true
        use_global_env:
          type: boolean
          default: false
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
      required:
        - id
        - project_id
        - name
        - type
        - config
        - env_variables
        - allowed_tools
        - timeout_ms
        - is_trusted
        - is_enabled
        - use_global_env
        - created_at
        - updated_at
