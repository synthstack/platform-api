      tags:
        - Tenant
      operationId: get_tenant_workflow_secrets
  /tenant/workflow-secrets/{name}:
    put:
      summary: Create or replace a current tenant workflow secret
      description: Owner membership in an active tenant is required, including for platform superadmins. Replaces the entire value; created_at is preserved and updated_at is refreshed. Every successful PUT synchronously emits tenant_workflow_secret.updated with only tenant_id and secret_name. Values are encrypted at rest and never returned or logged. Name format validation precedes reserved-name checks; execution_token is invalid format, while EXECUTION_TOKEN is reserved. The default limit is 50 secrets per tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: ^[A-Z][A-Z0-9_]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantWorkflowSecretUpsertRequestBody'
      responses:
        '200':
          description: Workflow secret stored; value omitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantWorkflowSecretMetadata'
        '401':
          $ref: '#/components/responses/TenantOwnerUnauthorized'
        '403':
          $ref: '#/components/responses/TenantOwnerForbidden'
        '422':
          description: VALIDATION_ERROR (field details), RESERVED_SECRET_NAME, or SECRET_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Tenant
      operationId: put_tenant_workflow_secrets_name
    delete:
      summary: Delete a current tenant workflow secret
      description: Owner membership in an active tenant is required, including for platform superadmins. Synchronously emits tenant_workflow_secret.deleted with only tenant_id and secret_name. There is no reserved-name special case; absent secrets return NOT_FOUND. Noncanonical names do not match the route.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9_]*$
      responses:
        '204':
          description: Workflow secret deleted; empty response body
        '401':
          $ref: '#/components/responses/TenantOwnerUnauthorized'
        '403':
          $ref: '#/components/responses/TenantOwnerForbidden'
        '404':
          description: NOT_FOUND - workflow secret does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Tenant
      operationId: delete_tenant_workflow_secrets_name
