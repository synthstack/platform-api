      description: List task publications
    post:
      tags:
        - Tasks
      summary: Create task publication
      description: A capability pull_request publication request returns `409 SOURCE_CONTEXT_CHANGED` if the saved source context or Git grant is missing/invalid or the selected repository no longer matches the attached source. A matching replay with `Idempotency-Key` returns the accepted publication before this check. Without `Idempotency-Key`, a repeat request validates the source context before looking up an existing PR publication and can return `409 SOURCE_CONTEXT_CHANGED`.
      operationId: taskPublicationCreate
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - name: Idempotency-Key
          in: header
          description: Required for new capability upload/external_link requests; optional for manual publications and capability PR. A supplied key identifies the request across all types and modes within the task. Repeats return the original record with status 201, including failed status; changed mode, destination, selection or metadata returns 409 IDEMPOTENCY_KEY_CONFLICT. Without a key, PR requests reuse the existing decision for the same result, destination and iteration, including failed status, without another dispatch. A new attempt after failure requires a new Idempotency-Key.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPublicationCreateRequestBody'
      responses:
        '201':
          description: Publication created, or the original idempotent record returned unchanged. New capability records start pending.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskPublicationResponseData'
        '401':
          $ref: '#/components/responses/TasksUnauthorized'
        '403':
          $ref: '#/components/responses/TasksForbidden'
        '404':
          $ref: '#/components/responses/TasksNotFound'
        '409':
