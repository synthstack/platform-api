            - kind
            - name
            - available
      additionalProperties: false
    TaskAgentMessageActivityPayload:
      type: object
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/TaskAgentMessageActivityMetadata'
          description: Present only if the callback supplies non-null metadata. Object keys and list items are extensible without business guarantees.
      additionalProperties: false
    TaskAgentMessageActivityMetadata:
      description: The message callback accepts both object metadata and lists. Nonempty lists are preserved; empty metadata is returned as {}. Attachments are reserved and normalized only in the object form. This does not widen progress/completion metadata.
      oneOf:
