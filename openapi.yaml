        - name
        - display_name
        - engine
        - engine_config_id
        - model
        - model_params
        - engine_prompt_mode
        - role
        - status
        - is_editable
        - created_at
    AgentProfile:
      type: object
      description: Sparse profile configuration. Fields are optional because a scope stores only configured overrides.
      minProperties: 1
      additionalProperties: false
      properties:
        timeout:
          type: integer
          minimum: 60
          maximum: 86400
        git_operations:
          type: boolean
        ci_services:
          type: boolean
        diff_patterns:
          type: string
          enum:
            - raw
            - frontend
            - backend
            - all
        diff_max_file_lines:
          type: integer
          minimum: 0
        diff_max_file_size:
          type: integer
          minimum: 0
        diff_exclude_tests:
          type: boolean
        diff_exclude_locks:
          type: boolean
        diff_exclude_generated:
          type: boolean
        diff_custom_exclude:
          type: string
          maxLength: 2000
        iteration_strategy:
          type: string
          enum:
            - inline
            - reference
        iteration_max_lines:
          type: integer
          minimum: 0
        iteration_max_size:
          type: integer
          minimum: 0
        work_dir:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*[\\\r\n\u0000]).+$
          description: Relative working directory. Must not be empty, absolute, contain backslashes, line breaks, NUL bytes, or '..' path segments.
        task_context:
          type: object
          additionalProperties: false
          properties:
            history_mode:
              type: string
              enum:
                - trigger_only
                - full_thread
          required:
            - history_mode
    AgentProfilePatch:
