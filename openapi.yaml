  /access-requests:
    post:
      summary: Submit access request
      description: Submit request for platform access (public endpoint)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - organization
                - country
                - phone
                - developers_count
                - plan_code
                - cf-turnstile-response
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: John Doe
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Server validation allows at most 255 UTF-8 bytes.
                  example: john@example.com
                organization:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Acme Corp
                country:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: United States
                phone:
                  type: string
                  minLength: 5
                  maxLength: 50
                  example: +1-555-123-4567
                developers_count:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 10
                plan_code:
                  type: string
                  maxLength: 50
                  pattern: ^[a-z0-9_]+$
                  example: pro
                prefer_lang:
                  type: string
                  enum:
                    - en
                    - ru
                    - uk
                    - zh
                  description: Preferred locale for the requested account and its email notifications.
                  example: ru
                cf-turnstile-response:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Cloudflare Turnstile token obtained from the client widget
      responses:
        '201':
          description: Access request submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthAccessRequestResponseData'
        '409':
          description: Duplicate request - a pending request with this email already exists (DUPLICATE_REQUEST)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error, including a missing, malformed, expired, reused, or rejected captcha token (VALIDATION_ERROR), or selected plan is not available (PLAN_NOT_AVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: 'Billing plan catalog call failed (DEPENDENCY_FAILED): an unexpected failure or owner HTTP >=500 other than 502/503. Safe details contain only source billing and operation planCatalogService.getByCode.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Captcha provider is unavailable while fail-open is disabled (CAPTCHA_UNAVAILABLE), or the billing plan catalog owner signalled HTTP 502/503 (DEPENDENCY_UNAVAILABLE). Billing dependency details contain only source billing and operation planCatalogService.getByCode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
