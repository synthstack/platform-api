  /tenant:
    get:
      summary: Get tenant
      description: Return current tenant context for any authenticated member of an active tenant.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant context
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantContextData'
        '401':
          description: UNAUTHORIZED for missing or malformed Bearer authorization; INVALID_TOKEN for an invalid or expired token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: TENANT_REQUIRED (missing membership/context), TENANT_INACTIVE, or FORBIDDEN (token tenant does not match membership).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: TENANT_NOT_FOUND - tenant does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Tenant
      operationId: get_tenant
    patch:
      summary: Update tenant
      description: Update the organization profile as the current tenant owner. Platform superadmin status grants no additional access; a superadmin with owner membership is allowed. At least one known field is required. Unknown fields (including status and quotas) are ignored. Explicit null clears the four nullable profile fields; empty strings are invalid. billing_email overrides the owner contact for billing notifications formed after saving; already queued notifications keep their saved contact. default_lang affects billing language only when billing_email is set.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              anyOf:
                - required:
                    - name
                - required:
                    - slug
                - required:
                    - billing_email
                - required:
                    - contact_email
                - required:
                    - timezone
                - required:
                    - default_lang
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Acme Inc
                slug:
                  type: string
                  minLength: 2
                  maxLength: 64
                  pattern: ^[a-z0-9]+(-[a-z0-9]+)*(?![\s\S])
                  example: acme-inc
                billing_email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 255
                  nullable: true
                  description: Organization billing address; null restores delivery to the owner.
                contact_email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 255
                  nullable: true
                  description: Organization contact address; stored for future use.
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                  nullable: true
                  description: IANA timezone identifier from PHP's timezone catalog, including UTC, Etc/UTC, Etc/GMT+3, and backward-compatible aliases. Custom offsets such as GMT+03:00 are rejected. null clears the setting.
                  example: Europe/Kyiv
                default_lang:
                  type: string
                  minLength: 1
                  maxLength: 8
                  nullable: true
                  description: Validated by auth's preferredLang rule on PATCH and passed unchanged to billing when billing_email is set. null uses the owner language or en if absent.
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantProfileData'
        '401':
          $ref: '#/components/responses/TenantOwnerUnauthorized'
        '403':
          description: TENANT_REQUIRED (no membership), TENANT_INACTIVE, or FORBIDDEN (tenant role is not owner or token tenant does not match membership).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: TENANT_NOT_FOUND - tenant does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: DUPLICATE_TENANT_SLUG - another tenant already uses the slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR - invalid fields, empty body, or no known profile fields; details identify fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Tenant
      operationId: patch_tenant
