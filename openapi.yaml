        - VALIDATION_ERROR
        - BACKEND_TYPE_UNKNOWN
        - INTEGRATION_PAYLOAD_TOO_LARGE
        - INTEGRATION_UNKNOWN_FIELD
        - INTEGRATION_CONFIG_INVALID
        - QUOTA_EXCEEDED
        - CREDENTIALS_REFERENCE_INVALID
