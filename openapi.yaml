        - type: object
          properties:
            error:
              $ref: '#/components/schemas/IntegrationWriteErrorDetails'
          required:
            - status
            - error
    IntegrationCapabilities:
      type: object
      description: Stable public capability contract for a configured backend type. Backend-specific keys are exposed under extras.
      properties:
        discover:
          type: boolean
          description: Whether the integration supports data-source browsing via the discover endpoint.
        supported_kinds:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceKind'
          description: Data source kinds supported by the backend.
        secret_config_keys:
          type: array
          items:
            type: string
          description: Config keys treated as secrets and hidden from public responses.
        extras:
          type: object
          description: Backend-specific capability flags and hints.
          additionalProperties: true
        contracts:
          type: object
          nullable: true
          description: Structural shared-interface declarations; not credential availability or permission. Null when the implementation cannot be resolved. A resolved implementation retains its structural contracts when getCapabilities fails or returns an invalid descriptor; availability becomes unavailable. BackendCommonInterface is optional for independent capability dispatch. Without it, the host does not call getCapabilities and reports availability=available, discover=false and supported_kinds=[] without inferring positive operational flags from structural contracts. An implementation without shared interfaces returns all six fields as false and availability=unavailable; callable methods do not permit dispatch. Operations on such an implementation return 503 SOURCE_UNAVAILABLE; the SPI contract violation is diagnosed internally.
          required:
            - backend
            - data_source
            - files
            - access_token
            - git_source
            - pull_request
          properties:
            backend:
              type: boolean
            data_source:
              type: boolean
            files:
              type: boolean
            access_token:
              type: boolean
            git_source:
              type: boolean
            pull_request:
              type: boolean
        availability:
          type: string
          enum:
            - available
            - unavailable
      required:
        - discover
        - supported_kinds
        - secret_config_keys
        - extras
        - contracts
        - availability
      additionalProperties: false
