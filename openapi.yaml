    post:
      summary: Upload and canonicalize a reusable skill ZIP
      description: Accepts either SKILL.md at the ZIP root, or exactly one top-level directory with a case-sensitive SKILL.md directly inside it and no other root files. A valid wrapper directory is stripped before storage. Top-level __MACOSX content and .DS_Store, Thumbs.db, and desktop.ini files at any depth are removed automatically. The returned sha256 and size_bytes describe the stored canonical archive; already-canonical archives without OS junk are stored byte-for-byte. If SKILL.md omits name, a new archive requires a safe upload filename for fallback naming. Once the same canonical bytes are stored, a later unsafe local filename does not block deduplication; the existing content-derived name is reused.
      operationId: createSkill
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
