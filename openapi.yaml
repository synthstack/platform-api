      description: 'Returns source execution and agent IDs without a directory lookup. Source-agent names are resolved only when building execution context. Project access failures remain local DEPENDENCY_*. Pagination requires integer page >= 1 and per_page from 1 to 100 (defaults: 1 and 20). Invalid values or an unrepresentable pagination offset return 422 VALIDATION_ERROR with field-level details. These rules also apply when filtering by ids[].'
