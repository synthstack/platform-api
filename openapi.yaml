        transports:
          type: array
          items:
            type: string
            enum:
              - usb
              - nfc
              - ble
              - hybrid
              - internal
      required:
        - id
        - type
    PasskeyCreationOptions:
      type: object
      properties:
        challenge:
          type: string
          description: Base64url-encoded single-use challenge
        timeout:
          type: integer
          example: 300000
        rp:
          type: object
          properties:
            id:
              type: string
              example: console.synthstack.ai
            name:
