        timeout:
          type: integer
          example: 300000
        rp:
          type: object
          properties:
            id:
              type: string
              example: console.synthstack.ai
            name:
              type: string
              example: SynthStack Console
          required:
            - id
            - name
        user:
          type: object
          properties:
            id:
              type: string
              description: Base64url-encoded opaque user handle
            name:
              type: string
              format: email
            displayName:
              type: string
          required:
            - id
            - name
            - displayName
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - public-key
              alg:
                type: integer
            required:
              - type
              - alg
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              type: string
              enum:
                - required
            requireResidentKey:
              type: boolean
              enum:
                - true
            userVerification:
              type: string
              enum:
                - required
          required:
            - residentKey
            - userVerification
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
      required:
        - challenge
        - timeout
        - rp
        - user
        - pubKeyCredParams
        - authenticatorSelection
        - excludeCredentials
    PasskeyRequestOptions:
      type: object
      properties:
        challenge:
          type: string
          description: Base64url-encoded single-use challenge
        timeout:
          type: integer
          example: 300000
        rpId:
          type: string
          example: console.synthstack.ai
        userVerification:
          type: string
          enum:
            - required
        allowCredentials:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/WebAuthnCredentialDescriptor'
      required:
        - challenge
        - timeout
        - rpId
        - userVerification
        - allowCredentials
