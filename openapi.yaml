  /tasks/projects/{project_id}/activities:
    get:
      tags:
        - Tasks
      summary: List project activities
      description: 'Only published rows are visible, ordered by private project_seq. Both feeds use the same AES-256-GCM tfc1 positional token and navigation. after selects nearest newer positions, before nearest older; data is always ASC. order=asc (default) bootstraps oldest, order=desc newest; cursor direction overrides order. next_cursor is the page maximum for after, prev_cursor the minimum for before. Complete multi-page after catch-up at has_more=false, advancing only fully applied prefixes. Tokens bind feed=project, tenant, project and generation; zero is valid and discovers the first publication via after. Deleting rows never invalidates a token, even above the remaining tail. Empty bootstrap uses MAX(project_seq) of published rows in the same repeatable-read snapshot as data and summary, or zero. The maximum is independent of kind/since/task visibility filters; the empty page has checked no matching rows through that position. Counters are never read for client positions. Empty continuation returns the exact input token twice, without advancement. Summary counts published rows in the same snapshot and since window with configured kind groups. Invalid structure returns 422 VALIDATION_ERROR; wrong feed/context, non-tfc1 tokens (including act_), corruption, unknown key or generation return 422 INVALID_CURSOR. Project numeric windows are unsupported. INVALID_CURSOR requires a full repeat of history with the same filters: explicit order=desc bootstrap, then before=prev_cursor to has_more=false with dedup. Save the bootstrap next_cursor separately; only a successful complete traversal confirms it for after catch-up, including concurrent publications. An intermediate error or filter change forbids confirmation. Empty bootstrap completes recovery; one nonempty newest page alone does not. See /~/api_docs/task-events.md for the full policy.'
      operationId: projectActivitiesList
      parameters:
        - $ref: '#/components/parameters/TaskProjectIdPath'
        - name: order
          in: query
          description: Select oldest/newest bootstrap; ignored with a cursor. Data remains ascending.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - success
              - error
            default: all
        - name: since
          in: query
          required: false
          description: Inclusive lower bound for activity created_at. Applies to both data and summary.
          schema:
            type: string
            format: date-time
        - name: after
          in: query
          required: false
          description: Opaque project boundary; select strictly newer positions. Mutually exclusive with before.
          schema:
            $ref: '#/components/schemas/TaskFeedCursor'
        - name: before
          in: query
          required: false
          description: Opaque project boundary; select strictly older positions. Mutually exclusive with after.
          schema:
            $ref: '#/components/schemas/TaskFeedCursor'
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Project activity feed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskProjectActivityListResponseData'
                      meta:
                        $ref: '#/components/schemas/TaskProjectActivityCursorMeta'
        '401':
          $ref: '#/components/responses/TasksUnauthorized'
        '403':
          $ref: '#/components/responses/TasksForbidden'
        '404':
          $ref: '#/components/responses/TasksNotFound'
        '422':
          $ref: '#/components/responses/TasksValidationError'
        '500':
          $ref: '#/components/responses/TasksProjectDependencyError'
        '503':
          $ref: '#/components/responses/TasksProjectDependencyUnavailable'
