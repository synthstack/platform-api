    AiAssistTextAction:
      type: string
      description: Supported AI text rewrite action.
      enum:
        - shorten
        - elaborate
        - improve_writing
        - fix_spelling_grammar
        - simplify
        - summarize
        - custom
      example: improve_writing
    AiAssistTranscriptionRequestBody:
      type: object
      description: Multipart upload validated before audio is stored and the job is queued. Additional fields are ignored.
      properties:
        file:
          type: string
          format: binary
          description: Audio file to transcribe. The default allowed formats are mp3, mp4, mpeg, mpga, m4a, wav, and webm (stt.allowed_formats); the server checks the filename and detected MIME type. AI_STT_MAX_FILE_SIZE_MB sets the module limit in MiB (1024 * 1024 bytes), 25 by default. Exceeding that limit returns 422 VALIDATION_ERROR. PHP upload size errors return 413 FILE_TOO_LARGE.
        language:
          type: string
          pattern: ^([a-zA-Z]{2})?$
          description: Optional two-letter ISO-639-1 language hint, normalized to lowercase. Omit it or send an empty string for automatic detection. Leading or trailing spaces are rejected.
          example: en
      required:
        - file
    AiAssistQueuedResponseData:
      type: object
      description: Accepted asynchronous AI job.
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^aij_[a-f0-9]{32}$
          description: Opaque correlation id used by subsequent realtime events. It is not an encoded database id.
          example: aij_9f3ca7c1e8b24d55a01f6c7d8e9012ab
        status:
          type: string
          enum:
            - queued
          example: queued
        message:
          type: string
          description: Transcription queued for audio requests; Text action queued for text requests.
          example: Transcription queued
      required:
        - id
        - status
        - message
    AiAssistTextRewriteRequestBody:
      type: object
      description: AI rewrite request for Markdown text. `custom_prompt` is required and must be non-blank when `action` is `custom`. Additional fields are ignored.
      additionalProperties: true
      properties:
        text:
          type: string
          minLength: 1
          description: Source Markdown text to edit; must be non-blank after trimming. The maximum is configured by AI_TEXT_MAX_INPUT_CHARS (10000 UTF-8 characters by default, normalized to at least 1), so the schema does not impose a fixed maxLength.
          example: Please **fix** this message.
        action:
          $ref: '#/components/schemas/AiAssistTextAction'
        custom_prompt:
          type: string
          nullable: true
          maxLength: 1000
          description: Free-form edit instruction for the custom action. The server enforces a maximum of 1000 bytes (strMaxLength), so multibyte text can reach the limit before 1000 characters. Required, non-null, and non-blank for custom; optional or null for preset actions. Supplied strings are validated for every action, then ignored for preset actions.
          example: Make it friendlier
      required:
        - text
        - action
      oneOf:
        - properties:
            action:
              type: string
              enum:
                - shorten
                - elaborate
                - improve_writing
                - fix_spelling_grammar
                - simplify
                - summarize
        - properties:
            action:
              type: string
              enum:
                - custom
            custom_prompt:
              type: string
              nullable: false
              minLength: 1
          required:
            - custom_prompt
    StandardResponse:
      type: object
      description: Canonical success envelope used by ResponseFormatter and App.success. Automatic wrapping applies to HTTP 2xx by default; HTTP 204 has no body. Routes with options.api_response.raw=true bypass the envelope. An existing status field bypasses wrapping and field hiding, although debug metrics may still be appended.
      properties:
        status:
          type: string
          enum:
            - success
          description: Fixed success marker.
        data:
          description: 'Unconstrained business payload: object, array, scalar or null, as documented by the endpoint. Explicit data=null is preserved during automatic wrapping; App.success omits data when null.'
        meta:
          description: Optional endpoint-defined metadata, conventionally an object such as PaginationMeta. Automatic wrapping copies any nonempty meta value without enforcing a type and omits empty or null values.
        debug:
          type: object
          nullable: true
          description: System metrics added when the module config.debug setting is true (default true).
      required:
        - status
    ErrorDetails:
      type: object
      description: Error details structure used in error responses.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message.
          example: Validation failed
        details:
          description: Optional public details from AbstractHttpException context.details. Ordinary errors below HTTP 500 may expose arrays, objects or scalars; null and unsupported values are omitted. Ordinary HTTP 5xx errors omit details. The exact codes DEPENDENCY_UNAVAILABLE, DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION and DEPENDENCY_FAILED, or context.api_response.dependency_details=true, expose only a nonempty list of DependencyErrorDetail entries, including for HTTP 500/503. Invalid entries and extra fields are removed; details is omitted if none remain. context.api_response.debug=false suppresses ordinary details, but still permits filtered dependency details when dependency handling applies. Validation errors conventionally use a list of ValidationErrorItem entries.
          anyOf:
            - type: array
              description: Validation errors or filtered dependency identifiers.
              items:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorItem'
                  - $ref: '#/components/schemas/DependencyErrorDetail'
            - type: array
              description: Other exception-defined lists may contain arbitrary JSON values.
              items: {}
            - type: object
              additionalProperties: true
            - type: string
            - type: number
            - type: boolean
      required:
        - code
        - message
    DependencyErrorDetail:
      type: object
      additionalProperties: false
      description: Public identifiers supplied by the consumer adapter; never an upstream payload. Only valid source/operation pairs from the context.details list are retained.
      properties:
        source:
          type: string
          pattern: ^[a-z][A-Za-z0-9]{0,63}(?![\s\S])
          maxLength: 64
          example: billing
        operation:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9]{0,127}\.[A-Za-z][A-Za-z0-9]{0,127}(?![\s\S])
          maxLength: 257
          example: billingEnforcementService.checkExecutionStart
      required:
        - source
        - operation
    StandardErrorResponse:
      type: object
      description: Canonical error envelope emitted by ErrorResponder. AbstractHttpException controls its error code, public message, HTTP status and headers. The four dependency error codes listed in ErrorDetails, context.api_response.dependency_details=true, or context.api_response.debug=false suppress debug metadata, exception paths, line numbers and traces regardless of config.debug. Previous exceptions and the presentation declarations are not serialized by ErrorResponder. Routes explicitly configured with options.api_response.raw=true use their protocol error payload instead of this envelope. The existing App.error helper constructs this envelope directly and does not apply ErrorResponder's exception privacy rules.
      properties:
        status:
          type: string
          enum:
            - error
          description: Fixed error marker.
        error:
          $ref: '#/components/schemas/ErrorDetails'
        debug:
          type: object
          nullable: true
          description: System metrics and exception file/line/trace when config.debug is true, unless suppressed by ErrorResponder's dependency or privacy rules. App.error adds system metrics only.
      required:
        - status
        - error
    PaginationMeta:
      type: object
      description: Pagination metadata returned by the paginationHelper.buildMeta(total, limit, offset) port. Total and offset are normalized to at least zero, and limit to at least one. Conversion from page/per_page is available separately through fromPageParams(), which clamps per_page to 1..100.
      properties:
        total:
          type: integer
          minimum: 0
          description: Total number of items across all pages.
        limit:
          type: integer
          minimum: 1
          description: Page size; buildMeta does not impose an upper bound.
        offset:
          type: integer
          minimum: 0
          description: Number of items skipped (zero-based).
        has_more:
          type: boolean
          description: Whether offset + limit is less than total.
      required:
        - total
        - limit
        - offset
        - has_more
