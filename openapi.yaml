openapi: 3.0.3
info:
  title: SynthStack Backend API
  version: v2.23.0+21709
  contact:
    name: SynthStack
    url: https://synthstack.ai
  description: |
    SynthStack Backend API, assembled from module-level OpenAPI fragments.
    Edit openapi.template.yml for shared metadata and apps/*/openapi.paths.yml
    for endpoint contracts, then rebuild the published JSON specifications.
servers:
  - url: https://api.synthstack.ai/v2
    description: Production environment
security:
  - bearerAuth: []
