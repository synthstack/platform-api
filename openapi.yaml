    IntegrationTestResponseData:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IntegrationId'
        status:
          $ref: '#/components/schemas/IntegrationTestStatus'
        message:
          type: string
        backend:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
          description: Optional provider version; a non-string, non-null active probe value is a dependency contract violation.
        token_mode:
          type: string
          nullable: true
          enum:
            - full
            - repository_scoped
        user:
          type: object
          nullable: true
          description: Forgejo provider user object or null; lists and scalars are rejected before recording an active probe. `id` is not a SynthStack encoded ID.
          additionalProperties: true
        tested_at:
          type: string
        diagnostics:
          type: object
          nullable: true
          description: |
            Provider diagnostics for a successful connection probe. Values in this subtree preserve provider identifiers (not SynthStack encoded IDs). For a negative probe diagnostics is null, including when the backend returns diagnostics.exception with status error. This negative result records the failed probe and revokes active tokens. With status active, diagnostics.exception is rejected with DEPENDENCY_CONTRACT_VIOLATION before changing integration state. Backend diagnostics must be null, an empty array or a map with string keys; nonempty lists and numeric keys are invalid. If present, exception must be a string or null. Malformed diagnostics returns 500 before recording either an active or an error result.
          additionalProperties: true
      required:
