            - sort_order
      required:
        - id
        - model_id
        - display_name
        - model_params
        - is_active
        - sort_order
        - engine_model
    Agent:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/AgentId'
        name:
          type: string
        display_name:
          type: string
          nullable: true
        engine:
          $ref: '#/components/schemas/AgentEngine'
        engine_config_id:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/EngineConfigId'
            - type: string
              nullable: true
              enum:
                - null
        model:
          type: string
        model_params:
          type: object
          nullable: true
          additionalProperties: true
        engine_prompt_mode:
          type: string
          enum:
