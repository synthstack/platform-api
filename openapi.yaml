  /tenant/activity:
    get:
      tags:
        - Tenant Insights
      summary: List tenant activity
      description: 'Returns the append-only tenant activity projection. History starts when the projection is deployed and is retained for 90 days by default. Requires Bearer authentication and an active tenant context. Owners, admins and platform superadmins have tenant-wide visibility. Members see only rows for explicitly accessible, visible projects; unscoped activity is excluded. The same visibility applies to cursors and summary counts. The route is limited to 60 requests per user per 60 seconds. Rows are ordered by (occurred_at, id) descending (newest first); id breaks ties at the same occurred_at. Bootstrap returns the newest rows; after returns the nearest strictly newer rows and before the nearest strictly older rows. Both cursors are always present on nonempty pages; cursor presence does not imply more data. Continue newer with after=next_cursor or older with before=prev_cursor, using has_more to detect completion in the current request direction at read time. has_more=false does not prevent subsequent polling. Empty pages have null cursors and has_more=false; retain the previous client cursor, or repeat bootstrap if none exists. With unchanged accessible records, filters and time boundaries, traversal covers all matching rows without gaps or duplicates. Newer and older refer to (occurred_at, id) order, not insertion order. The projection is populated asynchronously using the source activity time: late arrivals behind a passed cursor are not guaranteed to be found by after traversal. There is no cross-request snapshot.'
      operationId: tenantActivityList
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          description: all includes every status; success selects success and error selects failed. Does not filter summary counts.
          schema:
            type: string
            enum:
              - all
              - success
              - error
            default: all
        - name: per_page
          in: query
          description: Page size; defaults to 20 when omitted or empty. HTTP values outside 1–100 return 422 with the default configuration.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: Encoded activity cursor for the nearest strictly newer rows by (occurred_at, id). Mutually exclusive with before.
          schema:
            $ref: '#/components/schemas/TenantActivityItemId'
        - name: before
          in: query
          description: Encoded activity cursor for the nearest strictly older rows by (occurred_at, id). Mutually exclusive with after.
          schema:
            $ref: '#/components/schemas/TenantActivityItemId'
        - name: since
          in: query
          description: Inclusive ISO 8601 lower bound with a timezone. Defaults to now minus activity_feed.retention_days (90 days); older values are clamped to that retention boundary. Fractional seconds are normalized to the next stored second.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Tenant activity page
          headers:
            X-RateLimit-Limit:
              description: Configured requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantActivityListResponseData'
                      meta:
                        $ref: '#/components/schemas/TenantActivityMeta'
        '401':
          description: Missing or invalid Bearer authentication (UNAUTHORIZED or INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Active tenant context required (TENANT_REQUIRED, TENANT_INACTIVE or FORBIDDEN for a membership/token mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR for invalid filter, per_page or since; simultaneous after and before; malformed or wrong-entity cursors; or a cursor that is missing, pruned, from another tenant, or outside the caller's project visibility. Cursor errors identify the after or before field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: RATE_LIMIT_EXCEEDED; more than 60 requests per user on this route in 60 seconds.
          headers:
            Retry-After:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid result or undocumented owner 4xx), or DEPENDENCY_FAILED (other owner failure). Project visibility uses source tenant, operation tenantService.getMemberRole. No feed or summary is returned after an access lookup failure. Public details contain only source and operation; no upstream payload or debug metadata is returned for these dependency errors. INTERNAL_ERROR also covers unwrapped ID encoding LogicException or Error failures; RATE_LIMIT_CONFIGURATION_ERROR indicates invalid limiter configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '502':
          description: UPSTREAM_UNAVAILABLE from idEncode. Cursor decoding port failures, including configuration errors and malformed responses, fail before feed or summary reads. Other ID encoding exceptions also map to this status, except LogicException and Error, which propagate. The local exception context identifies source idEncode without including the upstream payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: RATE_LIMIT_UNAVAILABLE, or DEPENDENCY_UNAVAILABLE from project visibility checks (source tenant, operation tenantService.getMemberRole). No partial feed or summary is returned. Public details contain only source and operation; no upstream payload or debug metadata is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /tenant/metrics:
    get:
      tags:
        - Tenant Insights
      summary: Get tenant time-series metrics
      description: Requires an active tenant and an owner/admin role or platform superadmin status. Limited to 60 requests per user per 60 seconds. Sources use the half-open range [from, to) with from earlier than to. The end is capped at now; the source start is capped at tenant creation. Range limits default to 7 days for hour and 400 days for day. An oversized elapsed request is rejected before tenant lookup, after clipping its future tail, and limits are checked again after creation-time clamping. Fractional bounds are normalized against second-precision storage; response from/to values are serialized to whole UTC seconds. Points cover every intersecting UTC bucket. Missing buckets use zero for compute hours/completed counts and null for success rate. Entirely pre-creation or future ranges return no points and equal response boundaries.
      operationId: tenantMetricsSeries
      security:
        - bearerAuth: []
      parameters:
        - name: metric
          in: query
          required: true
          description: Compute hours consumed, number of completed executions, or completed / (completed + failed) executions as a percentage.
          schema:
            $ref: '#/components/schemas/TenantMetricName'
        - name: from
          in: query
          required: true
          description: Inclusive lower bound of the half-open range; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Exclusive upper bound of the half-open range; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: interval
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TenantMetricInterval'
        - name: project_id
          in: query
          description: Optional encoded project filter supported only for compute_hours.consumed; echoed in that response only when supplied. Filtering stays within the current tenant's billing ledger. A valid ID with no matching entries produces zero-filled buckets. Other metrics reject the filter with 422.
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '200':
          description: UTC time series with zero-filled counts/compute hours and null success rates for empty buckets.
          headers:
            X-RateLimit-Limit:
              description: Configured requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantMetricSeriesResponseData'
        '401':
          description: Missing or invalid Bearer authentication (UNAUTHORIZED or INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: TENANT_REQUIRED, TENANT_INACTIVE or FORBIDDEN; an active tenant and owner/admin role or platform superadmin status are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: NOT_FOUND; the encoded project identifier is malformed or belongs to another entity type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR for missing/unsupported metric or interval, invalid timestamps or range order/length, an unsupported project filter, or source validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: RATE_LIMIT_EXCEEDED; more than 60 requests per user on this route in 60 seconds.
          headers:
            Retry-After:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: INTERNAL_ERROR for unwrapped source LogicException or Error failures, or RATE_LIMIT_CONFIGURATION_ERROR for invalid limiter configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '502':
          description: UPSTREAM_UNAVAILABLE; tasks, billing or tenant context lookup failed, or tenant context returned an invalid creation time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Rate limiting is unavailable (RATE_LIMIT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /tenant/metrics/tasks-by-agent:
    get:
      tags:
        - Tenant Insights
      summary: Get completed and failed executions by agent
      description: Requires an active tenant and an owner/admin role or platform superadmin status. Limited to 60 requests per user per 60 seconds. Uses a half-open range [from, to), with from earlier than to, clamped to tenant creation and now. Fractional bounds are normalized against second-precision storage. The maximum elapsed range defaults to 400 days, checked before tenant lookup after clipping a future tail, and again after creation-time clamping. Entirely pre-creation or future ranges return total=0 and items=[]. Only executions attributable to an agent contribute; total is calculated before applying limit. No project filter is supported.
      operationId: tenantMetricsTasksByAgent
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive lower bound; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Exclusive upper bound; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum returned agents; defaults to 10 when omitted or empty. HTTP values outside 1–50 return 422 with the default configuration.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Execution aggregates ordered by completed plus failed descending, name ascending (case-insensitive, then exact spelling), and internal agent ID ascending.
          headers:
            X-RateLimit-Limit:
              description: Configured requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantTasksByAgentResponseData'
        '401':
          description: Missing or invalid Bearer authentication (UNAUTHORIZED or INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: TENANT_REQUIRED, TENANT_INACTIVE or FORBIDDEN; an active tenant and owner/admin role or platform superadmin status are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR for invalid/missing timestamps, invalid range order/length, limit outside the configured range, or source validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: RATE_LIMIT_EXCEEDED; more than 60 requests per user on this route in 60 seconds.
          headers:
            Retry-After:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: INTERNAL_ERROR for unwrapped source LogicException or Error failures, or RATE_LIMIT_CONFIGURATION_ERROR for invalid limiter configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '502':
          description: UPSTREAM_UNAVAILABLE; tasks, agent directory or tenant context lookup failed, or tenant context returned an invalid creation time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Rate limiting is unavailable (RATE_LIMIT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountSettingsSttEngine:
      type: string
      description: User-selected speech-to-text engine for the UI. The enum describes the shipped audio.allowed_stt_engines configuration (browser,openai). Keep this enum in sync with deployment-specific allowlist changes.
      enum:
        - browser
        - openai
      example: browser
    AccountSettingsAudioSettings:
      type: object
      description: Audio-related account settings.
      additionalProperties: false
      properties:
        stt_engine:
          $ref: '#/components/schemas/AccountSettingsSttEngine'
      required:
        - stt_engine
    AccountSettingsNotificationCategories:
      type: object
      description: Category delivery switches. Keys are open snake_case identifiers matching ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$. With the shipped defaults, task, agent, pr, sync and integration are enabled.
      additionalProperties:
        type: boolean
    AccountSettingsNotificationTypes:
      type: object
      description: Effective per-type switches, including defaults and stored overrides. Keys are open snake_case identifiers matching ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$. The notifications module gives these switches precedence over categories. The shipped default for sync_completed is false.
      additionalProperties:
        type: boolean
    AccountSettingsNotificationDelivery:
      type: object
      description: Effective notification delivery switches for clients.
      additionalProperties: false
      properties:
        toasts:
          type: boolean
          description: Whether to show notification toasts; defaults to true.
        high_priority_sound:
          type: boolean
          description: Whether to play a sound for high-priority notifications; defaults to false.
      required:
        - toasts
        - high_priority_sound
    AccountSettingsNotificationSettings:
      type: object
      additionalProperties: false
      properties:
        categories:
          $ref: '#/components/schemas/AccountSettingsNotificationCategories'
        types:
          $ref: '#/components/schemas/AccountSettingsNotificationTypes'
        delivery:
          $ref: '#/components/schemas/AccountSettingsNotificationDelivery'
      required:
        - categories
        - types
        - delivery
    AccountSettingsResponseData:
      type: object
      description: Effective account settings merged with module defaults on every read. This schema describes the shipped defaults. Settings are scoped to the user across tenants. Language preferences are managed by auth and are not included here.
      additionalProperties: false
      properties:
        audio:
          $ref: '#/components/schemas/AccountSettingsAudioSettings'
        notifications:
          $ref: '#/components/schemas/AccountSettingsNotificationSettings'
      required:
        - audio
        - notifications
      example:
        audio:
          stt_engine: browser
        notifications:
          categories:
            task: true
            agent: true
            pr: true
            sync: true
            integration: true
          types:
            sync_completed: false
          delivery:
            toasts: true
            high_priority_sound: false
    AccountSettingsSttEnginePatch:
      type: string
      nullable: true
      description: STT engine override, validated against audio.allowed_stt_engines. The enum describes the shipped allowlist. Null removes the override and restores the module default; an explicit value remains stored even if it equals the current default.
      enum:
        - browser
        - openai
        - null
    AccountSettingsAudioSettingsPatch:
      type: object
      nullable: true
      description: Partial audio settings patch. Null removes all audio overrides.
      additionalProperties: false
      properties:
        stt_engine:
          $ref: '#/components/schemas/AccountSettingsSttEnginePatch'
    AccountSettingsNotificationCategoriesPatch:
      type: object
      nullable: true
      description: Category override patch. Keys must match ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$. Null removes the branch; null property values remove individual overrides. Keys without a configured default disappear after removal.
      additionalProperties:
        type: boolean
        nullable: true
    AccountSettingsNotificationTypesPatch:
      type: object
      nullable: true
      description: Notification type override patch. Keys must match ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$. Null removes the branch; null property values remove individual overrides. Keys without a configured default disappear after removal.
      additionalProperties:
        type: boolean
        nullable: true
    AccountSettingsNotificationDeliveryPatch:
      type: object
      nullable: true
      description: Delivery override patch. Null removes all delivery overrides.
      additionalProperties: false
      properties:
        toasts:
          type: boolean
          nullable: true
        high_priority_sound:
          type: boolean
          nullable: true
    AccountSettingsNotificationSettingsPatch:
      type: object
      nullable: true
      description: Partial notification settings patch. Null removes all notification overrides.
      additionalProperties: false
      properties:
        categories:
          $ref: '#/components/schemas/AccountSettingsNotificationCategoriesPatch'
        types:
          $ref: '#/components/schemas/AccountSettingsNotificationTypesPatch'
        delivery:
          $ref: '#/components/schemas/AccountSettingsNotificationDeliveryPatch'
    AccountSettingsUpdateRequestBody:
      type: object
      description: Object-shaped JSON Merge Patch (RFC 7386) for stored account setting overrides. Omitted fields and empty objects leave overrides unchanged; an empty top-level object performs no write. Null removes an override at a leaf, branch or namespace, exposing the current default if present. Unknown fixed fields and namespaces, including locale, are rejected even when null. Boolean switches do not accept strings or numbers. JSON arrays, including empty arrays, are rejected at the body, audio, notifications, notifications.categories, notifications.types and notifications.delivery object positions with 422 VALIDATION_ERROR. An empty request body is equivalent to an empty top-level object and performs no write. Malformed JSON is rejected with a body validation error.
      additionalProperties: false
      properties:
        audio:
          $ref: '#/components/schemas/AccountSettingsAudioSettingsPatch'
        notifications:
          $ref: '#/components/schemas/AccountSettingsNotificationSettingsPatch'
    AgentServiceDeclarationId:
      type: string
      description: Agent service declaration identifier (prefix "asd")
      pattern: ^asd_[a-zA-Z0-9]{6,}$
      example: asd_aB3xYz
    AgentServiceAlias:
      type: string
      minLength: 1
      maxLength: 63
      description: DNS label; full-string PCRE \A[a-z]([a-z0-9-]{0,61}[a-z0-9])?\z. Unique within the scope, regardless of catalog entry.
      example: mysql
    AgentServiceEnvRow:
      type: object
      required:
        - id
        - key
        - value
        - is_secret
        - is_generated
        - template_key
        - is_renamed
      properties:
        id:
          $ref: '#/components/schemas/EnvVarId'
        key:
          type: string
          maxLength: 255
          description: Full-string PCRE \A[A-Za-z_][A-Za-z0-9_]*\z; unique in this declaration.
        value:
          type: string
          maxLength: 65535
          description: Secret values are always ***; public values are stored literals.
        is_secret:
          type: boolean
        is_generated:
          type: boolean
          readOnly: true
        template_key:
          type: string
          nullable: true
        is_renamed:
          type: boolean
          readOnly: true
          description: Key differs from the template key name captured at row creation; false for custom rows.
    AgentServiceEnvWriteRow:
      type: object
      description: 'Existing rows match by id belonging to this declaration. A missing or null id creates a new row. Omitted key/value/flags preserve stored values; value *** also preserves the stored value. New custom rows require key and value (is_secret defaults false). New template rows accept template_key and optional key; omitted value applies the server default. New generated rows must omit value and default to is_secret=true regardless of the template flag; existing generated rows accept only omitted value or ***. A new generated row may explicitly set is_secret to false: its fresh server-generated value is public. template_key is immutable for existing rows, even when the template row was removed from the catalog. Making a secret public requires an explicit new value. is_generated, is_renamed and template_origin_key supplied by clients are ignored. Expression syntax ${{ is forbidden in key/value, including defaults.'
      properties:
        id:
          type: string
          nullable: true
          description: Existing env_ ID, or null to create a new row.
          pattern: ^env_[a-zA-Z0-9]{6,}(?![\s\S])
          example: env_aB3xYz
        template_key:
          type: string
          nullable: true
        key:
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 65535
        is_secret:
          type: boolean
    AgentServiceParamsResponse:
      type: object
      required:
        - version
        - use_global_env
        - env_vars
      properties:
        version:
          type: string
        use_global_env:
          type: boolean
          description: Enables global ENV placeholder resolution by the effective-services resolver (MCP parity). CRUD stores literals. A same-name self-reference such as TOKEN=$TOKEN does not import the global TOKEN.
        env_vars:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/AgentServiceEnvRow'
    AgentServiceParamsPatch:
      type: object
      properties:
        version:
          type: string
          description: On creation or an actual change, must be in current supported_versions with a nonempty image. The saved version is not revalidated when omitted or resubmitted unchanged.
        use_global_env:
          type: boolean
          description: Stores the flag without resolving placeholders; same-name self-references do not import global values.
        env_vars:
          type: array
          maxItems: 64
          description: Full replacement by row id; omitted rows are deleted. Omitted env_vars preserves the set on PATCH. On POST omission scaffolds the entire template; [] creates no rows. Restoring a template row without id creates a new id and regenerates generated values. Values referenced by options must match the runtime charset unless they contain a $VAR placeholder; final validation belongs to the resolver/renderer.
          items:
            $ref: '#/components/schemas/AgentServiceEnvWriteRow'
    AgentServiceParamsCreate:
      allOf:
        - $ref: '#/components/schemas/AgentServiceParamsPatch'
        - type: object
          required:
            - version
      description: use_global_env defaults to false. Missing template defaults become empty strings; secret defaults stay secret.
    AgentServiceCatalogSummary:
      type: object
      required:
        - id
        - code
        - name
        - status
      properties:
        id:
          $ref: '#/components/schemas/AgentServiceCatalogEntryId'
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - deprecated
    AgentServiceCatalogContext:
      allOf:
        - $ref: '#/components/schemas/AgentServiceCatalogSummary'
        - type: object
          required:
            - supported_versions
            - env_template
          properties:
            supported_versions:
              type: array
              description: First element is recommended. Available even for deprecated/platform entries. Legacy migrated identifiers may be null and cannot be selected.
              items:
                type: string
                nullable: true
            env_template:
              type: array
              items:
                type: object
                required:
                  - template_key
                  - key
                  - default_value
                  - is_secret
                  - is_generated
                properties:
                  template_key:
                    type: string
                  key:
                    type: string
                  default_value:
                    type: string
                    nullable: true
                    description: Secret defaults are always ***. Omit value on creation to apply the original server default.
                  is_secret:
                    type: boolean
                  is_generated:
                    type: boolean
    AgentServiceDeclarationRelationData:
      type: object
      required:
        - id
        - service_catalog_entry_id
        - alias
        - params
        - created_at
        - updated_at
        - agent_id
      properties:
        id:
          $ref: '#/components/schemas/AgentServiceDeclarationId'
        service_catalog_entry_id:
          $ref: '#/components/schemas/AgentServiceCatalogEntryId'
        alias:
          $ref: '#/components/schemas/AgentServiceAlias'
        params:
          $ref: '#/components/schemas/AgentServiceParamsResponse'
        created_at:
          type: string
        updated_at:
          type: string
        agent_id:
          $ref: '#/components/schemas/AgentId'
    AgentServiceDeclarationAddRequestBody:
      type: object
      required:
        - service_catalog_entry_id
        - alias
        - params
      properties:
        service_catalog_entry_id:
          $ref: '#/components/schemas/AgentServiceCatalogEntryId'
        alias:
          $ref: '#/components/schemas/AgentServiceAlias'
        params:
          $ref: '#/components/schemas/AgentServiceParamsCreate'
    AgentServiceDeclarationUpdateRequestBody:
      type: object
      description: All fields optional. Catalog entry binding cannot change; the saved ID may be submitted again.
      properties:
        service_catalog_entry_id:
          $ref: '#/components/schemas/AgentServiceCatalogEntryId'
        alias:
          $ref: '#/components/schemas/AgentServiceAlias'
        params:
          $ref: '#/components/schemas/AgentServiceParamsPatch'
    AgentServiceCatalogEntryId:
      type: string
      pattern: ^svc_[a-zA-Z0-9]{6,}$
      example: svc_aB3xYz
    AgentServiceDeclarationDetail:
      allOf:
        - $ref: '#/components/schemas/AgentServiceDeclarationRelationData'
        - type: object
