    AiAssistTextAction:
      type: string
      description: Supported AI text rewrite action.
      enum:
        - shorten
        - elaborate
        - improve_writing
        - fix_spelling_grammar
        - simplify
        - summarize
        - custom
      example: improve_writing
    AiAssistTranscriptionRequestBody:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: Audio file to transcribe. Supported formats are mp3, mp4, mpeg, mpga, m4a, wav, and webm.
        language:
          type: string
          pattern: ^[a-zA-Z]{2}$
          description: Optional ISO-639-1 language hint.
          example: en
      required:
        - file
    AiAssistQueuedResponseData:
      type: object
      description: Accepted asynchronous AI job.
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^aij_[a-f0-9]{32}$
          description: Opaque correlation id used by subsequent realtime events. It is not an encoded database id.
          example: aij_9f3ca7c1e8b24d55a01f6c7d8e9012ab
        status:
          type: string
          enum:
            - queued
          example: queued
        message:
          type: string
          example: Transcription queued
      required:
        - id
        - status
        - message
    AiAssistTextRewriteRequestBody:
      type: object
      description: AI rewrite request for Markdown text. `custom_prompt` is required and must be non-empty when `action` is `custom`.
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          description: Source Markdown text to edit.
          example: Please **fix** this message.
        action:
          $ref: '#/components/schemas/AiAssistTextAction'
        custom_prompt:
          type: string
          maxLength: 1000
          description: Free-form edit instruction for the `custom` action. Ignored for preset actions.
          example: Make it friendlier
      required:
        - text
        - action
    StandardResponse:
      type: object
      description: Canonical success envelope emitted by backend services.
      properties:
        status:
          type: string
          enum:
            - success
          description: Fixed success marker.
        data:
          description: Business payload, structure varies per endpoint.
        meta:
          type: object
          nullable: true
          description: Optional metadata (pagination, timestamps, etc.).
        debug:
          type: object
          nullable: true
          description: Debug extras when `debug=true` is supplied.
      required:
        - status
    ErrorDetails:
      type: object
      description: Error details structure used in error responses.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message.
          example: Validation failed
        details:
          description: Additional error details. DEPENDENCY_UNAVAILABLE, DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION and DEPENDENCY_FAILED expose only source/operation entries from the consumer's context.details, including for HTTP 500/503. Invalid entries and all other context fields are omitted.
          anyOf:
            - oneOf:
                - type: array
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/ValidationErrorItem'
                      - $ref: '#/components/schemas/DependencyErrorDetail'
                - type: object
                  additionalProperties: true
            - type: string
              nullable: true
              enum:
                - null
      required:
        - code
        - message
    DependencyErrorDetail:
      type: object
      additionalProperties: false
      description: Public identifiers supplied by the consumer adapter; never an upstream payload.
      properties:
        source:
          type: string
          pattern: ^[a-z][A-Za-z0-9]{0,63}(?![\s\S])
          maxLength: 64
          example: billing
        operation:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9]{0,127}\.[A-Za-z][A-Za-z0-9]{0,127}(?![\s\S])
          maxLength: 257
          example: billingEnforcementService.checkExecutionStart
      required:
        - source
        - operation
    StandardErrorResponse:
      type: object
      description: Canonical error envelope emitted by backend services. The four dependency error codes never include debug metadata, exception paths, line numbers, traces or previous exceptions, regardless of the debug setting. Routes explicitly configured for raw protocols, such as OAuth token, UserInfo and discovery endpoints, use their documented protocol error payload instead of this envelope.
      properties:
        status:
          type: string
          enum:
            - error
          description: Fixed error marker.
        error:
          $ref: '#/components/schemas/ErrorDetails'
        debug:
          type: object
          nullable: true
          description: Debug extras when enabled; always absent for the four dependency error codes.
      required:
        - status
        - error
    PaginationMeta:
      type: object
      description: Standard pagination metadata used across paginated list endpoints.
      properties:
        total:
          type: integer
          description: Total number of items across all pages.
        limit:
          type: integer
          description: Number of items per page (per_page value).
        offset:
          type: integer
          description: Number of items skipped (zero-based).
        has_more:
          type: boolean
          description: Whether there are more items beyond the current page.
      required:
        - total
        - limit
        - offset
        - has_more
    ApiKeyId:
      type: string
      description: Tenant API key identifier (prefix "ak")
      pattern: ^ak_[a-zA-Z0-9]{6,}$
      example: ak_aB3xYz
    PasskeyId:
      type: string
      description: Passkey record identifier (prefix "pk")
      pattern: ^pk_[a-zA-Z0-9]{6,}$
      example: pk_aB3xYz
    WebAuthnCredentialDescriptor:
