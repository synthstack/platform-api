        type:
          type: string
          enum:
            - public-key
        transports:
          type: array
          items:
            type: string
            enum:
              - usb
              - nfc
              - ble
              - hybrid
              - internal
      required:
        - id
        - type
    PasskeyCreationOptions:
      type: object
