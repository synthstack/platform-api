          explode: true
          description: Array only, e.g. ids[]=itr_...&ids[]=itr_...; CSV is unsupported. Ordinary filter combined with page/per_page; total counts matching rows of this task only. Valid unknown IDs and IDs belonging to another task are silently skipped; duplicates are deduplicated. Invalid format or wrong entity returns 404 NOT_FOUND; over 100 elements or empty elements return 422 VALIDATION_ERROR. Results with ids[] are ordered by ascending internal ID. Unfiltered listing retains descending sequence order.
          schema:
