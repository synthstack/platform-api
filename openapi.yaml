  /services/catalog:
    get:
      summary: List active service catalog entries
      description: 'Global authenticated catalog: active + public for ordinary users; superadmins receive active entries of any visibility. Sorted by code, with the same search and pagination rules for both modes. Secret defaults are masked; visibility is included only for superadmins. Infrastructure fields are omitted. Tenant context is optional, but an existing inactive tenant or a token/membership mismatch can return 403.'
      operationId: serviceCatalogList
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Cast to an integer and clamped to at least 1; out-of-range values are normalized.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Cast to an integer and clamped to 1-100; out-of-range values are normalized.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: At most 128 bytes before trimming. Case-insensitive literal substring in code or name; blank means no filter. Percent signs and underscores are literal. Invalid input returns 422 at /search.
      responses:
        '200':
          description: Active service catalog entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceCatalogListResponseData'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: UNAUTHORIZED for a missing/malformed Bearer header; INVALID_TOKEN for an invalid or expired token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: TENANT_INACTIVE for an inactive tenant; FORBIDDEN for a token/membership mismatch when the caller is not a superadmin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR; error.details[{field,message}] with field /search for invalid search input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Services
