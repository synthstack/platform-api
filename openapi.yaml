    DiscoveredDataSource:
      type: object
      description: Validated provider descriptor. Optional display_name and metadata are returned only when supplied by the backend; provider-specific fields are preserved.
      properties:
        kind:
          $ref: '#/components/schemas/DataSourceKind'
