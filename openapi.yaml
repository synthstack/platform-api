    TaskWorkflowStatus:
      type: string
      description: Workflow status of a task (`tasks.workflow_status`). This is the only task-status dimension for task UI. `ready_to_publish` means the iteration ended with an outcome accepted as successful by the system. It confirms neither the presence, review, finality nor publication of any type of result. `review` is not part of this enum.
      enum:
        - draft
        - queued
        - claimed
        - running
        - ready_to_publish
        - published
        - failed
        - cancel_requested
        - cancelled
    TaskExecutionStatus:
      type: string
      description: Status of one task execution (`task_executions.status`). Execution values such as `pending` and `completed` are not task workflow statuses and must not be used to override `tasks.workflow_status`.
      enum:
        - pending
        - queued
        - claimed
        - running
        - completed
        - failed
        - cancel_requested
        - cancelled
    TaskIterationStatus:
      type: string
      description: Status of one task iteration (`task_iterations.status`). An iteration is created in `queued` and can only transition to the terminal `completed`, `failed`, or `cancelled` states. Iterations have no intermediate in-progress status; clients must use execution status or `tasks.workflow_status` for claimed/running UI state.
      enum:
        - queued
        - completed
        - failed
        - cancelled
    TaskIterationTrigger:
      type: string
      enum:
