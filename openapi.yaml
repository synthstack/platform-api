  /tasks/entries/{id}/reopen:
    post:
      tags:
        - Tasks
      summary: Reopen task
      description: 'Reactivation is serialized with retention for every saved Git resource. `409 GIT_RETENTION_RESOURCE_BUSY` returns `Retry-After: 1`. `409 GIT_RETENTION_CLEANUP_UNRESOLVED` returns `Retry-After: 1` for pending cleanup or `Retry-After: 60` for ambiguous cleanup requiring operator reconciliation; details identify `blocking_target_id` and `blocking_pin_id`. This fence lasts until confirmed cleanup closure, including after a lost DELETE response; elapsed time alone does not clear it. `503 GIT_RETENTION_LOCK_LOST` means the original database session/resource lock was lost; it returns `Retry-After: 1`. Retry the complete reopen request after the indicated delay. Lifecycle, activity and outbox writes share the original transaction and are never replayed individually on a replacement connection. A connection-loss error alone does not prove whether an in-flight commit took effect.'
      operationId: taskReopen
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: Task reopened.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskActionResponseData'
        '401':
          $ref: '#/components/responses/TasksUnauthorized'
        '403':
          $ref: '#/components/responses/TasksForbidden'
        '404':
          $ref: '#/components/responses/TasksNotFound'
        '409':
          $ref: '#/components/responses/TasksGitRetentionConflict'
        '500':
          $ref: '#/components/responses/TasksProjectDependencyError'
        '503':
          description: 'GIT_RETENTION_LOCK_LOST: original database session/resource lock lost; retry the complete reopen request after Retry-After: 1. Also DEPENDENCY_UNAVAILABLE for required project resolution through projectService.get or project access. Dependency details[].source/operation use projects and projectService.get or the invoked projectService access method; no upstream payload or debug metadata is returned.'
          headers:
            Retry-After:
              description: Retry delay in seconds for GIT_RETENTION_LOCK_LOST.
              schema:
                type: integer
                enum:
                  - 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
