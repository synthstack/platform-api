paths:
  /account/settings:
    get:
      summary: Get account settings
      description: Return the authenticated user's effective audio and notification settings merged with current defaults. Does not create a database row when only defaults exist. No path or query parameters are used. Tenant membership is optional; a resolved tenant must be active and its membership must match the token tenant for a non-superadmin user.
      operationId: accountSettingsGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective account settings document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountSettingsResponseData'
        '401':
          description: Missing or malformed Authorization header (UNAUTHORIZED), or invalid/expired token or ID claims (INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Token tenant does not match current membership for a non-superadmin user (FORBIDDEN), or the resolved tenant is inactive (TENANT_INACTIVE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: idEncode port configuration, response contract or invocation failed during token verification (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: idEncode token claim processing is temporarily unavailable (DEPENDENCY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Account Settings
    patch:
      summary: Update account settings
      description: Apply an object-shaped JSON Merge Patch (RFC 7386) to the authenticated user's audio and notification overrides, then return the full effective document. Only overrides are stored. Null removes overrides rather than persisting a null value. A non-empty patch creates a settings row if needed, including when it only resets missing overrides. An empty body or empty top-level object reads settings without writing. There are no path or query parameters. Settings are shared across the user's tenants; optional tenant resolution has the same checks as GET.
      operationId: accountSettingsUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSettingsUpdateRequestBody'
            example:
              notifications:
                types:
                  sync_completed: null
                delivery:
                  toasts: null
      responses:
        '200':
          description: Updated effective account settings document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountSettingsResponseData'
        '401':
          description: Missing or malformed Authorization header (UNAUTHORIZED), or invalid/expired token or ID claims (INVALID_TOKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Token tenant does not match current membership for a non-superadmin user (FORBIDDEN), or the resolved tenant is inactive (TENANT_INACTIVE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Malformed JSON or invalid body shape (including arrays at any object position), unknown namespace/field, unsupported STT engine, invalid map key or non-boolean switch (VALIDATION_ERROR). Details are field/message entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
              example:
                status: error
                error:
                  code: VALIDATION_ERROR
                  message: Validation failed
                  details:
                    - field: audio.stt_engine
                      message: Unsupported STT engine
        '500':
          description: idEncode port configuration, response contract or invocation failed during token verification (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: idEncode token claim processing is temporarily unavailable (DEPENDENCY_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Account Settings
  /agents/{agentId}/services:
    get:
      summary: List agent owner service declarations
      description: 'All operations, including GET, require requireTenantAgent and assertCanMutateBaseScope: owner/admin/superadmin with an editable connection, or the member who created the editable agent. Non-superadmins also require is_gov=true. Marketplace consumers cannot read this layer. Only superadmins can create declarations from platform catalog entries. Existing declarations remain readable, editable and removable after catalog deprecation or public-to-platform changes. Secret row values and template defaults are masked as ***. No runtime resolution is performed. Stable order: created_at DESC, id DESC. No server search or custom sorting.'
      operationId: agentServiceList
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
            maximum: 100
      responses:
        '200':
          description: Masked declaration page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentServiceDeclarationListItem'
                      meta:
                        type: object
                        required:
                          - total
                          - limit
                          - offset
                          - has_more
                        properties:
                          total:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer
                          has_more:
                            type: boolean
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentBaseScopeMutationForbidden'
        '404':
          $ref: '#/components/responses/AgentServiceNotFound'
        '422':
          $ref: '#/components/responses/AgentServiceInvalid'
        '500':
          $ref: '#/components/responses/AgentServiceDependencyFailure'
      tags:
        - Agent
    post:
      summary: Create agent owner service declaration
      description: 'All operations, including GET, require requireTenantAgent and assertCanMutateBaseScope: owner/admin/superadmin with an editable connection, or the member who created the editable agent. Non-superadmins also require is_gov=true. Marketplace consumers cannot read this layer. Only superadmins can create declarations from platform catalog entries. Existing declarations remain readable, editable and removable after catalog deprecation or public-to-platform changes. Secret row values and template defaults are masked as ***. No runtime resolution is performed.'
      operationId: agentServiceCreate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentServiceDeclarationAddRequestBody'
      responses:
        '201':
          description: Masked declaration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentServiceDeclarationDetail'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentBaseScopeMutationForbidden'
        '404':
          $ref: '#/components/responses/AgentServiceNotFound'
        '409':
          $ref: '#/components/responses/AgentServiceConflict'
        '422':
          $ref: '#/components/responses/AgentServiceInvalid'
        '500':
          $ref: '#/components/responses/AgentServiceDependencyFailure'
      tags:
        - Agent
