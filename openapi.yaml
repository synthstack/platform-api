    TaskCommentCreateRequestBody:
      type: object
      description: 'When the comment creates an iteration, source_execution_id optionally selects the implementation whose branch the invoked agents should use. Nonempty input_artifact_ids require create_iteration: true and an Idempotency-Key header. Empty input_artifact_ids are equivalent to omitting the field. Idempotency-Key applies to every comment, regardless of the normalized create_iteration flag, in a task-wide key space shared with direct iterations.'
      properties:
        body:
          type: string
          maxLength: 1000000
        create_iteration:
          type: boolean
          default: false
          description: Whether to create an iteration. Legacy values 1, "1" and "true" normalize to true; 0, "0", "false" and null normalize to false before validation of input artifacts, Idempotency-Key and request fingerprinting.
        iteration_executors:
          type: array
          items:
            $ref: '#/components/schemas/AgentId'
        source_execution_id:
          $ref: '#/components/schemas/TaskExecutionId'
        input_artifact_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          description: Unique encoded input IDs. With TASK_EXECUTION_INPUT_CROSS_TASK_ENABLED=true, accepts artifacts of any live task/project in the same tenant accessible through source-project canAccess(); otherwise accepts only this task. Selection intentionally transfers the pinned revision to target-project executors and its contents may be visible to target participants without source access. Allowed kinds are file, report, preview, diff, attachment (immutable stored revisions) and external_link (URL only). Inaccessible/foreign-tenant/missing/deleted sources return 404 NOT_FOUND; unsupported kind returns 422 INPUT_ARTIFACT_NOT_AVAILABLE (reason=unsupported_kind); missing immutable revision returns 409 ARTIFACT_NOT_FINALIZED. Source ACL revocation or disabling the flag does not revoke accepted grants. Replay reuses the accepted decision without new grants and still requires target access. derived_from, publications and source_execution_id remain same-task. Nonempty inputs require create_iteration=true. This does not add inputs to a running execution.
          items:
            $ref: '#/components/schemas/TaskArtifactId'
      required:
        - body
    TaskIterationCreateRequestBody:
      type: object
      description: Explicit input selection is a set. Requires Idempotency-Key when nonempty. Replay precedes input/executor revalidation and returns the accepted iteration and execution_ids. New retry iterations do not inherit inputs.
      properties:
        trigger_type:
          $ref: '#/components/schemas/TaskManualIterationTrigger'
        executor_agent_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AgentId'
        reason:
          type: string
          nullable: true
          maxLength: 2000
        source_execution_id:
          $ref: '#/components/schemas/TaskExecutionId'
        input_artifact_ids:
          description: Unique encoded input IDs. With TASK_EXECUTION_INPUT_CROSS_TASK_ENABLED=true, accepts artifacts of any live task/project in the same tenant accessible through source-project canAccess(); otherwise accepts only this task. Selection intentionally transfers the pinned revision to target-project executors and its contents may be visible to target participants without source access. Allowed kinds are file, report, preview, diff, attachment (immutable stored revisions) and external_link (URL only). Inaccessible/foreign-tenant/missing/deleted sources return 404 NOT_FOUND; unsupported kind returns 422 INPUT_ARTIFACT_NOT_AVAILABLE (reason=unsupported_kind); missing immutable revision returns 409 ARTIFACT_NOT_FINALIZED. Source ACL revocation or disabling the flag does not revoke accepted grants. Replay reuses the accepted decision without new grants and still requires target access. derived_from, publications and source_execution_id remain same-task. Selection applies only to executions of the new iteration.
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskArtifactId'
      required:
        - trigger_type
        - executor_agent_ids
    TaskExecutionCancelRequestBody:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 2000
    TaskPublicationCreateRequestBody:
      oneOf:
        - $ref: '#/components/schemas/TaskManualPublicationCreateRequestBody'
        - $ref: '#/components/schemas/TaskCapabilityPublicationCreateRequestBody'
      discriminator:
        propertyName: mode
        mapping:
          manual: '#/components/schemas/TaskManualPublicationCreateRequestBody'
          capability: '#/components/schemas/TaskCapabilityPublicationCreateRequestBody'
    TaskManualPublicationCreateRequestBody:
      type: object
      description: Upload requires exactly one artifact_id or external_url. Other types require a URL and forbid artifact_id. Existing manual URL rules are retained. Upload accepts exactly one of artifact_id or artifact_ids (ordered, 1–100 unique file/report/preview/diff artifacts). A one-element array is equivalent to artifact_id. external_url is mutually exclusive. Set order and composition survive retry, recovery, withdrawal and loss; aggregate provenance is server-derived. attachment is not publishable; selection returns 422 VALIDATION_ERROR with `details[].field=artifact_ids` and `details[].reason=unsupported_kind`.
      properties:
        mode:
          type: string
          enum:
            - manual
          default: manual
        publication_type:
          type: string
          enum:
            - pull_request
            - upload
            - external_link
        source_backend:
          type: string
          maxLength: 64
        artifact_id:
          $ref: '#/components/schemas/TaskArtifactId'
        execution_id:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/TaskExecutionId'
            - type: string
              nullable: true
              enum:
                - null
        external_url:
          type: string
          format: uri
          maxLength: 1000
        external_id:
          type: string
          maxLength: 255
        metadata:
          $ref: '#/components/schemas/TaskObjectMap'
        artifact_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskArtifactId'
          minItems: 1
      required:
        - publication_type
    TaskCapabilityPublicationCreateRequestBody:
      type: object
      additionalProperties: false
      description: System-managed fields are forbidden. PR permits agent_id; upload requires artifact_id and forbids agent_id, execution_id and external_url; external_link requires an absolute HTTPS URL without userinfo and optionally accepts execution_id, agent_id and external_id. Exactly one file may be selected. Idempotency-Key is required for upload/external_link and optional for PR. A PR request without a key reuses the existing decision for the same result, destination and iteration, including failed status, without another dispatch. A new attempt after failure requires a new Idempotency-Key. A repeat with the same key always returns the original record, including failed status. Upload accepts exactly one of artifact_id or artifact_ids (ordered, 1–100 unique file/report/preview/diff artifacts). A one-element array is equivalent to artifact_id. external_url is mutually exclusive. Set order and composition survive retry, recovery, withdrawal and loss; aggregate provenance is server-derived. attachment is not publishable; selection returns 422 VALIDATION_ERROR with `details[].field=artifact_ids` and `details[].reason=unsupported_kind`.
      oneOf:
        - properties:
            publication_type:
              enum:
                - pull_request
          not:
            anyOf:
              - required:
                  - artifact_id
              - required:
                  - execution_id
              - required:
                  - external_url
              - required:
                  - external_id
              - required:
                  - artifact_ids
        - properties:
            publication_type:
              enum:
                - upload
          not:
            anyOf:
              - required:
                  - agent_id
              - required:
                  - execution_id
              - required:
                  - external_url
              - required:
                  - external_id
          oneOf:
            - required:
                - artifact_id
              not:
                required:
                  - artifact_ids
            - required:
                - artifact_ids
              not:
                required:
                  - artifact_id
        - properties:
            publication_type:
              enum:
                - external_link
          required:
            - external_url
          not:
            required:
              - artifact_id
            anyOf:
              - required:
                  - artifact_ids
      properties:
        mode:
          type: string
          enum:
            - capability
        publication_type:
          type: string
          enum:
            - pull_request
            - upload
            - external_link
        agent_id:
          $ref: '#/components/schemas/AgentId'
        execution_id:
          $ref: '#/components/schemas/TaskExecutionId'
        artifact_id:
          $ref: '#/components/schemas/TaskArtifactId'
        external_url:
          type: string
          format: uri
          maxLength: 1000
        external_id:
          type: string
          maxLength: 255
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 65535
        artifact_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskArtifactId'
          minItems: 1
      required:
        - mode
        - publication_type
    TaskPublicationUpdateRequestBody:
      type: object
      properties:
        external_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
          description: Optional replacement URL for a manual URL publication. If supplied, it must be nonempty and cannot be null. Omit this field to retain the current URL.
        external_id:
          type: string
          nullable: true
          maxLength: 255
        status:
