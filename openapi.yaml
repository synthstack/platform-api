        - when
        - if
        - do
        - enabled
        - max_triggers
        - triggers_used
    AutomationResponseData:
      type: object
      properties:
        id:
          description: Null when this task has no saved automation.
          oneOf:
            - $ref: '#/components/schemas/AutomationId'
            - type: string
              nullable: true
              enum:
                - null
        task_id:
          $ref: '#/components/schemas/TaskId'
        enabled:
          type: boolean
        triggers_used:
          type: integer
          minimum: 0
          description: Read-only task budget usage, incremented once per reserved source event regardless of the number of participating rules or targets. Includes in-flight reservations and non-billing business rejections; confirmed billing rejections release the reservation. No public reset is available. The internal task backstop cap is not exposed.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AutomationRuleResponseData'
        created_at:
          type: string
          nullable: true
          description: UTC database timestamp (YYYY-MM-DD HH:mm:ss), or null before automation is saved.
          example: '2026-09-07 12:00:00'
        updated_at:
          type: string
          nullable: true
          description: UTC database timestamp (YYYY-MM-DD HH:mm:ss), or null before automation is saved.
          example: '2026-09-07 12:00:00'
      required:
        - id
        - task_id
        - enabled
        - triggers_used
        - rules
        - created_at
        - updated_at
    AutomationLimits:
      type: object
      properties:
        default_rule_max_triggers:
          type: integer
          minimum: 1
          example: 10
        rule_max_triggers_cap:
          type: integer
          minimum: 1
          example: 100
        max_rules_per_automation:
          type: integer
          minimum: 1
          example: 20
        match_text_max_length:
          type: integer
          minimum: 1
          description: Current text filter length limit; the shared validator counts UTF-8 bytes before trimming.
          example: 500
      required:
        - default_rule_max_triggers
        - rule_max_triggers_cap
        - max_rules_per_automation
        - match_text_max_length
    AutomationResponseMeta:
      type: object
      properties:
        limits:
          $ref: '#/components/schemas/AutomationLimits'
      required:
        - limits
    AutomationRuleRequestBody:
      type: object
      additionalProperties: false
      properties:
        id:
          oneOf:
            - $ref: '#/components/schemas/AutomationRuleId'
            - type: string
              nullable: true
              enum:
                - null
          description: Existing rule ID, unique within the request and belonging to this task. Omitted or null creates a new rule. Existing rules omitted from the replacement set are deleted.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Validated as 1-100 UTF-8 bytes before trimming; the saved value is trimmed.
        when:
          type: object
          additionalProperties: false
          properties:
            agent_id:
              $ref: '#/components/schemas/AgentId'
          required:
            - agent_id
        if:
          type: object
          additionalProperties: false
          properties:
            status:
              $ref: '#/components/schemas/AutomationRuleStatus'
            message_contains:
              type: string
              nullable: true
              description: Optional case-insensitive text filter against the last agent message, falling back to result_summary. Omitted, null or blank values disable this filter. Length is limited by meta.limits.match_text_max_length (default 500); the shared validator counts UTF-8 bytes before trimming. Omit both text filters for a status-only rule.
            message_not_contains:
              type: string
              nullable: true
              description: Optional negative case-insensitive text filter using the same message/summary source. Omitted, null or blank values disable this filter. Length is limited by meta.limits.match_text_max_length (default 500), measured in UTF-8 bytes before trimming. A nonblank filter does not match when both message and summary are empty.
          required:
            - status
        do:
          type: object
          additionalProperties: false
          properties:
            action:
              $ref: '#/components/schemas/AutomationRuleAction'
            target_agent_id:
              $ref: '#/components/schemas/AgentId'
          required:
            - action
            - target_agent_id
        enabled:
          allOf:
            - $ref: '#/components/schemas/AutomationBooleanInput'
          default: true
        max_triggers:
          type: integer
          nullable: true
          minimum: 1
          description: Per-rule trigger budget. Null means unlimited; omitted means module default. The numeric cap is returned at runtime in meta.limits.rule_max_triggers_cap.
        reset_counter:
          allOf:
            - $ref: '#/components/schemas/AutomationBooleanInput'
          default: false
          writeOnly: true
          description: Resets this rule's triggers_used on save. Changes to when/if/do also reset it automatically; changes to name, enabled, max_triggers or position preserve the counter.
      required:
        - name
        - when
        - if
        - do
    AutomationPutRequestBody:
      type: object
      additionalProperties: false
      properties:
        enabled:
          allOf:
            - $ref: '#/components/schemas/AutomationBooleanInput'
          default: true
        rules:
          type: array
          description: Full replacement rule set in evaluation order. The key is required; an empty array removes all rules while preserving the automation and its aggregate counter. Source and target agents must be active in the task project, including for disabled rules. The item cap is returned at runtime in meta.limits.max_rules_per_automation (default 20).
          items:
            $ref: '#/components/schemas/AutomationRuleRequestBody'
      required:
        - rules
