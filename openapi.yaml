            - closed
        message:
          type: string
    TaskPublicationResponseData:
      type: object
      properties:
        origin:
          type: string
          enum:
            - manual
            - capability
        artifact_id:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/TaskArtifactId'
            - type: string
              nullable: true
              enum:
                - null
        result_iteration_id:
          description: 'Persisted iteration of the selected result, fixed at publication acceptance. Upload/external_link publications use the selected artifact''s iteration or, without an artifact, the selected execution''s iteration. A file set uses the common non-null iteration of all selected artifacts; otherwise it is null. Older or unbound artifacts never inherit the latest task iteration. A link without an artifact or execution has result_iteration_id=null and is task-scoped, even when agent_id is supplied: an agent alone does not identify a result. Pull requests retain their selected result iteration. All three activity paths (created, updated and status transition) copy result_iteration_id into activity.iteration_id and preserve the publication''s execution_id and private agent snapshot. Private publication context cannot override the links. Use activity.timeline_scope for conversation routing: the iteration owner takes precedence; an ownerless publication with a definite result agent uses only that agent, even if the linked execution was later deleted. Without an iteration or a definite owner/agent the activity is task-scoped. Publishing an older or unbound result does not mark a newer iteration published.'
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/TaskIterationId'
            - type: string
              nullable: true
              enum:
                - null
        availability:
          type: object
          required:
            - mode
            - state
            - lifetime
          description: Display observation of the selected revision. Successful storage checks may be cached for 5 seconds by default (configurable up to 30); publication acceptance and downloads always validate independently. Withdrawal and missing artifact records are reflected immediately.
          properties:
            mode:
              type: string
              enum:
                - authenticated
                - external
            state:
              type: string
              enum:
                - available
                - withdrawn
                - unavailable
                - external
            lifetime:
              type: string
              nullable: true
              enum:
                - until_withdrawal_or_owner_deletion
                - null
              description: Retention guarantee for platform artifacts in protecting statuses only (capability pending/published, manual created/updated). Null for external, failed, draft or withdrawn publications, regardless of current object availability.
        id:
          $ref: '#/components/schemas/TaskPublicationId'
        task_id:
          $ref: '#/components/schemas/TaskId'
        execution_id:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/TaskExecutionId'
            - type: string
              nullable: true
              enum:
                - null
        agent_id:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/AgentId'
            - type: string
              nullable: true
              enum:
                - null
        agent_name:
          type: string
          nullable: true
        source_backend:
          type: string
          nullable: true
          maxLength: 64
        publication_type:
          $ref: '#/components/schemas/TaskPublicationType'
        external_id:
          type: string
          nullable: true
          maxLength: 255
        external_url:
          type: string
          nullable: true
          maxLength: 1000
          description: External result URL, or a platform-relative authenticated route (including the API mount). For a single-file artifact publication, this is the artifact download route. For a multi-file publication, this equals artifacts_url and returns the JSON file list, not a binary download.
        status:
          $ref: '#/components/schemas/TaskPublicationStatus'
        source_commit:
          description: Confirmed commit fixed when a capability PR decision is accepted; null only for other publication types or legacy records.
          type: string
          nullable: true
          pattern: ^[a-fA-F0-9]{40}$
        target_branch:
          type: string
          nullable: true
          maxLength: 255
        message:
          type: string
        metadata:
          $ref: '#/components/schemas/TaskObjectMap'
        created_at:
          $ref: '#/components/schemas/TaskDateTime'
        updated_at:
          $ref: '#/components/schemas/TaskDateTime'
        artifact_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskArtifactId'
        artifact_count:
          type: integer
          minimum: 0
        artifacts_url:
          type: string
          description: Paginated canonical file set, including in nested task publications. Uses the API mount and encoded publication ID; this is not a binary download.
      required:
        - id
        - task_id
        - execution_id
        - agent_id
        - source_backend
        - publication_type
        - external_id
        - external_url
        - status
        - source_commit
        - target_branch
        - metadata
        - created_at
        - updated_at
    TaskPublicationListResponseData:
