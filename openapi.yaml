        - execution_started
        - execution_progress
        - execution_completed
        - execution_failed
        - execution_cancel_requested
        - execution_cancelled
        - execution_runner_unavailable
        - artifact_attached
        - artifact_deleted
        - publication_created
        - publication_updated
        - automation_rule_triggered
        - automation_limit_reached
        - automation_skipped
    TaskActorType:
