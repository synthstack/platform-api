    TaskProjectActivityListResponseData:
      type: array
      items:
        $ref: '#/components/schemas/TaskProjectActivityResponseData'
    TaskActivityPayload:
      type: object
      description: Kind-specific payload restrictions are applied to the whole activity by TaskActivityBaseData.oneOf. Empty payloads are JSON objects for every kind, including unknown kinds, in these two feeds and the common WS DTO.
    TaskExecutorAssignedActivityPayload:
      type: object
