        '409':
          $ref: '#/components/responses/AgentConflict'
        '422':
          $ref: '#/components/responses/AgentValidationError'
        '500':
          description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Quota lookup uses details[].source tenant and operation quotaService.getQuotas; failure stops the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: SKILL_LIBRARY_UNAVAILABLE for a failed skill-library call, SKILL_DOWNLOAD_UNAVAILABLE when the download signer fails, or DEPENDENCY_UNAVAILABLE from quota lookup (details[].source tenant, operation quotaService.getQuotas). Failure stops the operation.
          content:
