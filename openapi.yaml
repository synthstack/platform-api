        - $ref: '#/components/schemas/TaskIterationFailedActivity'
        - $ref: '#/components/schemas/TaskExecutionQueuedActivity'
        - $ref: '#/components/schemas/TaskExecutionClaimedActivity'
        - $ref: '#/components/schemas/TaskExecutionStartedActivity'
        - $ref: '#/components/schemas/TaskExecutionProgressActivity'
        - $ref: '#/components/schemas/TaskExecutionCompletedActivity'
        - $ref: '#/components/schemas/TaskExecutionFailedActivity'
        - $ref: '#/components/schemas/TaskExecutionCancelRequestedActivity'
        - $ref: '#/components/schemas/TaskExecutionCancelledActivity'
        - $ref: '#/components/schemas/TaskExecutionRunnerUnavailableActivity'
        - $ref: '#/components/schemas/TaskArtifactAttachedActivity'
        - $ref: '#/components/schemas/TaskArtifactDeletedActivity'
        - $ref: '#/components/schemas/TaskPublicationCreatedActivity'
        - $ref: '#/components/schemas/TaskPublicationUpdatedActivity'
        - $ref: '#/components/schemas/TaskAutomationRuleTriggeredActivity'
        - $ref: '#/components/schemas/TaskAutomationLimitReachedActivity'
        - $ref: '#/components/schemas/TaskAutomationSkippedActivity'
        - $ref: '#/components/schemas/TaskUnknownActivity'
