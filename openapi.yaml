        '401':
          description: UNAUTHORIZED for missing or malformed Bearer authorization; INVALID_TOKEN for an invalid or expired access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: TENANT_REQUIRED when tenant context cannot be resolved; TENANT_INACTIVE for an inactive tenant; FORBIDDEN for a token/membership tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          $ref: '#/components/responses/NotificationDependencyError'
        '503':
          $ref: '#/components/responses/NotificationDependencyUnavailable'
      tags:
        - Notifications
  /notifications/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Encoded notification ID. Invalid, foreign, missing, or dismissed IDs return 404 NOT_FOUND.
        schema:
          $ref: '#/components/schemas/NotificationId'
    patch:
      summary: Mark one notification read or unread
      description: Requires a JSON object containing only the boolean read field. true marks the notification read; false clears read_at. Repeating the current read state preserves read_at. Returns the notification and the unread count for the authenticated user and active tenant.
      operationId: notificationsUpdate
      security:
        - bearerAuth: []
