                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_password_reset
  /auth/password/set:
    post:
      summary: Set initial password
      description: Set the first password using the one-time setup token from a welcome email
      security: []
      requestBody:
        required: true
