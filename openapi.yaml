            reference secrets defined as project/agent env vars with
            `is_secret=true`.
          additionalProperties: true
        env_variables:
          type: object
          description: |-
            Public payload returned as stored. Local overrides for the MCP server
            placeholder resolution; values are not masked.
          additionalProperties: true
