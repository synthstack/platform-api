  /skills:
    post:
      summary: Upload and canonicalize a reusable skill ZIP
      description: |
        Requires a JWT bearer access token and an active tenant membership. Upload requests
        are rate limited per user before archive validation (default 10 requests per 60 seconds).

        Accepts either SKILL.md at the ZIP root, or exactly one top-level directory with a
        case-sensitive SKILL.md directly inside it and no other visible root files. OS junk is
        ignored when identifying this layout. A valid wrapper is stripped before storage.
        Top-level __MACOSX content and .DS_Store, Thumbs.db, and desktop.ini files at any depth
        are removed, including after wrapper removal. The returned sha256 and size_bytes describe
        the stored canonical archive; already canonical archives without OS junk are stored byte-for-byte.

        Default limits: 5242880 bytes (5 MiB) for both the uploaded and canonical ZIP, 20971520
        bytes (20 MiB) read unpacked including junk, 200 canonical regular files (including SKILL.md),
        1000 total ZIP entries including directories/junk, and 255 bytes per path. Only store and
        deflate compression are accepted. Encryption, links, special entries, unsafe or duplicate
        paths, and CRC failures are rejected.

        SKILL.md must be UTF-8, at most 1048576 bytes (1 MiB) by default, and start with YAML
        frontmatter delimited by --- lines. Frontmatter requires a nonempty string description
        (default maximum 1024 characters before trimming). Optional name must match
        [a-z0-9_-][a-z0-9._-]* (default maximum 100 characters). YAML frontmatter is limited to
        65536 bytes by default, 512 lines, and 64 leading spaces, with additional YAML safety checks.

        If name is omitted, a new archive requires a filename that normalizes to a safe skill name.
        This fallback is tenant-local; the global content name is skill-{first-16-sha256-characters}.
        Re-uploading the same canonical bytes preserves an existing tenant link's name, uploader,
        and upload time. A new tenant gets its own filename-derived name, or the content-derived
        global name if its local filename cannot be normalized. Deduplication returns 201.
      operationId: createSkill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Required nonempty ZIP with a .zip filename (case-insensitive). Server-detected MIME must be application/zip, application/x-zip, or application/x-zip-compressed; application/octet-stream is rejected. Default maximum size is 5242880 bytes (5 MiB). Contains root SKILL.md or one wrapper directory containing SKILL.md directly.
              required:
                - file
      responses:
        '201':
          description: Skill uploaded or deduplicated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SkillCreateResponseData'
                    required:
                      - data
        '401':
          $ref: '#/components/responses/SkillsUnauthorized'
        '403':
          $ref: '#/components/responses/SkillsForbidden'
        '422':
          $ref: '#/components/responses/SkillsValidationError'
        '429':
          $ref: '#/components/responses/SkillsRateLimited'
        '500':
          $ref: '#/components/responses/SkillsInternalError'
        '503':
          $ref: '#/components/responses/SkillsUnavailable'
      tags:
        - Skills
    get:
      summary: List tenant skill library
      description: Requires a JWT bearer access token and active tenant membership. Reads metadata from the database only and exposes neither storage keys nor presigned URLs. Pagination values are cast to integers and clamped; invalid q/sort values return VALIDATION_ERROR.
      operationId: listSkills
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Substring search over tenant-local name and description. Trimmed before checking the 255-character limit; empty means no filter. Percent and underscore are treated literally.
          schema:
            type: string
            default: ''
        - name: sort
          in: query
          description: recent sorts by tenant upload time descending, then skill ID descending. usage sorts by tenant agents_count descending, followed by the same recent ordering.
          schema:
            type: string
            enum:
              - recent
              - usage
            default: recent
        - name: page
          in: query
          description: Cast to an integer and clamped to at least 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Cast to an integer and clamped to 1..100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Tenant skill library
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SkillListResponseData'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
                    required:
                      - data
                      - meta
        '401':
          $ref: '#/components/responses/SkillsUnauthorized'
        '403':
          $ref: '#/components/responses/SkillsForbidden'
        '422':
          $ref: '#/components/responses/SkillsQueryValidationError'
        '500':
          $ref: '#/components/responses/SkillsInternalError'
      tags:
        - Skills
