          in: header
          required: false
          description: Required for nonempty input_artifact_ids; optional otherwise. An empty header is treated as absent. With nonempty input_artifact_ids, a missing or empty key returns 422 VALIDATION_ERROR with message "Idempotency-Key is required for input artifacts". Otherwise, a missing or empty key creates a new iteration on each request. Nonempty keys must contain 1 to 128 printable ASCII characters without spaces; invalid keys return 422 VALIDATION_ERROR. These rules apply to both manual and retry triggers. Scoped to this task, not the author, and shared with all comment request keys, including plain comments; same key with a different fingerprint or operation returns 409 IDEMPOTENCY_KEY_CONFLICT. Repeating the same key and body after a timeout safely returns 201 with the previously accepted iteration and the initially accepted execution_ids before mutable task/input/executor revalidation, including on a closed task. Replay still requires current access, preserves the original author and creates no records, events or realtime signals. Mutable iteration fields such as status, completed_at and updated_at may reflect current state; the original HTTP response is not stored and byte-for-byte JSON equality is not guaranteed. Leading and trailing whitespace in reason is trimmed before fingerprinting and storage; differences inside the reason remain significant.
          schema:
            type: string
            minLength: 0
            maxLength: 128
            pattern: ^[!-~]{0,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskIterationCreateRequestBody'
      responses:
        '201':
          description: Task iteration and executions created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskIterationCreateResponseData'
        '401':
          $ref: '#/components/responses/TasksUnauthorized'
        '403':
          $ref: '#/components/responses/TasksForbidden'
        '404':
          $ref: '#/components/responses/TasksNotFound'
        '409':
          $ref: '#/components/responses/TasksConflict'
        '422':
          $ref: '#/components/responses/TasksExecutionStartRejected'
        '500':
          $ref: '#/components/responses/TasksBillingDependencyError'
        '503':
          $ref: '#/components/responses/TasksBillingDependencyUnavailable'
  /tasks/entries/{id}/executions:
    get:
