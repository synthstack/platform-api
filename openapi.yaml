          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: DEPENDENCY_UNAVAILABLE — a required backend or tenant quota call is temporarily unavailable, including uninitialized quota state. Tenant quota errors identify source tenant and operation quotaService.lockIntegrationUsage or quotaService.releaseIntegrationSlot. Deletion and token revocation are rolled back.
