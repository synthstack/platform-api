components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountSettingsSttEngine:
      type: string
      description: User-selected speech-to-text engine for the UI.
      enum:
        - browser
        - openai
      example: browser
    AccountSettingsAudioSettings:
      type: object
      description: Audio-related account settings.
      additionalProperties: false
      properties:
        stt_engine:
          $ref: '#/components/schemas/AccountSettingsSttEngine'
      required:
        - stt_engine
    AccountSettingsNotificationCategories:
      type: object
      description: Category delivery switches. Keys are open snake_case identifiers.
      additionalProperties:
        type: boolean
    AccountSettingsNotificationTypes:
      type: object
      description: Sparse per-type overrides. Keys are open snake_case notification type identifiers.
      additionalProperties:
        type: boolean
    AccountSettingsNotificationDelivery:
      type: object
      additionalProperties: false
      properties:
        toasts:
          type: boolean
        high_priority_sound:
          type: boolean
      required:
        - toasts
        - high_priority_sound
    AccountSettingsNotificationSettings:
      type: object
      additionalProperties: false
      properties:
        categories:
          $ref: '#/components/schemas/AccountSettingsNotificationCategories'
        types:
          $ref: '#/components/schemas/AccountSettingsNotificationTypes'
        delivery:
          $ref: '#/components/schemas/AccountSettingsNotificationDelivery'
      required:
        - categories
        - types
        - delivery
    AccountSettingsResponseData:
      type: object
      description: Effective account settings document merged with module defaults.
      additionalProperties: false
      properties:
        audio:
          $ref: '#/components/schemas/AccountSettingsAudioSettings'
        notifications:
          $ref: '#/components/schemas/AccountSettingsNotificationSettings'
      required:
        - audio
        - notifications
    AccountSettingsSttEnginePatch:
      type: string
      nullable: true
      description: STT engine override. Null removes the override and restores the module default.
      enum:
        - browser
        - openai
        - null
    AccountSettingsAudioSettingsPatch:
      type: object
      nullable: true
      description: Partial audio settings patch. Null removes all audio overrides.
      additionalProperties: false
      properties:
        stt_engine:
          $ref: '#/components/schemas/AccountSettingsSttEnginePatch'
    AccountSettingsNotificationCategoriesPatch:
      type: object
      nullable: true
      description: Category override patch. Null removes the branch; null property values remove individual overrides.
      additionalProperties:
        type: boolean
        nullable: true
    AccountSettingsNotificationTypesPatch:
      type: object
      nullable: true
      description: Notification type override patch. Null removes the branch; null property values remove individual overrides.
      additionalProperties:
        type: boolean
        nullable: true
    AccountSettingsNotificationDeliveryPatch:
      type: object
      nullable: true
      description: Delivery override patch. Null removes all delivery overrides.
      additionalProperties: false
      properties:
        toasts:
          type: boolean
          nullable: true
        high_priority_sound:
          type: boolean
          nullable: true
    AccountSettingsNotificationSettingsPatch:
      type: object
      nullable: true
      description: Partial notification settings patch. Null removes all notification overrides.
      additionalProperties: false
      properties:
        categories:
          $ref: '#/components/schemas/AccountSettingsNotificationCategoriesPatch'
        types:
          $ref: '#/components/schemas/AccountSettingsNotificationTypesPatch'
        delivery:
          $ref: '#/components/schemas/AccountSettingsNotificationDeliveryPatch'
    AccountSettingsUpdateRequestBody:
      type: object
      description: JSON Merge Patch (RFC 7386) for account setting overrides. Null removes audio/notification overrides and restores defaults. Unknown namespaces and fields are rejected.
      additionalProperties: false
      properties:
        audio:
          $ref: '#/components/schemas/AccountSettingsAudioSettingsPatch'
        notifications:
          $ref: '#/components/schemas/AccountSettingsNotificationSettingsPatch'
    AgentId:
      type: string
      description: Agent identifier (prefix "agt")
      pattern: ^agt_[a-zA-Z0-9]{6,}$
      example: agt_aB3xYz
    TenantAgentId:
      type: string
      description: Tenant-scoped agent identifier (prefix "tag")
      pattern: ^tag_[a-zA-Z0-9]{6,}$
      example: tag_aB3xYz
    PromptId:
      type: string
      description: Prompt identifier (prefix "pmt")
      pattern: ^pmt_[a-zA-Z0-9]{6,}$
      example: pmt_aB3xYz
    FileId:
      type: string
      description: File identifier (prefix "fil")
      pattern: ^fil_[a-zA-Z0-9]{6,}$
      example: fil_aB3xYz
    EnvVarId:
      type: string
      description: Environment variable identifier (prefix "env")
      pattern: ^env_[a-zA-Z0-9]{6,}$
      example: env_aB3xYz
    RoleId:
      type: string
      description: Agent role identifier (prefix "rol")
      pattern: ^rol_[a-zA-Z0-9]{6,}$
      example: rol_aB3xYz
    McpServerId:
      type: string
      description: MCP server identifier (prefix "mcp")
      pattern: ^mcp_[a-zA-Z0-9]{6,}$
      example: mcp_aB3xYz
    ModelId:
      type: string
      description: Model identifier (prefix "mdl")
      pattern: ^mdl_[a-zA-Z0-9]{6,}$
      example: mdl_aB3xYz
    EngineId:
      type: string
      description: Engine identifier (prefix "eng")
      pattern: ^eng_[a-zA-Z0-9]{6,}$
      example: eng_aB3xYz
    EngineConfigId:
      type: string
      description: Engine configuration identifier (prefix "ec")
      pattern: ^ec_[a-zA-Z0-9]{6,}$
      example: ec_aB3xYz
    MarketplaceId:
      type: string
      description: Marketplace agent identifier (prefix "mkt")
      pattern: ^mkt_[a-zA-Z0-9]{6,}$
      example: mkt_aB3xYz
    AgentEngine:
      type: object
