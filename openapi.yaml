      summary: Clone agent
      description: Clone requires assertCanMutate. Members may clone only editable agents they created; another creator's agent is rejected regardless of whether it has service declarations. Read-only marketplace agents cannot be cloned by any role. Refusals create no partial clone. Agent and tenant_agent service declarations are copied atomically, with fresh odd ENV row IDs and regenerated generated values; project_assignment declarations are not copied. Member refusals use FORBIDDEN, including read-only agents (previously AGENT_NOT_EDITABLE); elevated roles on read-only agents retain AGENT_NOT_EDITABLE.
