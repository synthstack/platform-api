    FeedbackId:
      type: string
      description: External feedback identifier encoded by idEncode with prefix "fb". The pattern describes the default Sqids alphabet and minimum length. Use an ID returned by the API; the example only illustrates the format.
      pattern: ^fb_[a-zA-Z0-9]{6,}$
      example: fb_aB3xYz
    FeedbackSubmitResponseData:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FeedbackId'
        created_at:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp read back from storage; null if it cannot be parsed.
        message:
          type: string
          enum:
            - Your message has been received.
      required:
        - id
        - created_at
        - message
    EncodedId:
      type: string
      description: Public ID in the format {prefix}_{sqid}. The catalog prefix starts with a lowercase letter and contains lowercase letters or digits. The Sqids segment encodes one positive integer using the configured alphabet and minimum length (at least six alphanumeric characters by default). This shared schema checks the structure only; the codec validates the registered prefix, expected entity, and canonical encoding when canonical_check is enabled. Entity-specific ID schemas are declared in the owning modules.
      pattern: ^[a-z][a-z0-9]*_[\s\S]+$
      example: tsk_lPasgV
    IntegrationId:
      type: string
      description: Integration identifier (prefix "int")
      pattern: ^int_[a-zA-Z0-9]{6,}$
      example: int_aB3xYz
    DataSourceId:
      type: string
      description: Integration data source identifier (prefix "ds")
      pattern: ^ds_[a-zA-Z0-9]{6,}$
      example: ds_aB3xYz
    IntegrationStatus:
      type: string
      enum:
        - pending
        - active
        - error
        - disabled
    IntegrationTestStatus:
      type: string
      enum:
        - ok
        - error
    DataSourceKind:
      type: string
      enum:
        - repo
        - bucket
        - folder
        - mailbox
        - other
    IntegrationPayloadScalar:
      description: Scalar value allowed inside bounded integration payload objects. Strings are limited to 2048 UTF-8 bytes; number includes integers.
      oneOf:
        - type: string
          nullable: true
          maxLength: 2048
          x-max-length-bytes: 2048
        - type: number
        - type: boolean
    IntegrationEmptyArray:
      type: array
      maxItems: 0
      items: {}
      description: Empty PHP arrays serialize as []; nonempty lists are not accepted here.
    IntegrationPayloadScalarList:
      type: array
      maxItems: 32
      description: Flat list of scalar values allowed inside bounded integration payload objects.
      items:
        $ref: '#/components/schemas/IntegrationPayloadScalar'
    IntegrationPayloadLeafObject:
      type: object
      maxProperties: 32
      description: Third-level bounded associative object. Keys must match ^[a-zA-Z0-9_.-]{1,64}$.
      x-key-name-pattern: ^[a-zA-Z0-9_.-]{1,64}$
      additionalProperties:
        $ref: '#/components/schemas/IntegrationPayloadScalar'
    IntegrationPayloadNestedObject:
      type: object
      maxProperties: 32
      description: Second-level bounded associative object. Keys must match ^[a-zA-Z0-9_.-]{1,64}$.
      x-key-name-pattern: ^[a-zA-Z0-9_.-]{1,64}$
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/IntegrationPayloadScalar'
          - $ref: '#/components/schemas/IntegrationPayloadScalarList'
          - $ref: '#/components/schemas/IntegrationPayloadLeafObject'
    IntegrationBoundedPayloadObject:
      description: |
        Bounded associative payload used for integration config, credentials, and data-source metadata. Empty objects may serialize as []; only an empty list is accepted at the root. Maximum depth is 3, string values are limited to 2048 bytes, and serialized size (PHP json_encode with JSON_UNESCAPED_SLASHES) is limited to 16384 bytes per field. Keys must match ^[a-zA-Z0-9_.-]{1,64}$. Limits reflect the default payload_shape configuration. Client limit violations return 422 INTEGRATION_PAYLOAD_TOO_LARGE; malformed backend metadata returns 500 DEPENDENCY_CONTRACT_VIOLATION.
      x-key-name-pattern: ^[a-zA-Z0-9_.-]{1,64}$
      x-max-total-size-bytes: 16384
      oneOf:
        - type: object
          maxProperties: 32
          additionalProperties:
            oneOf:
              - $ref: '#/components/schemas/IntegrationPayloadScalar'
              - $ref: '#/components/schemas/IntegrationPayloadScalarList'
              - $ref: '#/components/schemas/IntegrationPayloadNestedObject'
        - $ref: '#/components/schemas/IntegrationEmptyArray'
    IntegrationConfig:
      allOf:
        - $ref: '#/components/schemas/IntegrationBoundedPayloadObject'
      description: Non-secret backend configuration. Secret-like keys are silently removed before storage.
    IntegrationCredentials:
      writeOnly: true
      allOf:
        - $ref: '#/components/schemas/IntegrationBoundedPayloadObject'
      description: Secret backend credentials accepted only on create/update and validated against backend schema.
    IntegrationWriteErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - BACKEND_TYPE_UNKNOWN
        - BACKEND_CAPABILITY_NOT_SUPPORTED
        - BACKEND_CREDENTIALS_REJECTED
        - BACKEND_RESOURCE_REJECTED
        - INTEGRATION_PAYLOAD_TOO_LARGE
        - INTEGRATION_UNKNOWN_FIELD
        - INTEGRATION_CONFIG_INVALID
        - QUOTA_EXCEEDED
        - CREDENTIALS_REFERENCE_INVALID
    IntegrationWriteErrorDetails:
      allOf:
