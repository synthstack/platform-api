      minLength: 1
      maxLength: 63
      description: DNS label; full-string PCRE \A[a-z]([a-z0-9-]{0,61}[a-z0-9])?\z. Unique within the project, regardless of catalog entry.
      example: mysql
    ProjectServiceEnvRow:
      type: object
      required:
        - id
        - key
        - value
        - is_secret
        - is_generated
        - template_key
        - is_renamed
      properties:
        id:
          $ref: '#/components/schemas/EnvVarId'
        key:
          type: string
          maxLength: 255
          description: Full-string PCRE \A[A-Za-z_][A-Za-z0-9_]*\z; unique in this declaration.
        value:
          type: string
          maxLength: 65535
          description: Secret values are always ***; public values are stored literals.
        is_secret:
          type: boolean
        is_generated:
          type: boolean
          readOnly: true
        template_key:
          type: string
          nullable: true
        is_renamed:
          type: boolean
          readOnly: true
          description: Key differs from the template key name captured at row creation; false for custom rows.
    ProjectServiceEnvWriteRow:
      type: object
      description: 'Existing rows match by id belonging to this declaration. A missing or null id creates a new row. Omitted key/value/flags preserve stored values; value *** also preserves the stored value. New custom rows require key and value (is_secret defaults false). New template rows accept template_key and optional key; omitted value applies the server default. New generated rows must omit value and default to is_secret=true regardless of the template flag; existing generated rows accept only omitted value or ***. A new generated row may explicitly set is_secret to false: its fresh server-generated value is public. template_key is immutable for existing rows, even when the template row was removed from the catalog. Making a secret public requires an explicit new value. is_generated, is_renamed and template_origin_key supplied by clients are ignored. Expression syntax ${{ is forbidden in key/value, including defaults.'
      properties:
        id:
          type: string
          nullable: true
          description: Existing env_ ID, or null to create a new row.
          pattern: ^env_[a-zA-Z0-9]{6,}(?![\s\S])
          example: env_aB3xYz
        template_key:
          type: string
          nullable: true
        key:
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 65535
        is_secret:
          type: boolean
    ProjectServiceParamsResponse:
      type: object
      required:
        - version
        - use_global_env
        - env_vars
      properties:
        version:
          type: string
        use_global_env:
          type: boolean
          description: Enables global ENV placeholder resolution by the effective-services resolver (MCP parity). CRUD stores literals. A same-name self-reference such as TOKEN=$TOKEN does not import the global TOKEN.
        env_vars:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ProjectServiceEnvRow'
    ProjectServiceParamsPatch:
      type: object
      properties:
        version:
          type: string
          description: On creation or an actual change, must be in current supported_versions with a nonempty image. The saved version is not revalidated when omitted or resubmitted unchanged.
        use_global_env:
          type: boolean
          description: Stores the flag without resolving placeholders; same-name self-references do not import global values.
        env_vars:
          type: array
          maxItems: 64
          description: Full replacement by row id; omitted rows are deleted. Omitted env_vars preserves the set on PATCH. On POST omission scaffolds the entire template; [] creates no rows. Restoring a template row without id creates a new id and regenerates generated values. Values referenced by options must match the runtime charset unless they contain a $VAR placeholder; final validation belongs to the resolver/renderer.
          items:
            $ref: '#/components/schemas/ProjectServiceEnvWriteRow'
    ProjectServiceParamsCreate:
      allOf:
        - $ref: '#/components/schemas/ProjectServiceParamsPatch'
        - type: object
          required:
            - version
      description: use_global_env defaults to false. Missing template defaults become empty strings; secret defaults stay secret.
