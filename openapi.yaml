  /console-members/{id}/reset-password:
    post:
      summary: Request a member password reset
      description: 'Queues a password-reset email for an active member or resends a fresh setup invitation for a pending member. Requests are throttled per tenant and target member. For pending members, the per-target cooldown is consumed before resend resolves the inviter. An active cooldown returns 429 without inviter lookup. A failed lookup leaves setup tokens and the invitation outbox unchanged; the consumed cooldown remains in effect. Only tenant owners may perform this operation. Rate limit: 10 requests per authenticated user per 60 seconds for this route; fail closed.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ConsoleMemberId'
      responses:
        '200':
          description: Password reset or invitation queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TeamConsoleMemberPasswordResetResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Owner role required or platform administrator account is protected (PLATFORM_ADMIN_ACCOUNT_PROTECTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Target member not found, or authenticated inviter no longer exists when resending a pending member invitation (CONSOLE_MEMBER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: Disabled member (INVALID_MEMBER_STATUS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR when the pending invitation recipient has no valid email or user ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Per-target cooldown (PASSWORD_RESET_THROTTLED, 300 seconds by default, with details.retry_after_seconds) or route rate limit (RATE_LIMIT_EXCEEDED).
          headers:
            Retry-After:
              description: Seconds until retry is allowed.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: 'RATE_LIMIT_CONFIGURATION_ERROR for an invalid limiter configuration, or DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid result or undocumented owner 4xx), or DEPENDENCY_FAILED (other owner failure). Source auth: authService.requestPasswordResetForUser for an active member; authService.getUserById, authService.reissuePendingPasswordSetupToken or authService.resolvePreferredLanguage for a pending invitation. The per-target cooldown remains consumed. A failed pending-invitation lookup leaves setup tokens and the invitation outbox unchanged. Public details contain only source and operation; no upstream payload or debug metadata is returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: 'RATE_LIMIT_UNAVAILABLE when the route limiter backend is unavailable (fail closed), or DEPENDENCY_UNAVAILABLE. Source auth: authService.requestPasswordResetForUser for an active member; authService.getUserById, authService.reissuePendingPasswordSetupToken or authService.resolvePreferredLanguage for a pending invitation. The per-target cooldown remains consumed. A failed pending-invitation lookup leaves setup tokens and the invitation outbox unchanged. Public details contain only source and operation; no upstream payload or debug metadata is returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Team
      operationId: post_console_members_id_reset_password
