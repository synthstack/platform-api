  /ai/transcriptions:
    post:
      summary: Transcribe audio
      description: Validate and enqueue an audio transcription. Requires a JWT access token; tenant membership is optional, but an inactive tenant or a token/membership mismatch can return 403. Validated audio is stored in transient S3 storage before queueing. The result is delivered asynchronously as `ai.assist.completed` or `ai.assist.failed` through the user's consoleRealtime notify channel. The default rate limit is 5 requests per user per 60-second window (AI_RATE_STT_PER_MIN). There are no path or query parameters and no job status/polling endpoint.
      operationId: aiAssistCreateTranscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiAssistTranscriptionRequestBody'
      responses:
        '202':
          description: Transcription accepted and queued
          headers:
            X-RateLimit-Limit:
              description: Configured requests per window; present when rate limiting is applied.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window; present when rate limiting is applied.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AiAssistQueuedResponseData'
        '401':
          description: UNAUTHORIZED (missing or malformed Bearer header) or INVALID_TOKEN (invalid or expired access token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: FORBIDDEN (token tenant does not match membership) or TENANT_INACTIVE (tenant is not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '413':
          description: FILE_TOO_LARGE for PHP upload errors UPLOAD_ERR_INI_SIZE or UPLOAD_ERR_FORM_SIZE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR for missing/failed uploads, unsupported formats, the module file size limit, or an invalid language hint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: RATE_LIMIT_EXCEEDED for the per-user transcription limit
          headers:
            Retry-After:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal/enqueue failure, or RATE_LIMIT_CONFIGURATION_ERROR for invalid rate-limit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: AI_STORAGE_UNAVAILABLE when transient input storage fails before queueing, or RATE_LIMIT_UNAVAILABLE when the shared limiter is configured to fail closed and its backend is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Ai Assist
  /ai/text-actions/rewrite:
    post:
      summary: Rewrite Markdown text
      description: Validate and enqueue an AI text action. Requires a JWT access token; tenant membership is optional, but an inactive tenant or a token/membership mismatch can return 403. Text is included in the queue payload and does not use S3. The result is delivered asynchronously as `ai.assist.completed` or `ai.assist.failed` through the user's consoleRealtime notify channel. The default rate limit is 10 requests per user per 60-second window (AI_RATE_TEXT_PER_MIN). There are no path or query parameters and no job status/polling endpoint.
