    TaskIterationResponseData:
      type: object
      additionalProperties: false
      description: Public iteration projection, also used by task.latest_iteration and activity feeds. Input selection includes encoded input_artifact_ids and viewer-independent input_artifacts with pinned metadata and encoded source IDs. Raw snapshots, storage references, persisted replay data, request keys and fingerprints are internal. source is always present, including null. Its links may disappear after physical deletion (ON DELETE SET NULL). timeline_owner_agent_id is fixed at creation and survives agent/execution deletion; use it or activity.timeline_scope for routing.
      properties:
        id:
          $ref: '#/components/schemas/TaskIterationId'
        sequence:
          type: integer
          minimum: 1
        trigger_type:
          $ref: '#/components/schemas/TaskIterationTrigger'
        trigger_activity_id:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/TaskActivityId'
            - type: string
              nullable: true
              enum:
                - null
        timeline_owner_agent_id:
          description: Conversation owner, inherited from the trigger iteration, its execution agent, or the source execution's iteration owner (falling back to the source agent), then a sole executor. Null means no single owner (multi-executor broadcast, initial or manual iteration), never pending resolution. Present in REST, latest_iteration and task.iteration.updated.
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/AgentId'
            - type: string
              nullable: true
              enum:
                - null
        source:
          $ref: '#/components/schemas/TaskIterationSource'
        status:
          $ref: '#/components/schemas/TaskIterationStatus'
        created_by:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/UserId'
            - type: string
              nullable: true
              enum:
                - null
        created_at:
          $ref: '#/components/schemas/TaskDateTime'
        completed_at:
          $ref: '#/components/schemas/TaskNullableDateTime'
        updated_at:
          $ref: '#/components/schemas/TaskDateTime'
        input_artifact_ids:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskArtifactId'
        input_artifacts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TaskIterationInputArtifact'
      required:
        - id
        - sequence
        - trigger_type
        - trigger_activity_id
        - source
        - timeline_owner_agent_id
        - status
        - created_by
        - created_at
        - completed_at
        - updated_at
        - input_artifact_ids
        - input_artifacts
