      type: object
      properties:
        date:
          $ref: '#/components/schemas/TenantMetricBucketDate'
        value:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          description: Completed executions / (completed + failed) times 100; null when the bucket has no completed or failed executions.
      required:
        - date
        - value
    TenantMetricSeriesBaseData:
      type: object
      properties:
        interval:
          $ref: '#/components/schemas/TenantMetricInterval'
        timezone:
          type: string
          enum:
            - UTC
        from:
          type: string
          format: date-time
          description: Effective display range start, serialized to whole UTC seconds. A requested start before tenant creation is clamped to the creation bucket, while source queries start at the exact creation instant. Empty ranges return equal from and to boundaries.
        to:
          type: string
          format: date-time
          description: Effective exclusive range end, serialized to whole UTC seconds. Source queries cap the requested end at the current instant and retain fractional precision. A range entirely before tenant creation returns the creation bucket boundary; a future range returns now.
      required:
        - interval
        - timezone
        - from
        - to
