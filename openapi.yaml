      type: object
      description: Sparse profile configuration returned by profile endpoints, or null when no profile exists.
      nullable: true
      minProperties: 1
      additionalProperties: false
      properties:
        timeout:
          type: integer
          minimum: 60
          maximum: 86400
        git_operations:
          type: boolean
        ci_services:
          type: boolean
        diff_patterns:
          type: string
          enum:
            - raw
            - frontend
            - backend
            - all
        diff_max_file_lines:
          type: integer
          minimum: 0
        diff_max_file_size:
          type: integer
          minimum: 0
        diff_exclude_tests:
          type: boolean
        diff_exclude_locks:
          type: boolean
        diff_exclude_generated:
          type: boolean
        diff_custom_exclude:
          type: string
          maxLength: 2000
        iteration_strategy:
          type: string
          enum:
            - inline
            - reference
        iteration_max_lines:
          type: integer
          minimum: 0
        iteration_max_size:
          type: integer
          minimum: 0
        work_dir:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*[\\\r\n\u0000]).+$
          description: Relative working directory. Must not be empty, absolute, contain backslashes, line breaks, NUL bytes, or '..' path segments.
        task_context:
          type: object
          additionalProperties: false
          properties:
            history_mode:
              type: string
              enum:
                - trigger_only
                - full_thread
          required:
            - history_mode
    AgentEffectiveProfileConfig:
      description: |
        Profile configuration participating in the runtime merge. Configuration keys and
        values are intentionally extensible because engine and project layers may expose
        settings beyond the editable agent-profile fields. An empty PHP array is emitted
        as an empty JSON array; `{}` and `[]` are semantically equivalent when empty.
        ID-like property names inside this free configuration are opaque values and are
        not encoded entity identifiers.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          maxItems: 0
          items: {}
    AgentEffectiveProfileLayerName:
      type: string
      enum:
        - engine_default
        - agent
        - tenant_agent
    ProjectAgentEffectiveProfileLayerName:
      type: string
      enum:
        - engine_default
        - project
        - agent
        - tenant_agent
        - project_assignment
    AgentEffectiveProfileSources:
      type: object
      description: Map from a leaf dot-path in the effective profile to its winning layer.
      additionalProperties:
        $ref: '#/components/schemas/AgentEffectiveProfileLayerName'
      example:
        timeout: engine_default
        task_context.history_mode: tenant_agent
        work_dir: tenant_agent
    ProjectAgentEffectiveProfileSources:
      type: object
      description: Map from a leaf dot-path in the effective profile to its winning layer.
      additionalProperties:
        $ref: '#/components/schemas/ProjectAgentEffectiveProfileLayerName'
      example:
        timeout: engine_default
        labels: project
        task_context.history_mode: tenant_agent
        work_dir: project_assignment
    AgentEffectiveProfileInheritance:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: array
          minItems: 3
          maxItems: 3
          enum:
            - - engine_default
              - agent
              - tenant_agent
          items:
            $ref: '#/components/schemas/AgentEffectiveProfileLayerName'
        sources:
          $ref: '#/components/schemas/AgentEffectiveProfileSources'
        layers_present:
          type: object
          additionalProperties: false
          properties:
            agent:
              type: boolean
            tenant_agent:
              type: boolean
          required:
            - agent
            - tenant_agent
      required:
        - chain
        - sources
        - layers_present
    ProjectAgentEffectiveProfileInheritance:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: array
          minItems: 5
          maxItems: 5
          enum:
            - - engine_default
              - project
              - agent
              - tenant_agent
              - project_assignment
          items:
            $ref: '#/components/schemas/ProjectAgentEffectiveProfileLayerName'
        sources:
          $ref: '#/components/schemas/ProjectAgentEffectiveProfileSources'
        layers_present:
          type: object
          additionalProperties: false
          properties:
            project:
              type: boolean
            agent:
              type: boolean
            tenant_agent:
              type: boolean
            project_assignment:
              type: boolean
          required:
            - project
            - agent
            - tenant_agent
            - project_assignment
      required:
        - chain
        - sources
        - layers_present
