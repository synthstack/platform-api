          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          description: Requests remaining in the current rate-limit window.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksServiceUnavailable:
      description: Required storage, backend service or request guard is unavailable (for example ARTIFACT_STORAGE_NOT_CONFIGURED). Authenticated operations that resolve project access through projectService.get can also return DEPENDENCY_UNAVAILABLE from projects; details[].source/operation use source projects and the invoked projectService method. Public share-link downloads do not perform that project access lookup.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksInternalError:
      description: Internal configuration or processing error. Authenticated share-link creation can also fail during project access with DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED; in that case details[].source/operation use source projects and the invoked projectService method; debug is omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesDependencyFailure:
      description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesBadRequest:
      description: Invalid JSON request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesUnauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesForbidden:
      description: Forbidden or tenant context required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesNotFound:
      description: Project or template not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesConflict:
      description: Template name conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesValidationError:
      description: Validation error or template limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TenantOwnerUnauthorized:
      description: UNAUTHORIZED (missing bearer token) or INVALID_TOKEN (invalid bearer token), as rendered by auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TenantOwnerForbidden:
      description: TENANT_REQUIRED when membership or tenant context is missing (including superadmins), TENANT_INACTIVE when the tenant is not active, or FORBIDDEN when tenant role is not owner. Superadmin status neither grants nor removes owner access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
  requestBodies:
    AgentCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - engine_id
              - model
              - role_id
              - display_name
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
              engine_id:
                $ref: '#/components/schemas/EngineId'
              engine_config_id:
                anyOf:
                  - allOf:
                      - $ref: '#/components/schemas/EngineConfigId'
                  - type: string
                    nullable: true
                    enum:
                      - null
              model:
                type: string
                maxLength: 255
              model_params:
                type: object
                nullable: true
                additionalProperties: true
              role_id:
                $ref: '#/components/schemas/RoleId'
              engine_prompt_mode:
                type: string
                enum:
                  - append
                  - replace
                default: append
              display_name:
                type: string
                maxLength: 255
              status:
                type: string
                enum:
                  - active
                  - disabled
                default: active
    AgentUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
              engine_config_id:
                anyOf:
                  - allOf:
                      - $ref: '#/components/schemas/EngineConfigId'
                  - type: string
                    nullable: true
                    enum:
                      - null
              model:
                type: string
                maxLength: 255
              model_params:
                type: object
                nullable: true
                additionalProperties: true
              role_id:
                $ref: '#/components/schemas/RoleId'
              engine_prompt_mode:
                type: string
                enum:
                  - append
                  - replace
              display_name:
                type: string
                maxLength: 255
              status:
                type: string
                enum:
                  - active
                  - disabled
    AgentCloneRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - new_name
            properties:
              new_name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
    MarketplaceUseRequest:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
    AgentProfileRequest:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AgentProfile'
              - type: object
                required:
                  - config
                additionalProperties: false
                properties:
                  config:
                    $ref: '#/components/schemas/AgentProfile'
    AgentProfilePatchRequest:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AgentProfilePatch'
              - type: object
                required:
                  - config
                additionalProperties: false
                properties:
                  config:
                    $ref: '#/components/schemas/AgentProfilePatch'
    PromptCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - prompt_type
              - name
              - content
            properties:
              prompt_type:
                type: string
                enum:
                  - system_prompt
                  - project_context
                  - instruction
              name:
                type: string
                minLength: 1
              content:
                type: string
                minLength: 1
                maxLength: 524288
              sort_order:
                type: integer
                default: 0
              replace_mode:
                type: boolean
                default: false
    PromptUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              prompt_type:
                type: string
                enum:
                  - system_prompt
                  - project_context
                  - instruction
              name:
                type: string
                minLength: 1
              content:
                type: string
                minLength: 1
                maxLength: 524288
              sort_order:
                type: integer
              replace_mode:
                type: boolean
    McpCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - type
              - config
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
              type:
                type: string
                enum:
                  - stdio
                  - http
                  - sse
              config:
                type: object
                additionalProperties: true
              env_variables:
                type: object
                additionalProperties: true
              allowed_tools:
                type: array
                items:
                  type: string
              timeout_ms:
                type: integer
                minimum: 0
              is_trusted:
                type: boolean
              is_enabled:
                type: boolean
              use_global_env:
                type: boolean
    McpUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
              type:
                type: string
                enum:
                  - stdio
                  - http
                  - sse
              config:
                type: object
                additionalProperties: true
              env_variables:
                type: object
                additionalProperties: true
              allowed_tools:
                type: array
                items:
                  type: string
              timeout_ms:
                type: integer
                minimum: 0
              is_trusted:
                type: boolean
              is_enabled:
                type: boolean
              use_global_env:
                type: boolean
    EnvCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,254}$
              value:
                type: string
                maxLength: 65535
              is_secret:
                type: boolean
                default: false
    EnvUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              key:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,254}$
              value:
                type: string
                maxLength: 65535
              is_secret:
                type: boolean
                description: Changing from true to false requires a new explicit value that is not the secret mask.
    EnvMutationRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - env_vars
            properties:
              env_vars:
                type: array
                items:
                  type: object
                  required:
                    - key
                  properties:
                    key:
                      type: string
                      pattern: ^[A-Z][A-Z0-9_]{0,254}$
                    value:
                      type: string
                      maxLength: 65535
                      description: Required for new and public env vars. For an existing secret env var that remains secret, omit it or send `***` to preserve the stored value.
                    is_secret:
                      type: boolean
                      default: false
    FileSetRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                maxLength: 65535
