        '403':
          $ref: '#/components/responses/TenantOwnerForbidden'
        '404':
          description: NOT_FOUND - tenant or workflow secret does not exist, or name does not match the route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Tenant
      operationId: delete_tenant_workflow_secrets_name
