              message: A required service is temporarily unavailable.
              details:
                - source: integrations
                  operation: dataSourceCatalogService.listKinds
    ProjectAccessDependencyError:
      description: |-
        Mandatory project dependencies failed (tenant access, tasks counts, services catalog). Codes: DEPENDENCY_CONFIGURATION_ERROR (port or
        mandatory method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid role, incomplete counts or catalog
        or undocumented owner 4xx), DEPENDENCY_FAILED (other owner failure).
        Individual project access is not checked after a lookup failure.
        Safe details identify source=tenant/tasks/services and the local port.method;
        technical context and debug are never published for these codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_CONTRACT_VIOLATION
              message: A required service returned an invalid response.
              details:
                - source: tenant
                  operation: tenantService.getMemberRole
    ProjectAccessDependencyUnavailable:
      description: |-
        DEPENDENCY_UNAVAILABLE: tenant access, tasks counts or services catalog signalled unavailability.
        The operation stops even if the user has explicit project access.
        Safe details identify source=tenant/tasks/services and the local port.method;
        technical context and debug are never published for this code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: A required service is temporarily unavailable.
              details:
                - source: tenant
                  operation: tenantService.getMemberRole
