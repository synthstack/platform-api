  /notifications/clear-read:
    post:
      summary: Delete read notifications
      description: Dismisses visible read notifications for the authenticated user and active tenant, retaining hidden tombstones until retention cleanup. No request body is required. Runs synchronously when the visible read count is at or below clear_read_sync_threshold (default 10000). Above the threshold it queues notifications.maintenance.clear_read and returns 202. Accepted responses acknowledge scheduling, not completion, and have no deleted_count. The worker clears rows that are read when it runs and publishes notification.bulk_updated with action clear_read. Refresh the inbox to reconcile completion; unread-count alone cannot confirm removal of read rows.
      operationId: notificationsClearRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Read notifications dismissed synchronously
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationClearReadDoneData'
                      meta:
                        $ref: '#/components/schemas/NotificationMutationMeta'
        '202':
          description: Clear-read maintenance accepted for asynchronous processing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
