  /tenant/billing/usage:
    get:
      tags:
        - Billing
      summary: Get compute-hours usage by project
      description: Aggregates negative charge operations over [from, to). Without custom bounds, uses the stored subscription period exposed as period.start and period.end by GET /tenant/billing. Custom bounds require from < to and at most 400 days (usage_max_range_days), and do not require a subscription. Timestamps must include seconds and a timezone; fractional seconds are accepted. Ledger timestamps have whole-second precision, so SQL comparisons round fractional bounds up to preserve the half-open range. Response period fields omit fractional seconds. Unfiltered rows are ordered by hours descending, then internal project ID; other contains positive usage for unattributed, missing, or soft-deleted projects.
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          description: Optional project filter. Returns exactly this project, including zero usage, and omits other. Missing, deleted, or foreign projects return 404.
          schema:
            $ref: '#/components/schemas/ProjectId'
        - name: from
          in: query
          description: Inclusive ISO 8601 range start. Must be provided together with to.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive ISO 8601 range end. Must be provided together with from.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Compute-hours consumption grouped by visible project, ordered by usage descending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BillingUsageResponseData'
                    required:
                      - data
        '401':
          $ref: '#/components/responses/BillingUnauthorized'
        '403':
          $ref: '#/components/responses/BillingTenantRoleForbidden'
        '404':
          $ref: '#/components/responses/BillingNotFound'
        '422':
          $ref: '#/components/responses/BillingValidationError'
        '502':
          $ref: '#/components/responses/BillingUpstreamUnavailable'
      operationId: get_tenant_billing_usage
  /bug-reports:
    post:
      operationId: submitBugReport
      tags:
        - Bug Reports
      summary: Submit a console bug report
      security:
        - bearerAuth: []
      description: 'Any authenticated console user may submit, including users without a tenant, with a suspended tenant or changed membership. No tenant checks. Send raw ZIP, not multipart/form-data or JWE. Exactly report.json and report.html are required; screenshot.jpg is optional. Actual inflated caps: JSON 1 MiB, HTML 1 MiB, JPEG 10 MiB, combined 12 MiB. No other entries, directories or duplicate names. report.html must be self-contained with inline resources. report.json requires integer schemaVersion=1 and string reportId equal to Idempotency-Key. Optional description, page.url and ISO 8601 createdAt become null on wrong types; description/page URL are truncated to 5000/2048 Unicode characters. The user block is ignored. Author/tenant come from authentication and profile snapshots from the server directory. Same key + user + SHA-256 returns the same ID; conflicts return 409. Interrupted pending uploads can be completed by replaying identical bytes. Every authenticated request consumes the per-user quota of 5 per calendar hour, including replays, validation errors and storage errors. A replay can receive 429 before idempotency processing; wait Retry-After and retry with unchanged key and body. Waiting does not reserve quota. Stored reports live for 90 days; pending reports can be pruned after 24 hours of inactivity, with an absolute 90-day retention for all statuses. Deleting reports return 503; after removal the same submission creates a new report/ID.'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/BugReportClientId'
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
              maxLength: 2000000
              description: Nonempty raw ZIP bytes. Content-Type must be exactly application/zip.
      responses:
        '200':
          description: Stored replay or successful pending recovery; same server ID.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BugReportReceipt'
                    required:
                      - data
        '201':
          description: New report fully stored; nonempty server ID.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BugReportReceipt'
                    required:
                      - data
        '401':
          description: Missing or invalid bearer token (UNAUTHORIZED / INVALID_TOKEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: 'BUG_REPORT_IDEMPOTENCY_CONFLICT: same key with another body or user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '413':
          description: 'BUG_REPORT_TOO_LARGE: body exceeds 2,000,000 bytes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: invalid/missing Idempotency-Key, wrong Content-Type or empty body. BUG_REPORT_ARCHIVE_INVALID: ZIP, composition, inflated limits, JSON or strict fields invalid. BUG_REPORT_ID_MISMATCH: reportId differs from the header.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: 'RATE_LIMIT_EXCEEDED: every authenticated attempt counts. Retry-After does not reserve next-window quota.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
          headers:
            Retry-After:
              description: Seconds until the current calendar window ends.
              schema:
                type: integer
                minimum: 1
        '503':
          description: 'BUG_REPORT_STORAGE_UNAVAILABLE: storage unavailable or not configured, storage timeout, incomplete/failing finalization, concurrent operation, expired report or deletion in progress. Retry identical bytes and key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /feedback:
    post:
      tags:
        - Feedback
      summary: Submit a public feedback message
      description: Public contact form. Captcha verification runs before feedback validation and requires cf-turnstile-response when CAPTCHA_ENABLED is true (the captcha manifest default). When captcha is disabled, the token may be omitted. The token field name is configurable in the captcha module. Contact fields are trimmed before validation; their length constraints describe the trimmed values. The message is stored verbatim. IP, User-Agent, and the creation timestamp come from the server; the captcha token and extra body fields are not persisted. The receipt contains only id, created_at, and an acknowledgement.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Trimmed before validation; must not be blank.
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: Trimmed before email and Unicode character length validation.
                company:
                  type: string
                  maxLength: 255
                  nullable: true
                  description: Trimmed; omitted, null, empty, or whitespace-only values are stored as null.
                phone:
                  type: string
                  maxLength: 50
                  nullable: true
                  anyOf:
                    - minLength: 5
                    - pattern: ^[ \t\n\r\u0000\u000b]*$
                  description: Trimmed; nonblank values must have 5 to 50 Unicode characters. Omitted, null, empty, or whitespace-only values are stored as null. No phone-number format validation is applied.
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  pattern: '[^ \t\n\r\u0000\u000b]'
                  description: Stored verbatim, but must not be blank after PHP trim(). The default maximum is 5000 Unicode characters, controlled by feedback_message_max_length in the feedback manifest.
                cf-turnstile-response:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Cloudflare Turnstile token from the client widget. Required only when captcha is enabled (enabled by default); must not be blank. The provider token length limit is 4096 bytes.
              required:
                - name
                - email
                - message
            example:
              name: Jane Doe
              email: jane@example.com
              company: null
              phone: null
              message: Please contact me about your service.
              cf-turnstile-response: <token-from-the-client-widget>
      responses:
        '201':
          description: Feedback message accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
