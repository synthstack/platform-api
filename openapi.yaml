      additionalProperties: false
      properties:
        timeout:
          type: integer
          nullable: true
          minimum: 60
          maximum: 86400
        git_operations:
          type: boolean
          nullable: true
        ci_services:
          type: boolean
          nullable: true
        diff_patterns:
          type: string
          nullable: true
          enum:
            - raw
            - frontend
            - backend
            - all
        diff_max_file_lines:
          type: integer
          nullable: true
          minimum: 0
        diff_max_file_size:
          type: integer
          nullable: true
          minimum: 0
        diff_exclude_tests:
          type: boolean
          nullable: true
        diff_exclude_locks:
          type: boolean
          nullable: true
        diff_exclude_generated:
          type: boolean
          nullable: true
        diff_custom_exclude:
          type: string
          nullable: true
          maxLength: 2000
        iteration_strategy:
          type: string
          nullable: true
          enum:
            - inline
            - reference
        iteration_max_lines:
          type: integer
          nullable: true
          minimum: 0
        iteration_max_size:
          type: integer
          nullable: true
          minimum: 0
        work_dir:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
          pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$))(?!.*[\\\r\n\u0000]).+$
          description: Relative working directory. Use null to remove it. Must not be empty, absolute, contain backslashes, line breaks, NUL bytes, or '..' path segments.
        task_context:
          type: object
          nullable: true
          additionalProperties: false
          properties:
