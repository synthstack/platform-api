    BugReportId:
      type: string
      pattern: ^bgr_[a-zA-Z0-9]{6,}$
      example: bgr_aB3xYz
      description: Opaque server ID from idEncode, prefix bgr. Use an ID returned by the API.
    BugReportClientId:
      type: string
      pattern: ^br-\d{13,16}-[0-9a-f]{32}$
      description: Client idempotency key; report.json.reportId must match exactly.
    BugReportReceipt:
