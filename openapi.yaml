  responses:
    ProjectAgentServiceForbidden:
      description: 'Tenant middleware rejected the request: TENANT_REQUIRED for missing tenant context, TENANT_INACTIVE for an inactive tenant, or FORBIDDEN when the token tenant does not match the current membership. Denied project access returns 404 PROJECT_NOT_FOUND.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentServiceForbidden:
      description: 'Owner contour and clone: member receives FORBIDDEN for another creator or a read-only agent; owner/admin/superadmin receives AGENT_NOT_EDITABLE on a read-only connection. Applies to reading and writing. Missing tenant context uses tenant middleware errors.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentServiceNotFound:
      description: AGENT_NOT_FOUND, ASSIGNMENT_NOT_FOUND, PROJECT_NOT_FOUND (including denied project membership), AGENT_SERVICE_DECLARATION_NOT_FOUND for a declaration outside the resolved scope, or NOT_FOUND for malformed or wrong-entity opaque IDs. An owner deleted before a protected write also returns 404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentServiceConflict:
      description: 'AGENT_SERVICE_DECLARATION_CONFLICT: alias already exists in this scope or the scope limit (default 32) is reached.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentServiceInvalid:
      description: VALIDATION_ERROR for invalid request structure, non-object params, alias pattern or expressions ${{ in env keys/values. SERVICE_DECLARATION_INVALID for version, catalog availability (including concurrent catalog deletion), env structure/identity, immutable bindings, generated values, invalid masks or options literals. details[].field is a JSON-pointer rooted at the request body; unavailable catalog entry points to /service_catalog_entry_id. Error details never include secrets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentServiceDependencyFailure:
      description: 'DEPENDENCY_CONTRACT_VIOLATION: catalog port returned an invalid projection, including an unmasked secret default.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    ProjectAgentServiceDependencyFailure:
      description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED during project access (source tenant, operation tenantService.getMemberRole), or DEPENDENCY_CONTRACT_VIOLATION for an invalid service-catalog projection. Public details contain dependency identifiers only, never secrets or upstream payloads.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentProjectAccessDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Project access uses source tenant, operation tenantService.getMemberRole. A failed lookup stops the request before agent configuration is read or changed. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentProjectAccessDependencyFailure:
      description: DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid result or undocumented owner 4xx), or DEPENDENCY_FAILED (other owner failure). Project access uses source tenant, operation tenantService.getMemberRole. A failed lookup stops the request before agent configuration is read or changed. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentUnauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentBaseScopeReadForbidden:
      description: AGENT_BASE_SCOPE_RESTRICTED for non-superadmins when the organization is not gov or the tenant-agent connection is read-only (marketplace). Gov members may read editable base configuration regardless of creator. Superadmins retain read access. Existing tenant middleware errors (TENANT_REQUIRED, TENANT_INACTIVE, FORBIDDEN) still apply.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentBaseScopeMutationForbidden:
      description: Existing mutation checks run first, including for GET service declarations. Members receive FORBIDDEN for another creator or a read-only connection; owner/admin/superadmin receive AGENT_NOT_EDITABLE for a read-only connection. Then non-superadmins of a non-gov organization receive AGENT_BASE_SCOPE_RESTRICTED. Superadmins bypass only the gov check. Existing tenant middleware errors (TENANT_REQUIRED, TENANT_INACTIVE, FORBIDDEN) still apply.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentForbidden:
      description: FORBIDDEN for insufficient permissions, AGENT_NOT_EDITABLE for protected base configuration, or tenant middleware errors (TENANT_REQUIRED, TENANT_INACTIVE, FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentNotFound:
      description: Resource missing or inaccessible in the current scope. Codes include AGENT_NOT_FOUND, ENGINE_NOT_FOUND, ENGINE_CONFIG_NOT_FOUND, MODEL_NOT_FOUND, ENGINE_MODEL_NOT_FOUND, ENGINE_MODEL_PROMPT_NOT_FOUND, FALLBACK_PROMPT_NOT_SET, ROLE_NOT_FOUND, PLATFORM_PROMPT_NOT_FOUND, PROJECT_NOT_FOUND, ASSIGNMENT_NOT_FOUND, PROMPT_NOT_FOUND, MCP_NOT_FOUND, ENV_NOT_FOUND, FILE_NOT_FOUND and MARKETPLACE_NOT_FOUND. Invalid encoded path IDs return NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentOrSkillNotFound:
      description: Agent is unavailable to the tenant (`AGENT_NOT_FOUND`) or skill is unavailable (`SKILL_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentOrSkillNotFoundErrorResponse'
    AgentSkillConflict:
      description: A requested skill name conflicts with another skill attached to the agent (`SKILL_NAME_CONFLICT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentSkillNameConflictErrorResponse'
    AgentSkillUnavailable:
      description: SKILL_LIBRARY_UNAVAILABLE for a failed skill-library call, or SKILL_DOWNLOAD_UNAVAILABLE when the download signer fails.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentConflict:
      description: AGENT_NAME_CONFLICT, AGENT_ALREADY_CONNECTED, ENGINE_MODEL_ALREADY_EXISTS, VARIANT_SLUG_DUPLICATE, SKILL_NAME_CONFLICT, or DUPLICATE_KEY for a duplicate prompt, MCP server or ENV key, depending on the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AgentValidationError:
      description: VALIDATION_ERROR for invalid input or configuration, QUOTA_EXCEEDED for the tenant agent quota, LIMIT_EXCEEDED for prompt/MCP/ENV scope limits, ROLE_INACTIVE, ROLE_SLUG_EXISTS, ROLE_IN_USE, PLATFORM_PROMPT_TYPE_EXISTS, or SKILL_LIMIT_EXCEEDED, depending on the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AuthBearerDependencyUnavailable:
      description: idEncode access token claim decoding is temporarily unavailable during bearer verification (DEPENDENCY_UNAVAILABLE); no authentication context is established
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AuthBearerDependencyFailure:
      description: idEncode port configuration, response contract or invocation failed during bearer verification (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED); only details source idEncode and operation idEncodeService.decodeExternalId are public
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AutomationDependencyFailure:
      description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup). Task access first requires source tasks, operation taskAutomationPort.getTask. Invalid or mismatched snapshots fail without being treated as a missing task. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AutomationDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup). Task access first requires source tasks, operation taskAutomationPort.getTask. Invalid or mismatched snapshots fail without being treated as a missing task. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AutomationDependencyTargetsFailure:
      description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup). Rule create/update also requires source agent, operation assignmentService.listByProject. Task access first requires source tasks, operation taskAutomationPort.getTask. Invalid or mismatched snapshots fail without being treated as a missing task. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AutomationDependencyTargetsUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup). Rule create/update also requires source agent, operation assignmentService.listByProject. Task access first requires source tasks, operation taskAutomationPort.getTask. Invalid or mismatched snapshots fail without being treated as a missing task. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AutomationUnauthorized:
      description: UNAUTHORIZED. A Bearer access token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AutomationForbidden:
      description: TENANT_REQUIRED for missing tenant context, TENANT_INACTIVE for an inactive tenant, or FORBIDDEN when the token tenant does not match current membership.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    AutomationNotFound:
      description: TASK_NOT_FOUND for a missing task, PROJECT_NOT_FOUND for a missing or inaccessible project, or NOT_FOUND for an invalid external ID (including raw numeric IDs, wrong entity prefixes and malformed rule IDs). A missing task returns TASK_NOT_FOUND with message "Task not found" and no error.details. A task without saved automation returns the default representation with HTTP 200.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          examples:
            taskNotFound:
              value:
                status: error
                error:
                  code: TASK_NOT_FOUND
                  message: Task not found
    AutomationValidationError:
      description: VALIDATION_ERROR with field-level details for invalid PUT input, unknown fields, duplicate rule IDs, rule IDs belonging to another task or exceeded configured limits. AUTOMATION_AGENTS_NOT_IN_PROJECT means a source or target agent is not active in the task project; details include field, message and agent_ids (encoded AgentId values). Field paths use rules.<index>.<field> for nested errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BillingUnauthorized:
      description: UNAUTHORIZED for a missing/malformed Authorization header, or INVALID_TOKEN for an invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BillingTenantRoleForbidden:
      description: FORBIDDEN for insufficient role or mismatched membership, TENANT_INACTIVE for an inactive tenant, or TENANT_REQUIRED when tenant context is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BillingNotFound:
      description: PLAN_NOT_FOUND, SUBSCRIPTION_NOT_FOUND, PROJECT_NOT_FOUND, or NOT_FOUND (requested tenant or invalid opaque identifier), depending on the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BillingValidationError:
      description: VALIDATION_ERROR for invalid input or plan state, or PLAN_INACTIVE when selecting an inactive plan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BillingUpstreamUnavailable:
      description: PROJECT_DIRECTORY_UNAVAILABLE - projectService.getDirectoryEntry or projectService.getDirectoryEntries failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    NotificationDependencyError:
      description: Authentication dependency failure (500 DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, or DEPENDENCY_FAILED). Public details identify source idEncode and operation idEncodeService.decodeExternalId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    NotificationDependencyUnavailable:
      description: Authentication dependency temporarily unavailable (503 DEPENDENCY_UNAVAILABLE). Public details identify source idEncode and operation idEncodeService.decodeExternalId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    OAuthRawServerError:
      description: 'Raw server_error protocol response; no canonical envelope, dependency details or debug data. Cache-Control: no-store and Pragma: no-cache.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthProtocolError'
    ProjectDataSourceCatalogDependencyError:
      description: |-
        DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION
        (catalog is not a nonempty list of unique slug strings, or an undocumented owner 4xx),
        or DEPENDENCY_FAILED (other owner failure). Public details contain only source=integrations
        and operation=dataSourceCatalogService.listKinds; owner messages and debug context are omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_CONTRACT_VIOLATION
              message: A required service returned an invalid response.
              details:
                - source: integrations
                  operation: dataSourceCatalogService.listKinds
    ProjectDataSourceCatalogDependencyUnavailable:
      description: |-
        DEPENDENCY_UNAVAILABLE: the integrations kind catalog signalled unavailability.
        Public details contain only source=integrations and operation=dataSourceCatalogService.listKinds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: A required service is temporarily unavailable.
              details:
                - source: integrations
                  operation: dataSourceCatalogService.listKinds
    ProjectAccessDependencyError:
      description: |-
        Mandatory project dependencies failed (tenant access or task counts). Codes: DEPENDENCY_CONFIGURATION_ERROR (port or
        mandatory method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid role or incomplete counts
        or undocumented owner 4xx), DEPENDENCY_FAILED (other owner failure).
        Individual project access is not checked after a lookup failure.
        Safe details identify source=tenant/tasks and operation=tenantService.getMemberRole,
        taskService.activeCountByProject or taskService.activeCountsByProjects;
        technical context and debug are never published for these codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_CONTRACT_VIOLATION
              message: A required service returned an invalid response.
              details:
                - source: tenant
                  operation: tenantService.getMemberRole
    ProjectAccessDependencyUnavailable:
      description: |-
        DEPENDENCY_UNAVAILABLE: tenant access or task counts signalled unavailability.
        The operation stops even if the user has explicit project access.
        Safe details identify source=tenant/tasks and operation=tenantService.getMemberRole,
        taskService.activeCountByProject or taskService.activeCountsByProjects;
        technical context and debug are never published for this code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: A required service is temporarily unavailable.
              details:
                - source: tenant
                  operation: tenantService.getMemberRole
    ProjectServiceCatalogDependencyError:
      description: |-
        Mandatory service catalog lookup failed. Codes: DEPENDENCY_CONFIGURATION_ERROR
        (port or mandatory method unavailable), DEPENDENCY_CONTRACT_VIOLATION
        (invalid catalog response or undocumented owner 4xx), DEPENDENCY_FAILED
        (other owner failure). Safe details identify source=services and
        operation=serviceCatalogService.getActive, get, describeMany or describeManyForHttp. Technical context and debug are never published.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_CONTRACT_VIOLATION
              message: A required service returned an invalid response.
              details:
                - source: services
                  operation: serviceCatalogService.getActive
    ProjectServiceCatalogDependencyUnavailable:
      description: |-
        DEPENDENCY_UNAVAILABLE: the mandatory service catalog lookup signalled unavailability.
        Safe details identify source=services and the failed serviceCatalogService operation (getActive, get, describeMany or describeManyForHttp).
        Technical context and debug are never published.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: A required service is temporarily unavailable.
              details:
                - source: services
                  operation: serviceCatalogService.getActive
    SkillsUnauthorized:
      description: 'UNAUTHORIZED or INVALID_TOKEN: bearer access token is missing, malformed, invalid, or expired.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    SkillsForbidden:
      description: 'TENANT_REQUIRED, TENANT_INACTIVE, or FORBIDDEN: no tenant membership, an inactive tenant, or a mismatch between the token tenant and current membership.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    SkillsNotFound:
      description: SKILL_NOT_FOUND when the skill is absent from the caller's tenant library; NOT_FOUND when the external skill ID cannot be decoded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    SkillsValidationError:
      description: VALIDATION_ERROR for multipart upload input (including file size, extension, detected MIME, and ZIP signature), with field/message details. SKILL_ARCHIVE_INVALID for archive or frontmatter validation, with code/message details. SKILL_MD_NOT_FOUND means that a case-sensitive SKILL.md was found neither at the archive root nor directly inside its only visible top-level directory. TOO_MANY_FILES covers both file and total entry limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SkillUnprocessableErrorResponse'
    SkillsQueryValidationError:
      description: 'VALIDATION_ERROR: trimmed q exceeds 255 characters or sort is neither recent nor usage.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SkillQueryValidationErrorResponse'
    SkillsRateLimited:
      description: 'RATE_LIMIT_EXCEEDED: per-user upload quota exceeded (default 10 requests per 60 seconds).'
      headers:
        Retry-After:
          description: Seconds before retrying the request.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: Configured upload quota for the window.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Remaining requests in the exhausted window.
          schema:
            type: integer
            enum:
              - 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    SkillsUnavailable:
      description: STORAGE_UNAVAILABLE for missing/invalid storage configuration, a failed storage request, or an object mutex still busy after upload retries. RATE_LIMIT_UNAVAILABLE when the rate limiter backend is unavailable and configured to fail closed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    SkillsInternalError:
      description: Internal processing or database failure (INTERNAL_ERROR for skill upload processing). Upload rate-limit configuration failures use RATE_LIMIT_CONFIGURATION_ERROR.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksChangesNotFound:
      description: CHANGES_NOT_AVAILABLE when Git Mirror rejects the request and no applicable fallback exists; TASK_NOT_FOUND or PROJECT_NOT_FOUND for an absent task or project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksChangesDependencyError:
      description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Git Mirror configuration, contract or failed reads retain their original HTTP 500 code when fallback is absent or artifact storage prevents retrieval. Public details contain source runners and operation gitMirrorControlService.getDiff. Required directory failures may use source agent or projects, operation agentService.describeMany, assignmentService.listByProject or projectService.get. Public details[].source/operation contain only local identifiers. Owner messages, internal classes, traces and debug metadata are omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksChangesUnavailable:
      description: GIT_MIRROR_UNAVAILABLE when Git Mirror is temporarily unavailable and no fallback exists. Also returned when artifact storage fails while retrieving an existing fallback after a temporary mirror failure or confirmed mirror project, repository or commit absence. Storage failure messages and causes are not exposed. Public dependency details contain source runners and operation gitMirrorControlService.getDiff. DEPENDENCY_UNAVAILABLE may also originate in the required directory lookup, source agent or projects, operation agentService.describeMany, assignmentService.listByProject or projectService.get. Public details[].source/operation contain only local identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksDirectoryDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Required directory lookup failed; source agent or projects, operation agentService.describeMany, assignmentService.listByProject or projectService.get. No partial list or incomplete context is returned. Public details[].source/operation contain only these local identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksDirectoryDependencyError:
      description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Required directory lookup failed; source agent or projects, operation agentService.describeMany, assignmentService.listByProject or projectService.get. Malformed results never mean absence. Public details[].source/operation contain only these local identifiers; provider text and debug are omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksSnapshotDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Project activity snapshot lookup via projectService.getIncludingDeleted is classified locally with source projects, operation projectService.getIncludingDeleted. A confirmed missing project may omit enrichment; dependency failures stop the operation. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksSnapshotDependencyError:
      description: DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid result or undocumented owner 4xx), or DEPENDENCY_FAILED (other owner failure). Project activity snapshot lookup is classified locally with source projects, operation projectService.getIncludingDeleted. A confirmed missing project may omit enrichment; dependency failures stop the operation. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksProjectDependencyError:
      description: DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid result or undocumented owner 4xx), or DEPENDENCY_FAILED (other owner failure). Required project resolution through projectService.get or project access failed. Local details[].source/operation use projects and projectService.get or the invoked projectService access method. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksProjectDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Required project resolution through projectService.get or project access failed. Local details[].source/operation use projects and projectService.get or the invoked projectService access method. Public details contain only source and operation; no upstream payload or debug metadata is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksUnauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksForbidden:
      description: Forbidden or tenant context required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksNotFound:
      description: Task, project, assignment, execution, artifact, label, or publication not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksConflict:
      description: Conflict or illegal task state transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksGitRetentionConflict:
      description: 'Conflict or illegal task state transition. Git retention admission may return GIT_RETENTION_RESOURCE_BUSY when a resource lock is held or a NOWAIT read encounters contention (Retry-After: 1), or GIT_RETENTION_CLEANUP_UNRESOLVED when an admitted destructive DELETE has no confirmed lifetime closure (Retry-After: 1 for pending cleanup, 60 for an ambiguous blocker). The latter includes blocking_target_id and blocking_pin_id in details. Ambiguous cleanup requires operator reconciliation and may block indefinitely; Retry-After is a retry delay, not a resolution deadline. These retention codes defer admission and require retrying the complete request.'
      headers:
        Retry-After:
          description: Seconds before retrying retention admission; absent for unrelated conflicts.
          schema:
            type: integer
            enum:
              - 1
              - 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksExecutionStartRejected:
      description: Validation error, SUBSCRIPTION_REQUIRED (billing confirmed no subscription), or COMPUTE_HOURS_EXHAUSTED (billing denied the launch). When launching executions, the operation is rolled back without creating executions or consuming task counters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          examples:
            subscriptionRequired:
              value:
                status: error
                error:
                  code: SUBSCRIPTION_REQUIRED
                  message: A subscription is required to start an execution.
            computeHoursExhausted:
              value:
                status: error
                error:
                  code: COMPUTE_HOURS_EXHAUSTED
                  message: Compute hours are exhausted
    TasksBillingDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Execution-start checks require billingEnforcementService.checkExecutionStart (source billing); a billing failure rolls back the launch transaction without creating executions or consuming task counters. Source metadata/default-branch lookups may also fail (source projects or integrations), and legacy automation setup may fail while resolving project agents (source agent, assignmentService.listByProject). Project lookup via projectService.get and activity snapshots use local source projects and the invoked projectService method. Failed lookups are not cached. Public details contain only source and operation; no upstream payload or debug metadata is returned. Local details[].source/operation identify projects and the invoked projectService method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: A required service is temporarily unavailable.
              details:
                - source: billing
                  operation: billingEnforcementService.checkExecutionStart
    TasksBillingDependencyError:
      description: DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid result or undocumented owner 4xx), or DEPENDENCY_FAILED (other owner failure). Execution-start checks require billingEnforcementService.checkExecutionStart (source billing); a billing failure rolls back the launch transaction without creating executions or consuming task counters. Source metadata/default-branch lookups may also fail (source projects or integrations), and legacy automation setup may fail while resolving project agents (source agent, assignmentService.listByProject). Project lookup via projectService.get and activity snapshots use source projects and the invoked projectService method. Failed lookups are not cached. Public details contain only source and operation; no upstream payload or debug metadata is returned. Local details[].source/operation identify projects and the invoked projectService method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
          example:
            status: error
            error:
              code: DEPENDENCY_CONTRACT_VIOLATION
              message: A required service returned an invalid response.
              details:
                - source: billing
                  operation: billingEnforcementService.checkExecutionStart
    TasksRateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the request can be retried.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: Configured requests per rate-limit window.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          description: Requests remaining in the current rate-limit window.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksServiceUnavailable:
      description: Required storage, backend service or request guard is unavailable (for example ARTIFACT_STORAGE_NOT_CONFIGURED). Authenticated operations that resolve project access through projectService.get can also return DEPENDENCY_UNAVAILABLE from projects; details[].source/operation use source projects and the invoked projectService method. Public share-link downloads do not perform that project access lookup.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TasksInternalError:
      description: Internal configuration or processing error. Authenticated share-link creation can also fail during project access with DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED; in that case details[].source/operation use source projects and the invoked projectService method; debug is omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesDependencyFailure:
      description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Project resolution (projectService.get / canAccess) can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup). Only routes that resolve a project can return this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesDependencyUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Project resolution (projectService.get / canAccess) can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup). Only routes that resolve a project can return this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesBadRequest:
      description: Invalid JSON request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesUnauthorized:
      description: UNAUTHORIZED. Missing, malformed or expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesForbidden:
      description: TENANT_REQUIRED (no active tenant membership), TENANT_INACTIVE or FORBIDDEN (token tenant does not match the current membership).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesTaskTemplateWriteForbidden:
      description: FORBIDDEN (tenant role owner or admin required), TENANT_REQUIRED (no active tenant membership), TENANT_INACTIVE or FORBIDDEN (token tenant does not match the current membership).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesProjectNotFound:
      description: PROJECT_NOT_FOUND (project missing, archived or not accessible to the caller; access denial is masked as not found) or NOT_FOUND (malformed encoded identifier).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesEditorTemplateNotFound:
      description: TEMPLATE_NOT_FOUND (template missing, in another tenant or owned by another user) or NOT_FOUND (malformed encoded identifier).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesTaskTemplateNotFound:
      description: TASK_TEMPLATE_NOT_FOUND (template missing or in another tenant), PROJECT_NOT_FOUND (the template's project is missing, archived or not accessible to the caller) or NOT_FOUND (malformed encoded identifier).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesEditorTemplateConflict:
      description: TEMPLATE_NAME_CONFLICT. Another editor template of the same user in this project has the same name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesTaskTemplateConflict:
      description: TASK_TEMPLATE_NAME_CONFLICT. Another task template in this project has the same name (case-insensitive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesValidationError:
      description: VALIDATION_ERROR with error.details[] = {field, message}.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesEditorTemplateCreateValidationError:
      description: VALIDATION_ERROR with error.details[] = {field, message}, or TEMPLATE_LIMIT_EXCEEDED when the user already has config max_templates_per_project_user editor templates in this project (error.details.max_templates_per_project_user).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TemplatesTaskTemplateCreateValidationError:
      description: VALIDATION_ERROR with error.details[] = {field, message}, or TASK_TEMPLATE_LIMIT_EXCEEDED when the project already has config max_task_templates_per_project task templates (error.details.max_task_templates_per_project).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TenantOwnerUnauthorized:
      description: UNAUTHORIZED (missing or malformed Bearer authorization) or INVALID_TOKEN (invalid or expired token), as rendered by auth.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TenantOwnerForbidden:
      description: TENANT_REQUIRED when membership or tenant context is missing (including superadmins), TENANT_INACTIVE when the tenant is not active, or FORBIDDEN when tenant role is not owner or the token tenant does not match current membership. Superadmin status neither grants nor removes owner access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    TenantWorkflowSecretVaultFailure:
      description: WORKFLOW_SECRET_VAULT_ERROR - encryption key is blank or encryption failed; no plaintext is stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
  requestBodies:
    AgentCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - engine_id
              - model
              - role_id
              - display_name
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
              engine_id:
                $ref: '#/components/schemas/EngineId'
              engine_config_id:
                anyOf:
                  - allOf:
                      - $ref: '#/components/schemas/EngineConfigId'
                  - type: string
                    nullable: true
                    enum:
                      - null
              model:
                type: string
                maxLength: 255
              runtime:
                type: string
                minLength: 1
                maxLength: 64
                description: Runtime from GET /projects/runtimes. Trimmed and nonempty; omission leaves it unset. Unsupported values return VALIDATION_ERROR with runtime field details listing supported values.
              model_params:
                type: object
                nullable: true
                additionalProperties: true
              role_id:
                $ref: '#/components/schemas/RoleId'
              engine_prompt_mode:
                type: string
                enum:
                  - append
                  - replace
                default: append
              display_name:
                type: string
                maxLength: 255
              status:
                type: string
                enum:
                  - active
                  - disabled
                default: active
    AgentUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            description: Name and engine are immutable. At least one mutable field is required; resubmitting only the existing name still returns 422.
            anyOf:
              - required:
                  - engine_config_id
              - required:
                  - model
              - required:
                  - runtime
              - required:
                  - model_params
              - required:
                  - role_id
              - required:
                  - engine_prompt_mode
              - required:
                  - display_name
              - required:
                  - status
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
              engine_config_id:
                anyOf:
                  - allOf:
                      - $ref: '#/components/schemas/EngineConfigId'
                  - type: string
                    nullable: true
                    enum:
                      - null
              model:
                type: string
                maxLength: 255
              runtime:
                type: string
                nullable: true
                minLength: 1
                maxLength: 64
                description: Base runtime from GET /projects/runtimes. Trimmed and nonempty; explicit null clears it, omission preserves it. No tenant or project overrides.
              model_params:
                type: object
                nullable: true
                additionalProperties: true
              role_id:
                $ref: '#/components/schemas/RoleId'
              engine_prompt_mode:
                type: string
                enum:
                  - append
                  - replace
              display_name:
                type: string
                maxLength: 255
              status:
                type: string
                enum:
                  - active
                  - disabled
    AgentCloneRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - new_name
            properties:
              new_name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
    MarketplaceUseRequest:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[a-z][a-z0-9-]*$
    AgentProfileRequest:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AgentProfile'
              - type: object
                required:
                  - config
                additionalProperties: false
                properties:
                  config:
                    $ref: '#/components/schemas/AgentProfile'
    AgentProfilePatchRequest:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AgentProfilePatch'
              - type: object
                required:
                  - config
                additionalProperties: false
                properties:
                  config:
                    $ref: '#/components/schemas/AgentProfilePatch'
    PromptCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - prompt_type
              - name
              - content
            properties:
              prompt_type:
                type: string
                enum:
                  - system_prompt
                  - project_context
                  - instruction
              name:
                type: string
                minLength: 1
              content:
                type: string
                minLength: 1
                maxLength: 524288
                description: Must contain non-whitespace content. Limited by max_prompt_content_size (default 524288 bytes, measured before trimming).
              sort_order:
                type: integer
                default: 0
              replace_mode:
                type: boolean
                default: false
    PromptUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              prompt_type:
                type: string
                enum:
                  - system_prompt
                  - project_context
                  - instruction
              name:
                type: string
                minLength: 1
              content:
                type: string
                minLength: 1
                maxLength: 524288
                description: Must contain non-whitespace content. Limited by max_prompt_content_size (default 524288 bytes, measured before trimming).
              sort_order:
                type: integer
              replace_mode:
                type: boolean
    McpCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - type
              - config
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
              type:
                type: string
                enum:
                  - stdio
                  - http
                  - sse
              config:
                description: stdio requires a nonempty command; http/sse require a valid url. PATCH validates these fields whenever type is supplied. Encoded JSON is limited by max_mcp_config_size (default 65535 bytes).
                type: object
                additionalProperties: true
              env_variables:
                $ref: '#/components/schemas/AgentMcpEnvVariables'
              allowed_tools:
                type: array
                items:
                  type: string
              timeout_ms:
                type: integer
                minimum: 0
              is_trusted:
                type: boolean
              is_enabled:
                type: boolean
              use_global_env:
                type: boolean
    McpUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
              type:
                type: string
                enum:
                  - stdio
                  - http
                  - sse
              config:
                description: stdio requires a nonempty command; http/sse require a valid url. PATCH validates these fields whenever type is supplied. Encoded JSON is limited by max_mcp_config_size (default 65535 bytes).
                type: object
                additionalProperties: true
              env_variables:
                $ref: '#/components/schemas/AgentMcpEnvVariables'
              allowed_tools:
                type: array
                items:
                  type: string
              timeout_ms:
                type: integer
                minimum: 0
              is_trusted:
                type: boolean
              is_enabled:
                type: boolean
              use_global_env:
                type: boolean
    EnvCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,254}$
              value:
                type: string
                maxLength: 65535
                description: Limited by max_env_value_size (default 65535 bytes).
              is_secret:
                type: boolean
                default: false
    EnvUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              key:
                type: string
                pattern: ^[A-Z][A-Z0-9_]{0,254}$
              value:
                type: string
                maxLength: 65535
                description: Limited by max_env_value_size (default 65535 bytes). Omit or send *** to preserve an existing secret value.
              is_secret:
                type: boolean
                description: Changing from true to false requires a new explicit value that is not the secret mask.
    EnvMutationRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - env_vars
            properties:
              env_vars:
                type: array
                maxItems: 100
                description: Full replacement within this scope; limited by max_env_vars_per_scope (default 100).
                items:
                  type: object
                  required:
                    - key
                  properties:
                    key:
                      type: string
                      pattern: ^[A-Z][A-Z0-9_]{0,254}$
                    value:
                      type: string
                      maxLength: 65535
                      description: Limited by max_env_value_size (default 65535 bytes). Required for new and public env vars. For an existing secret env var that remains secret, omit it or send `***` to preserve the stored value.
                    is_secret:
                      type: boolean
                      default: false
    FileSetRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                maxLength: 65535
                description: Limited in bytes by max_script_size or max_runtime_ignore_size (both default 65535). Empty content is accepted only for runtime_ignore.
