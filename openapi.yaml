              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/AgentId'
          required:
            - type
            - agent_ids
      description: Server-owned conversation branch membership, independent of actor and executor. Task lifecycle and unlinked events are task-scoped. Comments inherit the union of triggered iteration owners (or their execution agents when owner is null). Other linked events inherit the iteration owner; ownerless execution and publication events use the private activity agent snapshot, while iteration-level events include all execution agents even for unknown kinds with an author or payload agent snapshot. An ownerless publication without a definite result agent is task-scoped, including mixed-agent file sets from a broadcast iteration; it never inherits all executors. A proven shared iteration owner still takes precedence. A snapshot alone does not imply an execution link. Immutable write-time envelope facts survive parent iteration/execution/agent deletion, so fixed task/agent classification remains stable. Only comment and broadcast memberships are live. There is no pending scope. Removed executors have no UI tab.
    TaskActivityResponseData:
      allOf:
        - $ref: '#/components/schemas/TaskActivityBaseData'
        - type: object
          properties:
            id: {}
            seq:
              type: integer
              minimum: 1
              nullable: false
            iteration_id: {}
            execution_id: {}
            actor_type: {}
            actor_id: {}
            kind: {}
            body: {}
            payload: {}
            created_at: {}
            timeline_scope:
              $ref: '#/components/schemas/TaskTimelineScope'
          required:
            - timeline_scope
          additionalProperties: false
          oneOf:
            - properties:
                kind:
                  enum:
                    - user_comment
                    - agent_message
                body:
                  type: string
            - properties:
                kind:
                  not:
                    enum:
                      - user_comment
                      - agent_message
