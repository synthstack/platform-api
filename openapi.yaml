  /auth/me:
    get:
      summary: Get current user
      description: Get current user profile with tenant information
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthCurrentUserResponseData'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: get_auth_me
    patch:
      summary: Update profile
      description: Update user profile information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required:
                    - full_name
                - required:
                    - prefer_lang
              properties:
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Jane Doe
                prefer_lang:
                  type: string
                  enum:
                    - en
                    - ru
                    - uk
                    - zh
                  description: Preferred locale used for email notifications.
                  example: uk
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthCurrentUserResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: patch_auth_me
  /auth/me/2fa:
    get:
      summary: Get current user's two-factor authentication status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current TOTP enrollment status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTwoFactorStatusResponseData'
                    required:
                      - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: get_auth_me_2fa
      description: Get current user's two-factor authentication status
  /auth/me/2fa/setup:
    post:
      summary: Start or restart TOTP enrollment
      description: Re-authenticates with the current password and returns the secret exactly once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - password
      responses:
        '200':
          description: Pending TOTP secret created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTwoFactorSetupResponseData'
                    required:
                      - data
        '401':
          description: Unauthorized or password is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: TOTP is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: TOTP encryption configuration is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_me_2fa_setup
  /auth/me/2fa/confirm:
    post:
      summary: Confirm and activate TOTP enrollment
      description: Revokes every refresh session, then issues a new JWT pair for the current device. Tenant membership is resolved outside the database transaction, before checking the account, pending credential and confirmation code under lock. A tenant dependency failure preserves existing sessions and pending enrollment. Tenant errors expose only details[].source=tenant and details[].operation=tenantService.getByUserId; technical context and debug are omitted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  $ref: '#/components/schemas/AuthTotpCode'
              required:
                - code
      responses:
        '200':
          description: TOTP enabled and replacement JWT pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTwoFactorConfirmResponseData'
                    required:
                      - data
        '401':
          description: TOTP code is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: TOTP is already active or pending setup is missing/expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: TOTP secret decryption or internal 2FA processing failed (TWOFA_INTERNAL_ERROR); Tenant port configuration, response contract or invocation failed (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Tenant membership is temporarily unavailable (DEPENDENCY_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_me_2fa_confirm
  /auth/me/2fa/disable:
    post:
      summary: Disable TOTP using the current password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - password
      responses:
        '200':
          description: Active TOTP is disabled or a pending setup is cancelled, without revoking sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTwoFactorDisableResponseData'
                    required:
                      - data
        '401':
          description: Unauthorized or password is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: TOTP setup does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_me_2fa_disable
      description: Disable TOTP using the current password
  /auth/me/password:
