        Idempotently register one addressable data source for an integration. Requires tenant owner/admin or a superadmin with tenant context. When backend lookup is needed, only a successful null result permits manual registration with the existing kind validation. Dependency failure or an invalid descriptor returns 500/503 before creating the data source or publishing events; documented credential/resource rejections return 422. Backend metadata is checked against payload_shape before merging; invalid keys, excessive depth, key count, value length or total size produce DEPENDENCY_CONTRACT_VIOLATION (500). Client metadata retains VALIDATION_ERROR/INTEGRATION_PAYLOAD_TOO_LARGE (422). Known getDataSource credential rejections (FORGEJO_TOKEN_INVALID/401, FORGEJO_TOKEN_SCOPE_INSUFFICIENT/422) produce BACKEND_CREDENTIALS_REJECTED (422). FORGEJO_BACKEND_API_ERROR/401/403/404/422 produces BACKEND_RESOURCE_REJECTED (422), including when the repository does not exist. Unknown code/status combinations and BACKEND_CAPABILITY_NOT_SUPPORTED/422 produce DEPENDENCY_CONTRACT_VIOLATION (500). All rejections stop registration without side effects. Only a successfully returned null confirms absence; exceptions never permit manual registration. Forgejo lookup requires a repository object with full_name in owner/repo format, at most 512 characters: exactly two nonempty segments containing ASCII letters, digits, underscores, hyphens or dots; dot and dot-dot segments are forbidden. Missing or extra segments and excessive length are invalid. An HTTP 200 with HTML, an empty body, a JSON scalar/null, a list or an invalid repository object produces DEPENDENCY_CONTRACT_VIOLATION (500), without a data source, outbox entry or linked event. Dependency error details contain only source and operation. Lookup runs when metadata is empty, kind is blank, or the submitted display_name is missing/blank. A complete payload with nonempty metadata, kind and display_name skips lookup. Host admission can return 422 BACKEND_CAPABILITY_NOT_SUPPORTED if the shared data-source interface is absent.
      operationId: dataSourceRegister
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRegisterRequestBody'
      responses:
        '200':
          description: Existing data source returned for an idempotent duplicate registration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/DataSourceResponseData'
        '201':
          description: Data source registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/DataSourceResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Tenant context required/active; caller must be tenant owner/admin or superadmin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Integration not found; CREDENTIALS_NOT_FOUND when saved credentials or the referenced row are absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR, INTEGRATION_PAYLOAD_TOO_LARGE, INTEGRATION_CONFIG_INVALID (including unresolved kind), BACKEND_CAPABILITY_NOT_SUPPORTED (missing shared data-source interface), BACKEND_CREDENTIALS_REJECTED or BACKEND_RESOURCE_REJECTED (including a missing backend repository); no data source is created; CREDENTIALS_REFERENCE_INVALID for a malformed credential reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationWriteErrorResponse'
        '500':
          description: BACKEND_PORT_UNAVAILABLE (configuration/missing method), DEPENDENCY_CONFIGURATION_ERROR (invalid backend error mirror), DEPENDENCY_CONTRACT_VIOLATION, or DEPENDENCY_FAILED; CREDENTIALS_KEY_NOT_CONFIGURED, CREDENTIALS_UNREADABLE, or CREDENTIALS_VAULT_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: BACKEND_PORT_UNAVAILABLE (port resolution failed), SOURCE_UNAVAILABLE (implementation lacks shared interfaces), or DEPENDENCY_UNAVAILABLE — a required backend call is temporarily unavailable. The operation does not fall back to defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Integrations
