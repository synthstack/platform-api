    TaskActivityBaseData:
      type: object
      description: Strict public contracts for known kinds, written only by scenario recorders. Required payload fields are always present; declared metadata remains extensible. Unknown kinds are accepted exclusively by TaskUnknownActivity and retain their payloads. Author attribution uses actor_type/actor_id; scope never identifies an author or executor. Envelope name fields remain absent. The two public feeds and shared WS DTO strip undeclared top-level payload keys for known kinds, including port-supplied values; declared metadata contents remain untouched. Domain event delivery does not create activities, regardless of the activity_projected flag. This also applies to task.comment_created and repeated event deliveries. See /~/api_docs/task-events.md for the writer and payload matrix.
      properties:
        id:
          $ref: '#/components/schemas/TaskActivityId'
        seq:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Per-task publication position. Always non-null in feeds and WS; creation DTOs may return null while awaiting publication. Deduplicate by id; activity.id is never a cursor, before or after publication.
        iteration_id:
          nullable: true
          description: 'Nullable iteration reference: ON DELETE SET NULL clears it on physical iteration deletion. This differs from the historical execution_id.'
          type: string
          pattern: ^itr_[a-zA-Z0-9]{6,}$
        execution_id:
          nullable: true
          description: Historical execution reference, retained after physical execution deletion; the referenced execution may no longer resolve.
          type: string
          pattern: ^exe_[a-zA-Z0-9]{6,}$
        actor_type:
          $ref: '#/components/schemas/TaskActorType'
        actor_id:
          nullable: true
          description: Encoded user or agent id selected by actor_type. System and runner activities use null.
          type: string
          pattern: ^[a-zA-Z]{2,10}_[a-zA-Z0-9]{6,}$
        kind:
          type: string
        body:
          type: string
          nullable: true
          description: Free-form human text only for user_comment and agent_message activities; null for system-derived activities rendered from kind and payload.
        payload:
          $ref: '#/components/schemas/TaskActivityPayload'
        created_at:
          $ref: '#/components/schemas/TaskDateTime'
      required:
        - id
        - seq
        - iteration_id
        - execution_id
        - actor_type
        - actor_id
        - kind
        - body
        - payload
        - created_at
      oneOf:
        - $ref: '#/components/schemas/TaskTaskCreatedActivity'
        - $ref: '#/components/schemas/TaskTaskUpdatedActivity'
        - $ref: '#/components/schemas/TaskTaskClosedActivity'
        - $ref: '#/components/schemas/TaskTaskReopenedActivity'
        - $ref: '#/components/schemas/TaskTaskDeletedActivity'
        - $ref: '#/components/schemas/TaskExecutorAssignedActivity'
        - $ref: '#/components/schemas/TaskUserCommentActivity'
