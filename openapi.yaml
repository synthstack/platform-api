  /console-members/invite:
    post:
      summary: Invite console member
      description: Creates a pending console user and adds them to the current tenant. Only tenant owners may call this endpoint. Account, setup token, membership, optional project grants, and invitation outbox rows are committed atomically. Unknown body fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - full_name
                - role
              properties:
                email:
                  type: string
                  format: email
                  minLength: 1
                  maxLength: 255
                full_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - member
                prefer_lang:
                  type: string
                  enum:
                    - en
                    - ru
                    - uk
                    - zh
                  default: en
                  description: Preferred locale for the pending account and setup invitation email. Omission defaults to en; explicit null or empty values are rejected.
                project_ids:
                  type: array
                  maxItems: 100
                  nullable: true
                  description: Explicit project access granted atomically when role is member. Omission, null, or an empty array means no grants. Duplicate IDs are collapsed after the configured request limit is checked (100 by default). Must be empty for owner/admin.
                  items:
                    $ref: '#/components/schemas/ProjectId'
      responses:
        '201':
          description: Console member invited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TeamConsoleMember'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Authenticated inviter no longer exists (CONSOLE_MEMBER_NOT_FOUND); invalid encoded IDs return NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: Email already exists (EMAIL_ALREADY_EXISTS) or user is already a tenant member (ALREADY_MEMBER); checked before inviter lookup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Source auth for authService.getUserByEmail/getUserById/createUser/issuePasswordSetupToken; source tenant for tenantService.getMemberRole/addMember/getMember. Writes roll back on failure before commit; post-commit getMember failure does not undo committed membership/outbox. Details contain only source and operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: DEPENDENCY_UNAVAILABLE. Source auth for authService.getUserByEmail/getUserById/createUser/issuePasswordSetupToken; source tenant for tenantService.getMemberRole/addMember/getMember. Writes roll back on failure before commit; post-commit getMember failure does not undo committed membership/outbox. Details contain only source and operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Team
      operationId: post_console_members_invite
