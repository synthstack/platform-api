                      data:
                        $ref: '#/components/schemas/AuthRequestResetResponseData'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_password_request_reset
  /auth/password/reset:
    post:
      summary: Reset password
      description: Reset password using token from email
