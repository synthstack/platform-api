          description: BACKEND_PORT_UNAVAILABLE (configuration/missing method), DEPENDENCY_CONFIGURATION_ERROR (invalid backend error mirror), DEPENDENCY_CONTRACT_VIOLATION, or DEPENDENCY_FAILED; CREDENTIALS_KEY_NOT_CONFIGURED, CREDENTIALS_UNREADABLE, or CREDENTIALS_VAULT_ERROR
