  /console-members/me/activity:
    get:
      summary: List current user's task activity
      description: 'Returns a cursor-paginated task activity feed for the authenticated user as a member of the current tenant. Since team 2.0.0, the default period changes from all to 30d; use window=all for the previous all-time behavior. Finite windows include events from UTC midnight on today minus (N-1) days, with no upper time bound, using the same lower boundary as summary/overview. The window is combined with kind and cursor filters. An existing cursor outside the window is valid: the response is the intersection of the window and the cursor condition. For example, after an old cursor can return newer events inside the window. An empty intersection returns no events, has_more=false and null cursors; a nonexistent cursor returns 404. Pagination is calculated within the window. Rows are ordered by id descending (newest first). Bootstrap returns the newest rows; after returns the nearest strictly newer rows and before the nearest strictly older rows. Both cursors are always present on nonempty pages; cursor presence does not imply more data. Continue newer with after=next_cursor or older with before=prev_cursor, using has_more to detect completion in the current request direction at read time. has_more=false does not prevent subsequent polling. Empty pages have null cursors and has_more=false; retain the previous client cursor, or repeat bootstrap if none exists. With unchanged accessible records, filters and time boundaries, traversal covers all matching rows without gaps or duplicates. Newer and older refer to id order. There is no cross-request snapshot or guarantee of finding late arrivals behind a passed cursor. Rate limit: 60 requests per authenticated user per 60 seconds for this route; fail closed.'
      parameters:
        - name: window
          in: query
          required: false
          description: Activity period preset; defaults to 30d. Use all for events without a time limit.
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - all
            default: 30d
        - name: kind
          in: query
          required: false
          description: Comma-separated subset of task_created, task_updated, task_closed, task_reopened, user_comment, iteration_created, and publication_created (the default tasks user_activity.timeline_kinds). Arrays are rejected; omission or an empty string selects all allowed kinds.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Encoded activity cursor for the nearest strictly newer rows by id. Mutually exclusive with before.
          schema:
            $ref: '#/components/schemas/TaskActivityId'
        - name: before
          in: query
          required: false
          description: Encoded activity cursor for the nearest strictly older rows by id. Mutually exclusive with after.
          schema:
            $ref: '#/components/schemas/TaskActivityId'
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Current user's activity timeline
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConsoleMemberActivityItem'
                      meta:
                        type: object
                        properties:
                          window:
                            type: string
                            enum:
                              - 7d
                              - 30d
                              - 90d
                              - all
                            description: Applied activity period preset.
                          has_more:
                            type: boolean
                            description: More matching rows in the request direction at read time (older for bootstrap/before, newer for after). Sole continuation indicator; false does not prevent polling.
                          next_cursor:
                            description: Position of the newest row by id; continue with after. Always present on nonempty pages, even when has_more=false; null on empty pages.
                            anyOf:
                              - allOf:
                                  - $ref: '#/components/schemas/TaskActivityId'
                              - type: string
                                nullable: true
                                enum:
                                  - null
                          prev_cursor:
                            description: Position of the oldest row by id; continue with before. Always present on nonempty pages, even when has_more=false; null on empty pages.
                            anyOf:
                              - allOf:
                                  - $ref: '#/components/schemas/TaskActivityId'
                              - type: string
                                nullable: true
                                enum:
                                  - null
                          per_page:
                            type: integer
                        required:
                          - window
                          - has_more
                          - next_cursor
                          - prev_cursor
                          - per_page
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Tenant context required or tenant inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Activity cursor not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR for invalid query parameters. An invalid window (including an empty string or array) returns a detail with field=window and message="window must be one of 7d, 30d, 90d, all".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Rate limit exceeded (RATE_LIMIT_EXCEEDED)
          headers:
            Retry-After:
              description: Seconds until retry is allowed.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: RATE_LIMIT_CONFIGURATION_ERROR for an invalid limiter configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: RATE_LIMIT_UNAVAILABLE when the route limiter backend is unavailable (fail closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Team
      operationId: get_console_members_me_activity
