  /integrations/{id}/test:
    post:
      summary: Test integration
      description: |
        Test backend connectivity and update integration status on a valid active/error result or a confirmed credential/API rejection from the configured mirror for this backend type (BACKEND_CREDENTIALS_REJECTED or BACKEND_RESOURCE_REJECTED, both HTTP 422). Backend error codes/statuses are recognized internally and mapped to these local errors. A confirmed rejection returns 422 only after its status and token revocation commit successfully. Persistence, commit or revocation failure rolls back the transaction and returns DEPENDENCY_FAILED (500) with source integrations and operation integrationService.test, without a tested/revocation event. Dependency/configuration failures and malformed results preserve status, last_tested_at, and active tokens; no tested/revocation event is emitted. Diagnostics must be null, an empty array or a map with string keys; nonempty lists, numeric keys and exception values other than string/null produce DEPENDENCY_CONTRACT_VIOLATION (500) before any state change, for both active and error results. With status error, valid diagnostics.exception is a negative probe result: the failed check is recorded and active tokens are revoked. With status active, diagnostics.exception is a malformed result (500 DEPENDENCY_CONTRACT_VIOLATION). Active results also validate optional version (string or null), token_mode (full, repository_scoped or null) and user (object or null) before any state change; omitted fields remain null. A negative result returns HTTP 200 with the local message "Connection failed" and null diagnostics/version/token_mode/user, including exception diagnostics. Mirrored business errors expose local details as [{field, message}], without source/operation or raw provider scope lists. Credential errors point to credentials; API errors point to config. Messages are "Backend credentials are invalid or revoked.", "Backend token lacks the scopes required for this operation.", and "Backend rejected access to the requested resource." respectively.
      operationId: integrationTest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IntegrationId'
      responses:
        '200':
          description: Integration test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/IntegrationTestResponseData'
        '401':
          description: Unauthorized console request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Tenant context required/active; caller must be tenant owner/admin or superadmin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Integration not found; CREDENTIALS_NOT_FOUND when saved credentials or the referenced row are absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: BACKEND_CREDENTIALS_REJECTED (invalid/revoked credentials or insufficient backend token scopes), BACKEND_RESOURCE_REJECTED (backend rejected resource access), or BACKEND_CAPABILITY_NOT_SUPPORTED (missing shared backend contract); CREDENTIALS_REFERENCE_INVALID for a malformed credential reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: BACKEND_PORT_UNAVAILABLE (configuration/missing method), DEPENDENCY_CONFIGURATION_ERROR (invalid backend error mirror), DEPENDENCY_CONTRACT_VIOLATION, or DEPENDENCY_FAILED; CREDENTIALS_KEY_NOT_CONFIGURED, CREDENTIALS_UNREADABLE, or CREDENTIALS_VAULT_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: BACKEND_PORT_UNAVAILABLE (port resolution failed), SOURCE_UNAVAILABLE (implementation lacks shared interfaces), or DEPENDENCY_UNAVAILABLE — a required backend call is temporarily unavailable. The operation does not fall back to defaults.
          content:
