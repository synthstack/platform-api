          description: Present only when the completion callback supplies result_summary; text is opaque, not structured git data.
        metadata:
          allOf:
            - $ref: '#/components/schemas/TaskActivityMetadata'
          description: Present only if the callback supplies metadata; other keys are extensible without business guarantees.
      additionalProperties: false
