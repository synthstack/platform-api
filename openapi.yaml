  /tenant/activity:
    get:
      tags:
        - Tenant Insights
      summary: List tenant activity
      description: 'Returns the append-only tenant activity projection. History starts when the projection is deployed and is retained for 90 days. Rows are ordered by (occurred_at, id) descending (newest first); id breaks ties at the same occurred_at. Bootstrap returns the newest rows; after returns the nearest strictly newer rows and before the nearest strictly older rows. Both cursors are always present on nonempty pages; cursor presence does not imply more data. Continue newer with after=next_cursor or older with before=prev_cursor, using has_more to detect completion in the current request direction at read time. has_more=false does not prevent subsequent polling. Empty pages have null cursors and has_more=false; retain the previous client cursor, or repeat bootstrap if none exists. With unchanged accessible records, filters and time boundaries, traversal covers all matching rows without gaps or duplicates. Newer and older refer to (occurred_at, id) order, not insertion order. The projection is populated asynchronously using the source activity time: late arrivals behind a passed cursor are not guaranteed to be found by after traversal. There is no cross-request snapshot.'
      operationId: tenantActivityList
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum:
              - all
              - success
              - error
            default: all
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: Encoded activity cursor for the nearest strictly newer rows by (occurred_at, id). Mutually exclusive with before.
          schema:
            $ref: '#/components/schemas/TenantActivityItemId'
        - name: before
          in: query
          description: Encoded activity cursor for the nearest strictly older rows by (occurred_at, id). Mutually exclusive with after.
          schema:
            $ref: '#/components/schemas/TenantActivityItemId'
        - name: since
          in: query
          description: Inclusive lower bound. Fractional seconds are normalized to the next stored second.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Tenant activity page
          headers:
            X-RateLimit-Limit:
              description: Configured requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantActivityListResponseData'
                      meta:
                        $ref: '#/components/schemas/TenantActivityMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Tenant is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: DEPENDENCY_CONFIGURATION_ERROR (port or method unavailable), DEPENDENCY_CONTRACT_VIOLATION (invalid result or undocumented owner 4xx), or DEPENDENCY_FAILED (other owner failure). Project visibility uses source tenant, operation tenantService.getMemberRole. No feed or summary is returned after an access lookup failure. Public details contain only source and operation; no upstream payload or debug metadata is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: RATE_LIMIT_UNAVAILABLE, or DEPENDENCY_UNAVAILABLE from project visibility checks (source tenant, operation tenantService.getMemberRole). No partial feed or summary is returned. Public details contain only source and operation; no upstream payload or debug metadata is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /tenant/metrics:
    get:
      tags:
        - Tenant Insights
      summary: Get tenant time-series metrics
      description: Sources are queried with exact effective bounds; fractional bounds are normalized against second-precision storage, and points are labeled by every UTC bucket intersecting that range.
      operationId: tenantMetricsSeries
      security:
        - bearerAuth: []
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TenantMetricName'
        - name: from
          in: query
          required: true
          description: Inclusive lower bound of the half-open range; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Exclusive upper bound of the half-open range; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: interval
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TenantMetricInterval'
        - name: project_id
          in: query
          description: Optional project filter supported only for compute_hours.consumed.
          schema:
            $ref: '#/components/schemas/ProjectId'
      responses:
        '200':
          description: Zero-filled UTC time series
          headers:
            X-RateLimit-Limit:
              description: Configured requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantMetricSeriesResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - owner or admin role required, tenant inactive, or context unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Encoded project identifier is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '502':
          description: Metrics source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Rate limiting is unavailable (RATE_LIMIT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /tenant/metrics/tasks-by-agent:
    get:
      tags:
        - Tenant Insights
      summary: Get completed and failed executions by agent
      description: Uses a half-open range [from, to); fractional bounds are normalized against second-precision storage.
      operationId: tenantMetricsTasksByAgent
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive lower bound; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Exclusive upper bound; fractional seconds are supported.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Execution aggregates ordered by activity descending and agent name ascending
          headers:
            X-RateLimit-Limit:
              description: Configured requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantTasksByAgentResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden - owner or admin role required, tenant inactive, or context unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until the current rate-limit window resets.
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '502':
          description: Metrics source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Rate limiting is unavailable (RATE_LIMIT_UNAVAILABLE)
