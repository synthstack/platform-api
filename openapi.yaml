  /news/unread:
    get:
      tags:
        - News
      operationId: newsUnread
      summary: List current user unread news
      description: 'Active news with date <= now and no user read record. regular/required additionally require news.date >= user.created_at (inclusive UTC); terms are evergreen, including for users registered later. Ordered by terms, required, regular, then date DESC and internal id DESC. Delivery persists first publication before returning the content and serializes with protected edits. The auth profile port is resolved before any publication writes on every unread request, including an empty result or a page containing only terms. Process page 1 and refetch page 1 after each successful read to avoid skipping a shrinking collection. Any error must degrade the frontend toward availability: do not block the interface; retry later. No server gate restricts other APIs.'
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Positive decimal digits without leading zeroes, signs, whitespace or fractions. No application upper bound; very large pages return an empty array with the actual collection total.
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Positive decimal digits without leading zeroes, signs, whitespace or fractions.
      responses:
        '200':
          description: Unread news; an empty page keeps the actual collection total.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NewsItem'
                      meta:
                        $ref: '#/components/schemas/NewsPagination'
        '401':
          description: 'UNAUTHORIZED: missing or malformed Authorization header. INVALID_TOKEN: invalid or expired Bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: pagination errors in error.details. page must be an integer >= 1 with no application upper bound; per_page must be an integer from 1 to 100. Query values use decimal digits without leading zeroes, signs, whitespace or fractions.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: 'DEPENDENCY_CONFIGURATION_ERROR: auth profile port cannot be resolved or its required method is unavailable. DEPENDENCY_CONTRACT_VIOLATION: missing profile, invalid registration date, or undocumented owner 4xx. DEPENDENCY_FAILED: other auth-port failures. Dependency errors include error.details with source=auth and operation=authService.getUserProfileById. INTERNAL_ERROR: storage/technical failure or repeated concurrent changes preventing page delivery after three attempts. No unread delivery; frontend remains available and retries later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: 'DEPENDENCY_UNAVAILABLE: the auth profile port reported HTTP 502/503. error.details contains source=auth and operation=authService.getUserProfileById. No read is recorded. Terms and existing reads do not depend on the auth profile port.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /news/{id}/read:
    post:
      tags:
        - News
      operationId: newsMarkRead
      summary: Record reading or explicit consent
      description: 'Business check order: body types, existence/publication, audience for first regular/required read, acknowledgement for blocking types, idempotent recording. Invalid external IDs are rejected before body validation. Never-published or out-of-audience news returns 404. Previously published news remains readable after deactivation or moving its date to the future, within the current audience. On an audience 404 refresh the unread queue. Existing read records bypass audience/auth-port/IP checks, but still require a correctly typed body and true acknowledgement for blocking types. terms reads never call auth profile. Correct retries preserve the first stored record (read_at, IP, acknowledgement, user agent), including concurrent requests and visibility/audience changes. The response contains only the news ID, status, acknowledgement, read_at and result message; saved IP and user agent are not returned. First recording requires a valid IPv4/IPv6 from Request.getIp; no forwarded header processing. User agent is truncated to 512 Unicode characters. Every POST error means consent is not confirmed as saved: keep the blocking dialog open, with retry and exit.'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NewsId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsReadInput'
      responses:
        '200':
          description: Read durably recorded, or original record returned for an idempotent retry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/NewsReadResult'
        '401':
          description: 'UNAUTHORIZED: missing or malformed Authorization header. INVALID_TOKEN: invalid or expired Bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: 'NOT_FOUND: invalid external ID, absent news, never published news, or first regular/required read outside current audience. Refresh the unread queue.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: invalid body types. ACKNOWLEDGEMENT_REQUIRED: terms/required without acknowledged=true, including an existing read. No record changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: 'CLIENT_IP_UNAVAILABLE: missing/invalid client IP for first read. DEPENDENCY_CONFIGURATION_ERROR: auth profile port cannot be resolved or its required method is unavailable. DEPENDENCY_CONTRACT_VIOLATION: missing profile, invalid registration date, or undocumented owner 4xx. DEPENDENCY_FAILED: other auth-port failures. Dependency errors include error.details with source=auth and operation=authService.getUserProfileById. INTERNAL_ERROR: storage/technical failure. Consent is not confirmed as saved; keep the dialog open with retry/exit. IP/auth validation failures create no read. Terms and existing reads do not depend on the auth profile port.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: 'DEPENDENCY_UNAVAILABLE: the auth profile port reported HTTP 502/503. error.details contains source=auth and operation=authService.getUserProfileById. No read is recorded. Terms and existing reads do not depend on the auth profile port.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /notifications:
    get:
      summary: List current user's notifications
      description: Lists visible notifications for the authenticated user and active tenant. Dismissed rows are excluded. Only the six documented query parameters are accepted; unknown parameters return 422 VALIDATION_ERROR. meta.total counts filtered rows; meta.total_all and meta.unread_count ignore list filters. Task/execution notification delivery resolves projects in the background. DEPENDENCY_UNAVAILABLE (503) or DEPENDENCY_CONFIGURATION_ERROR / DEPENDENCY_CONTRACT_VIOLATION / DEPENDENCY_FAILED (500) from projects abort delivery; details retain source/operation supplied by projects. This list endpoint reads stored notifications and does not perform that lookup.
      operationId: notificationsList
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum:
              - all
              - unread
            default: all
        - in: query
          name: categories
          description: CSV of at most 20 open category identifiers. Each trimmed value must match ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$. Empty or whitespace-only input disables this filter; empty entries within a non-empty CSV are invalid. Duplicate values are deduplicated after validation. Unknown category names are accepted.
          schema:
            type: string
        - in: query
          name: q
          description: Search text in fallback_title and fallback_body. Leading/trailing whitespace is trimmed for searching; percent and underscore are literal.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: order
          description: Sort direction for created_at, with id as the tie-breaker.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - in: query
          name: page
          description: Page number. The value and the offset (page - 1) * per_page must fit the server integer range; overflow returns 422 VALIDATION_ERROR.
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Notification inbox page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConsoleNotification'
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties:
                              unread_count:
                                type: integer
                                minimum: 0
                                description: Unread count in the entire visible user/tenant inbox, ignoring filters.
                              total_all:
                                type: integer
                                minimum: 0
                                description: Total visible user/tenant inbox size, ignoring filters.
                            required:
                              - unread_count
                              - total_all
        '401':
          description: UNAUTHORIZED for missing or malformed Bearer authorization; INVALID_TOKEN for an invalid or expired access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: TENANT_REQUIRED when tenant context cannot be resolved; TENANT_INACTIVE for an inactive tenant; FORBIDDEN for a token/membership tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: VALIDATION_ERROR with field/message details for invalid input or unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          $ref: '#/components/responses/NotificationDependencyError'
        '503':
          $ref: '#/components/responses/NotificationDependencyUnavailable'
      tags:
        - Notifications
  /notifications/unread-count:
    get:
      summary: Get unread notification count
      description: Counts visible unread rows for the authenticated user and active tenant.
      operationId: notificationsUnreadCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
