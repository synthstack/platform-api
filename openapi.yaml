          required:
            - action
            - target_agent_id
        enabled:
          type: boolean
        max_triggers:
          type: integer
          nullable: true
          minimum: 1
          description: Per-rule trigger budget. Null means unlimited.
        triggers_used:
          type: integer
          minimum: 0
          description: Number of times this rule has spent budget.
      required:
        - id
