      type: array
      items:
        $ref: '#/components/schemas/TenantActivityItem'
    TenantActivityMeta:
      type: object
      properties:
        has_more:
          type: boolean
          description: More matching rows in the request direction at read time (older for bootstrap/before, newer for after). Sole continuation indicator; false does not prevent subsequent polling.
        next_cursor:
          description: Position of the newest row by (occurred_at, id); continue with after. Always present on nonempty pages, even when has_more=false; null on empty pages.
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/TenantActivityItemId'
            - type: string
              nullable: true
              enum:
                - null
        prev_cursor:
          description: Position of the oldest row by (occurred_at, id); continue with before. Always present on nonempty pages, even when has_more=false; null on empty pages.
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/TenantActivityItemId'
            - type: string
              nullable: true
              enum:
                - null
