    AgentEffectiveProfileConfig:
      description: |
        Profile configuration participating in the runtime merge. Configuration keys and
        values are intentionally extensible because engine and project layers may expose
        settings beyond the editable agent-profile fields. An empty PHP array is emitted
        as an empty JSON array; `{}` and `[]` are semantically equivalent when empty.
        ID-like property names inside this free configuration are opaque values and are
        not encoded entity identifiers.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          maxItems: 0
          items: {}
    AgentEffectiveProfileLayerName:
      type: string
      enum:
        - engine_default
        - agent
        - tenant_agent
    ProjectAgentEffectiveProfileLayerName:
      type: string
      enum:
        - engine_default
        - project
        - agent
        - tenant_agent
        - project_assignment
    AgentEffectiveProfileSources:
      type: object
      description: Map from a leaf dot-path in the effective profile to its winning layer.
      additionalProperties:
        $ref: '#/components/schemas/AgentEffectiveProfileLayerName'
      example:
        timeout: engine_default
        task_context.history_mode: tenant_agent
        work_dir: tenant_agent
    ProjectAgentEffectiveProfileSources:
      type: object
      description: Map from a leaf dot-path in the effective profile to its winning layer.
      additionalProperties:
        $ref: '#/components/schemas/ProjectAgentEffectiveProfileLayerName'
      example:
        timeout: engine_default
        labels: project
        task_context.history_mode: tenant_agent
        work_dir: project_assignment
    AgentEffectiveProfileInheritance:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: array
          minItems: 3
          maxItems: 3
          enum:
            - - engine_default
              - agent
              - tenant_agent
          items:
            $ref: '#/components/schemas/AgentEffectiveProfileLayerName'
        sources:
          $ref: '#/components/schemas/AgentEffectiveProfileSources'
        layers_present:
          type: object
          additionalProperties: false
          properties:
            agent:
              type: boolean
            tenant_agent:
              type: boolean
          required:
            - agent
            - tenant_agent
      required:
        - chain
        - sources
        - layers_present
    ProjectAgentEffectiveProfileInheritance:
      type: object
      additionalProperties: false
      properties:
        chain:
          type: array
          minItems: 5
          maxItems: 5
          enum:
            - - engine_default
              - project
              - agent
              - tenant_agent
              - project_assignment
          items:
            $ref: '#/components/schemas/ProjectAgentEffectiveProfileLayerName'
        sources:
          $ref: '#/components/schemas/ProjectAgentEffectiveProfileSources'
        layers_present:
          type: object
          additionalProperties: false
          properties:
            project:
              type: boolean
            agent:
              type: boolean
            tenant_agent:
              type: boolean
            project_assignment:
              type: boolean
          required:
            - project
            - agent
            - tenant_agent
            - project_assignment
      required:
        - chain
        - sources
        - layers_present
    AgentEffectiveProfileLayers:
      type: object
      additionalProperties: false
      properties:
        engine_default:
          $ref: '#/components/schemas/AgentEffectiveProfileConfig'
        agent:
          description: Raw base profile only for superadmins or gov tenants with an editable connection; otherwise null, also when is_gov cannot be confirmed. Null can mean absent or hidden; inheritance.layers_present.agent still reports actual presence. Merged profile and inheritance always include the base layer.
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/AgentEffectiveProfileConfig'
            - type: string
              nullable: true
              enum:
                - null
        tenant_agent:
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/AgentEffectiveProfileConfig'
            - type: string
              nullable: true
              enum:
                - null
      required:
