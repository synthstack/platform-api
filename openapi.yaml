  /tasks/entries/{id}/activities:
    get:
      tags:
        - Tasks
      summary: List task activities
      description: 'Only published activities are visible, ordered by per-task seq independently of internal IDs. Both feeds use tfc1 positional tokens: after selects nearest newer, before nearest older positions; ordinary data is ASC. order=asc (default) bootstraps oldest, order=desc newest; ignored with a cursor. On nonempty pages, next_cursor is the maximum page position for after, prev_cursor the minimum for before, in every mode. A token binds feed=task, tenant, task and generation. Position zero is valid and discovers first publication via after. Row existence is irrelevant: deletion never invalidates any token. Ordinary empty bootstrap uses MAX(seq) of published task rows in the same repeatable-read snapshot as data, or zero, independently of page filters. Never use allocation counters. Empty continuation returns the exact input token as both cursors, without advancement. Empty bootstrap does not create numeric P. Catch-up chains nearest newer after pages to has_more=false; only fully applied prefixes advance the confirmed cursor, including publications during traversal. Short/empty page length is not completion. Window mode requires inclusive positive window_from_seq/window_to_seq, difference at most 200 (maintenance_window_span). Missing boundary rows are allowed. Data is DESC, after is forbidden, order if supplied must be desc. Continue before=prev_cursor with identical bounds and filters. An empty first window page returns both tokens at min(window_to_seq, MAX(seq)), reading the task''s published tail on the same connection and repeatable-read snapshot as the page (0 without publications). has_more=false and full meta.window coverage, including covered_to_seq=window_to_seq, are unchanged. The clamped position may be below window_from_seq; that completed empty pass has no continuation. Newly formed tokens confirm no positions above the checked window or the snapshot''s published tail. Empty before continuation preserves the exact input token without reevaluating its position; previously issued tokens above the tail are not revoked. Window cursors serve only before continuation of the same pass and never advance the confirmed catch-up cursor or numeric P. Both cursors remain required strings on every page. before must be a task token with position inside the window. meta.window proves checked coverage including empty/filtered/deleted positions. Replace/delete local window contents only after continuous full coverage and has_more=false; errors or changed filters forbid partial replacement. INVALID_CURSOR on continuation discards accumulated pages and restarts the same window without before, once immediately. Empty/wrongly typed parameters, both directions or invalid window/order combinations return 422 VALIDATION_ERROR. Non-tfc1 formats (including act_ IDs), wrong feed/context/generation, corruption, unknown key or out-of-window position return 422 INVALID_CURSOR. Filters do not invalidate tokens. Keep nondecreasing numeric P from applied REST seq values separately from the confirmed token; WS advances neither. After INVALID_CURSOR, newest bootstrap with L=min seq,T=max seq requires filling [P+1,L-1] with completed consecutive bounded windows if L>P+1; then confirm its upper cursor and set P=max(P,T). Empty bootstrap retains P. Unknown P requires full before history to completion. Ordinary newest bootstrap alone does not guarantee completeness. Scheduled passes at least every five minutes combine tail catch-up and replacement windows up to saved P, even after empty catch-up. For open contexts without a loaded/saved range, buffer an extra newest page, then finish catch-up from the prior confirmed cursor before applying it and forming P/range. Its cursors never replace the confirmed cursor; failures discard the buffer and empty reads never invent P. Scope membership changes receive no WS notification. This interval is not a strict freshness bound. See /~/api_docs/task-events.md for the full client protocol and recovery policy.'
      operationId: taskActivitiesList
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - name: order
          in: query
          description: Ordinary head selection; cursor direction takes precedence. Ordinary data is ASC seq. Window mode requires desc and returns DESC seq.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: window_from_seq
          in: query
          description: Inclusive positive lower seq boundary; requires window_to_seq. Positions need not have rows.
          schema:
            type: integer
            minimum: 1
        - name: window_to_seq
          in: query
          description: Inclusive positive upper seq boundary; to-from must be at most maintenance_window_span (200).
          schema:
            type: integer
            minimum: 1
        - name: timeline_agent
          in: query
          description: Include task scope plus scopes containing this conversation owner. Invalid ID format returns 404 NOT_FOUND. An ID with no matching historical scope returns only task-scoped rows; deleted agents may still match immutable owner/snapshot scopes. Does not change task access authorization.
          schema:
            $ref: '#/components/schemas/AgentId'
        - name: after
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskFeedCursor'
        - name: before
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskFeedCursor'
        - name: kind
          in: query
          required: false
          description: One activity kind or a CSV list of at most 32 values, counted before deduplication and removal of empty entries. More than 32 values returns 422 VALIDATION_ERROR, with or without timeline_agent. Whitespace is trimmed; duplicates and empty entries are ignored after validation. Unknown kinds are allowed. An empty filter does not restrict kinds. Alternatively use kind[].
          schema:
            type: string
            example: user_comment,execution_progress
        - name: kind[]
          in: query
          required: false
          description: 'Alternative to CSV kind: a flat array of at most 32 strings with the same filtering semantics. The limit counts duplicates and empty entries before normalization. Excess values or nested arrays return 422 VALIDATION_ERROR.'
          style: form
          explode: true
          schema:
            type: array
            maxItems: 32
            items:
              type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Task activity feed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                      - meta
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskActivityListResponseData'
                      meta:
                        $ref: '#/components/schemas/TaskActivityCursorMeta'
        '401':
          $ref: '#/components/responses/TasksUnauthorized'
        '403':
          $ref: '#/components/responses/TasksForbidden'
        '404':
          $ref: '#/components/responses/TasksNotFound'
        '422':
          $ref: '#/components/responses/TasksValidationError'
        '500':
          $ref: '#/components/responses/TasksProjectDependencyError'
        '503':
          $ref: '#/components/responses/TasksProjectDependencyUnavailable'
  /tasks/entries/{id}/comments:
    post:
      tags:
        - Tasks
      summary: Add task comment
      description: 'Atomically creates the full comment and optionally an iteration with input artifact snapshots. VALIDATION_ERROR (422) covers invalid input lists, nonempty inputs without create_iteration: true, and a missing required or invalid Idempotency-Key for any comment. Unavailable or changed inputs, including artifacts deleted after preflight, return 422 INPUT_ARTIFACT_NOT_AVAILABLE without creating a comment. Artifacts missing or belonging to another task or tenant at the initial lookup return 404 NOT_FOUND. New comments on closed tasks return 409 TASK_CLOSED. Reusing a key with different request content, including a key used for direct iteration creation, returns 409 IDEMPOTENCY_KEY_CONFLICT.'
      operationId: taskCommentCreate
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - name: Idempotency-Key
          in: header
          required: false
          description: Required for nonempty input_artifact_ids; optional otherwise. Always applies, including to plain comments. An empty header is treated as absent. With nonempty input_artifact_ids, a missing or empty key returns 422 VALIDATION_ERROR with message "Idempotency-Key is required for input artifacts". Otherwise, a missing or empty key creates a new comment and optional iteration on each request. Nonempty keys must contain 1 to 128 printable ASCII characters without spaces; invalid keys return 422 VALIDATION_ERROR without writes. Scoped to this task, not the author, and shared by plain comments, comments with iterations and direct iterations. A different normalized request or operation returns 409 IDEMPOTENCY_KEY_CONFLICT. Generate a unique key for each new submission (for example, UUIDv4); reuse it only to retry that submission. Repeating the same key and normalized body returns the original comment_activity_id, iteration_id and initially accepted execution_ids with 201, without new records, events or realtime signals. Plain comment replay returns iteration_id null and execution_ids []. Replay precedes mutable task, input and executor revalidation, including on a closed task, but still requires current access. Another authorized user may replay the request; the original author is preserved. Body is trimmed; executor and artifact ID order is ignored for fingerprinting.
          schema:
            type: string
            minLength: 0
            maxLength: 128
            pattern: ^[!-~]{0,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCommentCreateRequestBody'
      responses:
        '201':
          description: Comment activity and optional iteration/executions created, or the original result replayed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskCommentCreateResponseData'
        '401':
          $ref: '#/components/responses/TasksUnauthorized'
        '403':
          $ref: '#/components/responses/TasksForbidden'
        '404':
          $ref: '#/components/responses/TasksNotFound'
        '409':
          $ref: '#/components/responses/TasksConflict'
        '422':
          $ref: '#/components/responses/TasksExecutionStartRejected'
        '500':
          $ref: '#/components/responses/TasksBillingDependencyError'
        '503':
          $ref: '#/components/responses/TasksBillingDependencyUnavailable'
