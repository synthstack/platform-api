    TenantMetricBucketDate:
      type: string
      description: UTC bucket label; YYYY-MM-DD for day or YYYY-MM-DDTHH:00:00Z for hour.
      example: '2026-10-01'
    TenantMetricCountPoint:
      type: object
      properties:
