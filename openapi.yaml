      type: object
      properties:
        limits:
          $ref: '#/components/schemas/AutomationLimits'
      required:
        - limits
    AutomationRuleRequestBody:
      type: object
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/AutomationRuleId'
          description: Existing rule id. If omitted, a new rule is created.
        name:
          type: string
          minLength: 1
          maxLength: 100
        when:
          type: object
          properties:
            agent_id:
              $ref: '#/components/schemas/AgentId'
          required:
            - agent_id
        if:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/AutomationRuleStatus'
            message_contains:
              type: string
              nullable: true
              description: Optional case-insensitive text filter. Omit together with message_not_contains for a status-only rule.
              maxLength: 500
            message_not_contains:
              type: string
              nullable: true
              description: Optional negative case-insensitive text filter. Omit together with message_contains for a status-only rule.
              maxLength: 500
          required:
            - status
        do:
          type: object
          properties:
            action:
              $ref: '#/components/schemas/AutomationRuleAction'
            target_agent_id:
              $ref: '#/components/schemas/AgentId'
          required:
            - action
            - target_agent_id
        enabled:
          type: boolean
          default: true
        max_triggers:
          type: integer
          nullable: true
          minimum: 1
          description: Per-rule trigger budget. Null means unlimited; omitted means module default. The numeric cap is returned at runtime in meta.limits.rule_max_triggers_cap.
        reset_counter:
          type: boolean
          default: false
          description: Resets this rule's triggers_used on save.
      required:
        - name
        - when
        - if
        - do
    AutomationPutRequestBody:
