openapi: 3.0.3
info:
  title: SynthStack Backend API
  version: v2.13.0+18304
  contact:
    name: SynthStack
    url: https://synthstack.ai
  description: |
    Centralized OpenAPI specification generated from module-level path fragments.
    Do not edit this file manually in runtime environments.
servers:
  - url: https://api.synthstack.ai/v2
    description: Production environment
security:
  - bearerAuth: []
tags:
  - name: Account Settings
    description: Account Settings operations.
  - name: Agent
    description: Agent operations.
  - name: Ai Assist
    description: Ai Assist operations.
  - name: Auth
    description: Auth operations.
  - name: Automation
    description: Automation operations.
  - name: Billing
    description: Billing operations.
  - name: Feedback
    description: Feedback operations.
  - name: Integrations
    description: Integrations operations.
  - name: Notifications
    description: Notifications operations.
  - name: Oauth Server
    description: Oauth Server operations.
  - name: Projects
    description: Projects operations.
  - name: Skills
    description: Skills operations.
  - name: Tasks
    description: Tasks operations.
  - name: Team
    description: Team operations.
  - name: Templates
    description: Templates operations.
  - name: Tenant
    description: Tenant operations.
  - name: Tenant Insights
    description: Tenant Insights operations.
paths:
  /account/settings:
    get:
      summary: Get account settings
      description: Return the current user's effective audio and notification settings merged with defaults. Does not create a database row when only defaults exist.
      operationId: accountSettingsGet
      responses:
        '200':
          description: Effective account settings document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountSettingsResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Account Settings
    patch:
      summary: Update account settings
      description: Apply JSON Merge Patch (RFC 7386) to the current user's audio and notification overrides, then return the full effective document.
      operationId: accountSettingsUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSettingsUpdateRequestBody'
            example:
              notifications:
                types:
                  sync_completed: null
                delivery:
                  toasts: null
      responses:
        '200':
          description: Updated effective account settings document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountSettingsResponseData'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Account Settings
  /agents/{agentId}/skills:
    get:
      summary: List skills attached to an agent
      operationId: listAgentSkills
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Attached skills
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentSkillListResponseData'
                    required:
                      - data
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '503':
          $ref: '#/components/responses/AgentSkillUnavailable'
      tags:
        - Agent
      description: List skills attached to an agent
    post:
      summary: Attach skills to an agent atomically
      operationId: attachAgentSkills
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skill_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/SkillId'
              required:
                - skill_ids
      responses:
        '200':
          description: Agent skills updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentSkillAttachResponseData'
                    required:
                      - data
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentOrSkillNotFound'
        '409':
          $ref: '#/components/responses/AgentSkillConflict'
        '422':
          $ref: '#/components/responses/AgentValidationError'
        '503':
          $ref: '#/components/responses/AgentSkillUnavailable'
      tags:
        - Agent
      description: Attach skills to an agent atomically
  /agents/{agentId}/skills/{skillId}:
    delete:
      summary: Detach a skill from an agent
      operationId: detachAgentSkill
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/AgentSkillIdPath'
      responses:
        '204':
          description: Skill detached
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentOrSkillNotFound'
      tags:
        - Agent
      description: Detach a skill from an agent
  /agents/{agentId}/skills/{skillId}/download:
    get:
      summary: Issue an agent-scoped skill download URL
      operationId: downloadAgentSkill
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/AgentSkillIdPath'
      responses:
        '200':
          description: Presigned skill download
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentSkillDownloadResponseData'
                    required:
                      - data
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentOrSkillNotFound'
        '503':
          $ref: '#/components/responses/AgentSkillUnavailable'
      tags:
        - Agent
      description: Issue an agent-scoped skill download URL
  /engines:
    get:
      summary: List AI engines
      description: Get available AI engines.
      operationId: agentEngineList
      responses:
        '200':
          description: List of engines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineListResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
      tags:
        - Agent
  /engines/{engineId}/models:
    get:
      summary: List models for engine
      description: Get available models for one AI engine.
      operationId: agentEngineModelsList
      parameters:
        - $ref: '#/components/parameters/EngineIdPath'
      responses:
        '200':
          description: List of engine models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineModelListResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
  /models:
    get:
      summary: List all models
      description: Get all available AI models across engines.
      operationId: agentModelsListAll
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
      tags:
        - Agent
  /roles:
    get:
      summary: List active roles
      description: Get active public agent roles.
      operationId: agentRolesList
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePublicListResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
      tags:
        - Agent
  /agents:
    get:
      summary: List agents
      description: Get paginated tenant agents.
      operationId: agentList
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - name: search
          in: query
          required: false
          description: Case-insensitive match against agent `name` and `display_name`.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - disabled
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - custom
              - marketplace
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - created_at
              - status
            default: created_at
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
    post:
      summary: Create agent
      description: Create a tenant-owned editable AI agent.
      operationId: agentCreate
      requestBody:
        $ref: '#/components/requestBodies/AgentCreateRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
  /agents/stats:
    get:
      summary: Get agent stats
      description: Get aggregate agent counters for the current tenant.
      operationId: agentStats
      responses:
        '200':
          description: Agent counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatsResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
      tags:
        - Agent
  /agents/{id}:
    get:
      summary: Get agent
      description: Get tenant agent details by ID.
      operationId: agentGet
      parameters:
        - $ref: '#/components/parameters/AgentIdAsIdPath'
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
    patch:
      summary: Update agent
      description: Update an editable tenant agent.
      operationId: agentUpdate
      parameters:
        - $ref: '#/components/parameters/AgentIdAsIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentUpdateRequest'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
    delete:
      summary: Delete agent
      description: Remove tenant mapping and delete editable agent data when no tenants remain.
      operationId: agentDelete
      parameters:
        - $ref: '#/components/parameters/AgentIdAsIdPath'
      responses:
        '204':
          description: Agent deleted
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
  /agents/{id}/clone:
    post:
      summary: Clone agent
      description: Clone an existing editable agent with configuration.
      operationId: agentClone
      parameters:
        - $ref: '#/components/parameters/AgentIdAsIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentCloneRequest'
      responses:
        '201':
          description: Agent cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
  /agents/{agentId}/projects:
    get:
      summary: List agent projects
      description: Get projects assigned to an agent.
      operationId: agentProjectsList
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProjectsResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '500':
          description: DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION or DEPENDENCY_FAILED. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: DEPENDENCY_UNAVAILABLE. Project resolution can propagate dependency errors from projects; details[].source/operation are supplied by projects (tasks / taskService.activeCountByProject or tenant access lookup).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Agent
  /agents/{agentId}/profile:
    get:
      summary: Get agent profile
      description: Get agent-level profile configuration.
      operationId: agentProfileGet
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
    put:
      summary: Set agent profile
      description: Set agent-level profile configuration.
      operationId: agentProfileSet
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentProfileRequest'
      responses:
        '200':
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
    patch:
      summary: Patch agent profile
      description: Partially update agent-level profile configuration using JSON Merge Patch semantics. Null values remove fields.
      operationId: agentProfilePatch
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentProfilePatchRequest'
      responses:
        '200':
          description: Profile patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
    delete:
      summary: Delete agent profile
      description: Delete agent-level profile configuration.
      operationId: agentProfileDelete
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '204':
          description: Profile deleted
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
  /agents/{agentId}/profile/effective:
    get:
      summary: Get effective agent profile
      description: |
        Resolve the runtime profile for an agent from engine defaults, agent overrides,
        and tenant-agent overrides. Returns the effective value, raw layer inputs, and
        the winning source layer for every profile leaf.
      operationId: agentProfileEffectiveGet
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Effective agent profile with inheritance metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentEffectiveProfileResponseData'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
  /agents/{agentId}/tenant/profile:
    get:
      summary: Get tenant-agent profile
      description: Get tenant-agent profile override.
      operationId: agentTenantAgentProfileGet
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Tenant-agent profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
    put:
      summary: Set tenant-agent profile
      operationId: agentTenantAgentProfileSet
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentProfileRequest'
      responses:
        '200':
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
      description: Set tenant-agent profile
    patch:
      summary: Patch tenant-agent profile
      description: Partially update tenant-agent profile override using JSON Merge Patch semantics. Null values remove fields.
      operationId: agentTenantAgentProfilePatch
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentProfilePatchRequest'
      responses:
        '200':
          description: Profile patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
      tags:
        - Agent
    delete:
      summary: Delete tenant-agent profile
      operationId: agentTenantAgentProfileDelete
      parameters:
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '204':
          description: Profile deleted
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
      tags:
        - Agent
      description: Delete tenant-agent profile
  /projects/{projectId}/agents/{agentId}/profile:
    get:
      summary: Get project-agent profile
      description: Get project assignment-level profile override.
      operationId: projectAgentProfileGet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Project-agent profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '500':
          $ref: '#/components/responses/AgentProjectAccessDependencyFailure'
        '503':
          $ref: '#/components/responses/AgentProjectAccessDependencyUnavailable'
      tags:
        - Agent
    put:
      summary: Set project-agent profile
      operationId: projectAgentProfileSet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentProfileRequest'
      responses:
        '200':
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
        '500':
          $ref: '#/components/responses/AgentProjectAccessDependencyFailure'
        '503':
          $ref: '#/components/responses/AgentProjectAccessDependencyUnavailable'
      tags:
        - Agent
      description: Set project-agent profile
    patch:
      summary: Patch project-agent profile
      description: Partially update project assignment-level profile override using JSON Merge Patch semantics. Null values remove fields.
      operationId: projectAgentProfilePatch
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        $ref: '#/components/requestBodies/AgentProfilePatchRequest'
      responses:
        '200':
          description: Profile patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '422':
          $ref: '#/components/responses/AgentValidationError'
        '500':
          $ref: '#/components/responses/AgentProjectAccessDependencyFailure'
        '503':
          $ref: '#/components/responses/AgentProjectAccessDependencyUnavailable'
      tags:
        - Agent
    delete:
      summary: Delete project-agent profile
      operationId: projectAgentProfileDelete
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '204':
          description: Profile deleted
        '401':
          $ref: '#/components/responses/AgentUnauthorized'
        '403':
          $ref: '#/components/responses/AgentForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        '500':
          $ref: '#/components/responses/AgentProjectAccessDependencyFailure'
        '503':
          $ref: '#/components/responses/AgentProjectAccessDependencyUnavailable'
      tags:
        - Agent
      description: Delete project-agent profile
  /projects/{projectId}/agents/{agentId}/profile/effective:
    get:
      summary: Get effective project-agent profile
      description: |
        Resolve the runtime profile for a project assignment from engine defaults,
        project, agent, tenant-agent, and project-assignment layers. Returns the
        effective value, normalized raw layer inputs, and the winning source layer
        for every profile leaf.
      operationId: projectAgentProfileEffectiveGet
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Effective project-agent profile with inheritance metadata
          content:
