    TaskActivityCursorMeta:
      type: object
      description: Both cursors are opaque sequence boundaries, independent of row existence. next_cursor is the maximum position, prev_cursor the minimum on nonempty pages, regardless of data order. Ordinary task and project data is ASC; windows are DESC and continue before=prev_cursor. Finish only at has_more=false. Both cursors are required strings on every page, including empty pages. Ordinary empty bootstrap positions come from the same consistent snapshot as data. An empty first window page returns both tokens at min(window_to_seq, MAX(seq)), using the published task tail on the same connection and repeatable-read snapshot (0 without publications). meta.window is unchanged. Empty continuation returns the exact input token without reevaluating its position; previously issued tokens are not revoked. Window cursors only serve before continuation of the same pass and never advance the confirmed catch-up cursor or numeric P. Tokens are never activity IDs. See task-events.md.
      properties:
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/TaskFeedCursor'
        prev_cursor:
          $ref: '#/components/schemas/TaskFeedCursor'
        window:
          $ref: '#/components/schemas/TaskActivityWindowCoverage'
      required:
        - has_more
        - next_cursor
        - prev_cursor
    TaskProjectActivitySummary:
      type: object
      properties:
        all:
          type: integer
          minimum: 0
        success:
          type: integer
          minimum: 0
        error:
          type: integer
          minimum: 0
      required:
        - all
        - success
        - error
    TaskActivityWindowCoverage:
      type: object
      description: Inclusive coverage checked by this page, even if no matching rows exist. U=to_seq initially, otherwise pos(before)-1. covered_to_seq=U; covered_from_seq is the minimum item seq (prev_cursor position) when has_more, otherwise from_seq. If U<from_seq both covered boundaries are null. Replace local data only after continuous full coverage and terminal has_more=false. Errors forbid partial replacement.
      required:
        - from_seq
        - to_seq
        - covered_from_seq
        - covered_to_seq
      properties:
        from_seq:
          type: integer
          minimum: 1
        to_seq:
          type: integer
          minimum: 1
        covered_from_seq:
          type: integer
          nullable: true
        covered_to_seq:
          type: integer
          nullable: true
    TaskFeedCursor:
      type: string
      pattern: ^tfc1\.[A-Za-z0-9_-]{1,64}\.[A-Za-z0-9_-]+$
      description: Opaque AES-256-GCM sequence boundary binding feed (task or project), tenant, task or project, position and contract generation. Position zero is valid; no row must exist at the position. Tokens cannot cross feeds or contexts. Non-tfc1 formats including act_ IDs are rejected. Filter-independent; clients keep separate confirmed tokens per filter context. Keys are shared by all instances; removing a key invalidates its tokens and requires full resynchronization.
    TaskProjectActivityCursorMeta:
      type: object
      required:
        - has_more
        - next_cursor
        - prev_cursor
        - summary
      properties:
        has_more:
          type: boolean
        next_cursor:
          $ref: '#/components/schemas/TaskFeedCursor'
        prev_cursor:
          $ref: '#/components/schemas/TaskFeedCursor'
        summary:
          $ref: '#/components/schemas/TaskProjectActivitySummary'
    TaskCommentCreateResponseData:
