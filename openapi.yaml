  /auth/login:
    post:
      summary: Login
      description: Authenticate with email/password. Returns JWT tokens, or a short-lived TOTP challenge when 2FA is enabled. Password and account checks precede tenant membership lookup. A tenant dependency failure issues no session. Confirmed absence of membership issues JWT without tid or role. Tenant errors expose only details[].source=tenant and details[].operation=tenantService.getByUserId; technical context and debug are omitted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: password123
                remember_me:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/AuthLoginResponseData'
                          - $ref: '#/components/schemas/AuthTwoFactorChallengeResponseData'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Account disabled or pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Tenant port configuration, response contract or invocation failed (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Tenant membership is temporarily unavailable (DEPENDENCY_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_login
  /auth/2fa/verify:
    post:
      summary: Complete password login with a TOTP code
      description: After the live challenge and per-user lockout checks, tenant membership is resolved outside the database transaction, before TOTP code verification. Account, challenge, credential, code and replay checks run under lock before consumption and session issuance. A tenant dependency failure preserves the challenge and is not counted as an invalid factor. Tenant errors expose only details[].source=tenant and details[].operation=tenantService.getByUserId; technical context and debug are omitted. If failure registration in rateLimit fails after an invalid code, the challenge attempt count and exhaustion state are committed before returning 503 RATE_LIMIT_UNAVAILABLE; no session is issued. An unexpected failure in the local failure hook also preserves the challenge writes but returns 500 TWOFA_INTERNAL_ERROR after commit, without issuing a session. A commit failure rolls back the transaction and takes precedence over the registration error. When only failure registration is unavailable, a valid code can still succeed on a live challenge; the database attempt limit, per-IP rate limit and challenge TTL continue to apply.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challenge_token:
                  type: string
                  minLength: 32
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_-]{32,128}$
                code:
                  $ref: '#/components/schemas/AuthTotpCode'
              required:
                - challenge_token
                - code
      responses:
        '200':
          description: TOTP verified and JWT pair issued
          headers:
            X-RateLimit-Limit:
              description: Configured per-IP requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Per-IP requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthLoginResponseData'
                    required:
                      - data
        '401':
          description: Challenge or code is invalid, including code replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Account became disabled (ACCOUNT_DISABLED) or pending (ACCOUNT_PENDING) between authentication steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Per-IP limit (RATE_LIMIT_EXCEEDED), per-challenge attempts (TWOFA_ATTEMPTS_EXCEEDED), or per-user lockout (TWOFA_LOCKED)
          headers:
            Retry-After:
              description: Seconds until the rate-limit window or user lockout expires. Not present for every per-challenge response.
              schema:
                type: integer
                minimum: 1
                maximum: 3600
            X-RateLimit-Limit:
              description: Per-IP window limit; present for RATE_LIMIT_EXCEEDED.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Remaining per-IP requests; zero when RATE_LIMIT_EXCEEDED.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: TOTP secret decryption or internal 2FA processing failed (TWOFA_INTERNAL_ERROR); Tenant port configuration, response contract or invocation failed (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Tenant membership is temporarily unavailable (DEPENDENCY_UNAVAILABLE); rate limiting, lockout state or failure registration is unavailable (RATE_LIMIT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_2fa_verify
  /auth/passkeys/options:
    post:
      summary: Start usernameless passkey login
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      responses:
        '200':
          description: PublicKeyCredentialRequestOptions for navigator.credentials.get()
          headers:
            X-RateLimit-Limit:
              description: Configured per-IP requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Per-IP requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasskeyRequestOptionsResponseData'
                    required:
                      - data
        '429':
          description: Per-IP passkey options rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Rate limiting is unavailable (RATE_LIMIT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_passkeys_options
      description: Start usernameless passkey login
  /auth/passkeys/login:
    post:
      summary: Login with a discoverable passkey
      description: Tenant membership lookup follows assertion verification and credential update. A tenant dependency failure issues no session; the consumed challenge is not restored. Request a new challenge after recovery. Tenant errors expose only details[].source=tenant and details[].operation=tenantService.getByUserId; technical context and debug are omitted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assertion:
                  $ref: '#/components/schemas/PasskeyAssertion'
                remember_me:
                  type: boolean
                  default: false
              required:
                - assertion
      responses:
        '200':
          description: JWT pair issued through the standard authentication session flow
          headers:
            X-RateLimit-Limit:
              description: Configured per-IP requests per window.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Per-IP requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthLoginResponseData'
                    required:
                      - data
        '401':
          description: Unknown, revoked, replayed, or cryptographically invalid passkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Account disabled or pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Expired challenge or structurally invalid assertion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Per-IP passkey login rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Tenant port configuration, response contract or invocation failed (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Tenant membership is temporarily unavailable (DEPENDENCY_UNAVAILABLE); rate limiting is unavailable (RATE_LIMIT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_passkeys_login
  /auth/logout:
    post:
      summary: Logout
      description: Invalidate refresh token and end user session
      security:
        - bearerAuth: []
      requestBody:
        required: false
        description: Optional refresh token to invalidate. When omitted, the bearer-authenticated request still returns 204.
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  example: refresh_token_value
      responses:
        '204':
          description: Successfully logged out
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_logout
  /auth/refresh:
    post:
      summary: Refresh token
      description: Refresh access token using refresh token (with token rotation). Tenant membership lookup precedes rotation. A tenant dependency failure preserves the existing refresh session, which may be retried after recovery. Tenant errors expose only details[].source=tenant and details[].operation=tenantService.getByUserId; technical context and debug are omitted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: refresh_token_value
      responses:
        '200':
          description: New tokens generated
          headers:
            X-RateLimit-Limit:
              description: Configured per-IP refresh requests per minute.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              description: Per-IP refresh requests remaining in the current window.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthRefreshResponseData'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: Validation error - refresh_token is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '429':
          description: Per-IP refresh rate limit exceeded (RATE_LIMIT_EXCEEDED)
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 60
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Tenant port configuration, response contract or invocation failed (DEPENDENCY_CONFIGURATION_ERROR, DEPENDENCY_CONTRACT_VIOLATION, DEPENDENCY_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Tenant membership is temporarily unavailable (DEPENDENCY_UNAVAILABLE); rate limiting is unavailable (RATE_LIMIT_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      tags:
        - Auth
      operationId: post_auth_refresh
  /auth/password/request-reset:
