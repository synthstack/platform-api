    DataSourceDiscoverResponseData:
      type: object
      description: |
        BREAKING CHANGE in integrations 1.2.0: provider-discovered items moved from the previous top-level `data[]` list to `data.provider_items[]`.
        Provider-discovered data sources are exposed under the reserved `provider_items` key so raw provider identifiers are not transformed by idEncode.
      properties:
        provider_items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveredDataSource'
      required:
        - provider_items
      additionalProperties: false
    DataSourceRegisterRequestBody:
      type: object
      description: |
        Register a data source. Backend lookup runs when metadata is empty, kind is blank, or the submitted display_name is missing/blank. Nonempty metadata, kind and display_name skip lookup. A descriptor supplies the canonical kind, external_ref and nonblank display_name; provider metadata fills only empty client metadata. A successful null result permits manual registration, with kind inferred only when the backend supports exactly one kind. Credential/resource rejections return 422; dependency failures or invalid descriptors return 500/503. Failed lookup never permits manual fallback and does not create a data source.
      properties:
        kind:
          $ref: '#/components/schemas/DataSourceKind'
        external_ref:
          type: string
          minLength: 1
          maxLength: 512
        display_name:
          type: string
          maxLength: 255
          description: Optional display name. Blank values are normalized to external_ref.
        metadata:
          $ref: '#/components/schemas/IntegrationBoundedPayloadObject'
      required:
        - external_ref
    DataSourceUpdateRequestBody:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/DataSourceKind'
        external_ref:
          type: string
          minLength: 1
          maxLength: 512
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        metadata:
          $ref: '#/components/schemas/IntegrationBoundedPayloadObject'
    NewsId:
      type: string
      pattern: ^nws_[a-zA-Z0-9]{6,}$
      example: nws_aB3xYz
      description: Opaque news ID encoded by idEncode. Use an ID returned by the API; matching the pattern alone does not make an ID valid. Numeric IDs and IDs belonging to another entity are rejected with 404 NOT_FOUND.
    NewsType:
      type: string
      enum:
        - regular
        - terms
        - required
      description: terms and required require explicit acknowledgement and have immutable content after publication. terms are evergreen for all users; at most one terms news may be active, including scheduled news.
    NewsMarkdown:
      type: string
      minLength: 1
      maxLength: 50000
      description: Verbatim Markdown source, without server parsing, conversion or sanitization. For terms this is the canonical consent text. The character limit is configurable (message_max_length, default 50000, effective minimum limit 1); maxLength describes the shipped configuration. Text must be valid UTF-8 and is not trimmed. Clients must render Markdown safely.
    NewsTimestamp:
      type: string
      format: date-time
      pattern: ^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ(?![\s\S])
      example: '2026-10-13T12:00:00Z'
      description: Response timestamp in UTC, without fractional seconds. Stored microseconds are omitted from the response.
    NewsTitle:
      type: string
      minLength: 1
      maxLength: 255
      description: Nonempty valid UTF-8 title, without trimming. Length is measured in Unicode characters. title_max_length defaults to 255 and its effective limit is clamped to 1..255; maxLength describes the shipped configuration.
    NewsBoolean:
      type: boolean
      description: Strict JSON true or false. Strings, numbers and null are invalid (422 VALIDATION_ERROR).
    NewsPagination:
      type: object
      additionalProperties: false
      required:
        - total
        - limit
        - offset
        - has_more
      properties:
        total:
          type: integer
          minimum: 0
          description: Size of the entire filtered collection, including on an empty page beyond its end.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          description: Number of skipped items. Capped at PHP_INT_MAX minus limit when the page calculation would overflow.
        has_more:
          type: boolean
    NewsItem:
      type: object
      additionalProperties: false
      required:
        - id
        - date
        - title
        - message
        - type
      properties:
        id:
          $ref: '#/components/schemas/NewsId'
        date:
          $ref: '#/components/schemas/NewsTimestamp'
        title:
          $ref: '#/components/schemas/NewsTitle'
        message:
          $ref: '#/components/schemas/NewsMarkdown'
        type:
          $ref: '#/components/schemas/NewsType'
    NewsReadInput:
      type: object
      properties:
        acknowledged:
          allOf:
            - $ref: '#/components/schemas/NewsBoolean'
          default: false
      description: acknowledged is optional, defaults to false. terms/required require true on every call including retries. regular always stores false. User identity, read time, IP and user agent are server determined; body metadata is not used.
    NewsReadResult:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - acknowledged
        - read_at
        - message
      properties:
        id:
          $ref: '#/components/schemas/NewsId'
        status:
          type: string
          enum:
            - read
        acknowledged:
          type: boolean
        read_at:
          $ref: '#/components/schemas/NewsTimestamp'
        message:
          type: string
          example: News marked as read
          description: Action result text, not news Markdown content.
    NotificationId:
      type: string
