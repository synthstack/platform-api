    TaskNullableDateTime:
      type: string
      format: date-time
      nullable: true
    TaskObjectMap:
      type: object
      additionalProperties: true
    TaskExecutionActivityError:
      type: object
      description: Public activity error after associative JSON decoding and storage. Unlike the intended callback object entries, details entries can be objects or arrays; an empty input object is returned as []. No nested object restoration is applied.
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,99}$
          maxLength: 100
        message:
          type: string
          maxLength: 10000
        retryable:
          type: boolean
        details:
          description: Present when supplied and non-null. The callback also accepts named entries, so this can be an array or an object map. Values are objects or arrays with opaque contents; empty objects become arrays, including details:[{}] -> details:[[]].
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/TaskExecutionActivityErrorDetail'
            - type: object
              additionalProperties:
                $ref: '#/components/schemas/TaskExecutionActivityErrorDetail'
      required:
        - code
        - message
        - retryable
    TaskExecutionActivityErrorDetail:
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
    TaskLifecycleStatus:
      type: string
      enum:
        - open
        - closed
    TaskWorkflowStatus:
      type: string
      description: Workflow status of a task (`tasks.workflow_status`). This is the only task-status dimension for task UI. `ready_to_publish` means the iteration ended with an outcome accepted as successful by the system. It confirms neither the presence, review, finality nor publication of any type of result. `review` is not part of this enum.
      enum:
        - draft
        - queued
        - claimed
        - running
        - ready_to_publish
        - published
        - failed
        - cancel_requested
        - cancelled
    TaskExecutionStatus:
      type: string
      description: Status of one task execution (`task_executions.status`). Execution values such as `pending` and `completed` are not task workflow statuses and must not be used to override `tasks.workflow_status`.
      enum:
        - pending
        - queued
        - claimed
        - running
        - completed
        - failed
        - cancel_requested
        - cancelled
    TaskIterationStatus:
      type: string
      description: Status of one task iteration (`task_iterations.status`). An iteration is created in `queued` and can only transition to the terminal `completed`, `failed`, or `cancelled` states. Iterations have no intermediate in-progress status; clients must use execution status or `tasks.workflow_status` for claimed/running UI state.
      enum:
        - queued
        - completed
        - failed
        - cancelled
    TaskIterationTrigger:
      type: string
      enum:
        - initial
        - manual
        - retry
        - comment_feedback
        - agent_message
        - automation
    TaskManualIterationTrigger:
      type: string
      enum:
        - manual
        - retry
    TaskActivityKind:
